<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {

      tipLabel: "Coach's tip",
      eyebrow: "WEEK 4 · WED 17–18",
      title: "Klump, Tempo Version",
      focus: "Stays on rung 2 rather than opening rung 3 — Thursday's dribble-allowed games weren't the clear standout, so spacing needs another week under the constraint that's actually proving it out. \"Playing fast\" gets folded in as a deepening of that same idea, not a separate new concept: Klump evolves by tightening the pass clock toward 2 seconds and explicitly coaching sprint-to-space rather than walk-to-space. Warm-up adds one new piece — the partner-jump temperaturstegring variants held back since Week 3 — following the same one-new-thing-at-a-time queue. Dribbling gets a dedicated skill slot too, deliberately framed as separate from how we play in games: the goal is still excellent ball-handlers, the no-dribble games just remove dribble as the easy way to avoid a decision.",
      sections: [
        {
          id: "s1", title: "Opening Circle — Incheckning", duration: 5,
          body: "Quick gather. Recall Thursday's games.\n\nSay: \"Vad var bäst i torsdags — Klump, 2mot1?\"\n\nTell the group today's theme: spela snabbt — playing fast, not just smart."
        },
        {
          id: "s2", title: "Warm-Up — Adding the Partner-Jump Pieces", duration: 11,
          body: "Focus: one new piece today — the two partner-jump temperaturstegring variants held back since Week 3. Everything else stays familiar.\n\nCues throughout: \"Knä över tå,\" \"Kontroll,\" \"Upprätt position\"\n\n- Temperaturstegring, del 1 & 2 (3 min): familiar, just call it out.\n- Temperaturstegring, del 3 & 4 (3 min) — new today: 4 dribbles forward, 1 inward, pick up and jump together shoulder-to-shoulder with your partner; then a slide-with-dribbling variant — after 4 dribbles, pick up, jump up, and bang the balls together.\n- Plankan (1 min).\n- Knäböj + utfallssteg med boll (2 min).\n- Enbensknäböj (2 min): now familiar from last week."
        },
        {
          id: "s3", title: "Dribbling — Pound & Move", duration: 6,
          body: "Focus: dedicated ball-handling skill volume, weak-hand emphasis — separate from decision-making, which lives in the games below.\nSetup: players spread out, each with a ball.\n\nHow: coach calls sequences — \"Höger 10! Vänster 10! Alternera!\"\n\nSay: \"Svag hand nu! Det är svårt men det är meningen!\"\n\nEasier: seated/kneeling for beginners. Harder: eyes closed for 5 dribbles, or low dribble below the knee."
        },
        {
          id: "s4", title: "Klump, Tempo Version", duration: 16,
          body: "Focus: same spacing lesson as Week 3, deepened with tempo — tighter clock, explicit sprint-to-space coaching. This is where \"playing fast\" actually gets taught.\nSetup: 3v3, half court, real basket, live defense, no dribble. ~2m klump-zon around the ball, moves with the ball.\n\nSay it (1 min): \"Samma som förra veckan, men snabbare — två sekunder att passa, och du SPRINGER till ytan, inte går.\"\n\nShow it (1 min): quick live demo — catch, sprint to open ground, no klump.\n\nWalk it (2 min): half-speed reps, no defense, just the movement pattern.\n\nTalk it (1 min): pairs — \"Säg till din kompis var ni ska springa.\"\n\nPlay it (10 min): live 3v3 to 1 basket, then reset. Clock drops to 2 seconds (from 3 last week). Klump-zon rule as before.\n\nSay: \"Två sekunder! Spring — inte gå!\"\n\nSay: \"Ett... två... BOLL BYTE!\"\n\n40-second rule: after the third live round, 40 seconds of silent replay — \"Blunda i 40 sekunder, tänk på var du sprang.\"\n\nEasier: keep a 3-second version running for groups still shaky. Harder: shrink the zone further.\n\nPeppa moment: name a sprint-to-space that led to a real shot look."
        },
        {
          id: "s5", title: "Shooting — BEEF, Continued", duration: 8,
          body: "Focus: same recurring habit-build as recent weeks, form-only.\nSetup: pairs, close range.\n\nSay: \"Knän, armbåge under bollen, följ med handen!\"\n\n40-second rule after the third make each."
        },
        {
          id: "s6", title: "3v2 Half-Court Shell", duration: 9,
          body: "Focus: apply today's tempo-Klump concept with a numbers advantage — guided rep, not the open test. Thursday's free games are the real test again.\nSetup: half court, 3 attackers vs. 2 defenders, rotate through.\n\nSay: \"Spring till ytan — trippelhot, titta upp!\"\n\nPeppa moment: name a fast, decisive read."
        },
        {
          id: "s7", title: "Closing Circle — Utcheckning", duration: 5,
          body: "Say: \"Vem sprang snabbast till en bra yta idag?\"\n\nClose with hands in the middle: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "The real question for Thursday isn't just \"did spacing show up\" anymore — it's \"did it show up even when dribble is allowed.\" That's the actual bar for calling rung 2 done and opening rung 3. Keep leaning on no-dribble as the primary teaching tool; it's earned that role three-plus weeks running now, this isn't a one-off."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 4 · THU 18–19",
      title: "Match Week — Play & Apply",
      focus: "Same first four blocks as the standard template — no-dribble reinforcement, then the dribble-allowed comparison — followed by two games instead of the usual single scrimmage: Game 3 is the free 3v3 test of whether rung 2 (spacing / move-after-pass) holds without the crutch, and Game 4 is new — full-court 4v4, standard rules — because there's a real game Sunday and the team needs the actual format in their legs before then. Game 4 is match preparation and live reinforcement, not a ladder promotion or a gating test: rung status is set by Game 3 alone.",
      sections: [
        {
          id: "t1", title: "Opening Circle — Incheckning", duration: 5,
          body: "Greet every player by name as they arrive — get there early enough to manage this individually, not as a group scan. Quick round: one word on how everyone's feeling. State tonight's plan in plain terms.\n\nSay: \"Vi kör samma spel som igår kväll, sen provar vi något nytt — en riktig match-övning, för på söndag ska ni spela på riktigt!\"\n\nRemind the team about Sunday's game (time, place, what to bring) so it lands twice — once now, once at closing.\n\nSay: \"Samling! Kolla här — på söndag är det match. Ikväll övar vi på precis det.\""

        {

          body: "Focus: ball movement and spacing without the dribble as a fallback — the \"No-Dribble Flow\" constraint, forcing players to move to create passing angles instead of relying on the ball.\nSetup: half court, 3v3 or 4v4 depending on numbers. No dribble allowed for offense.\n\nHow: offense can only pass and move — no dribbling. Defense plays normal man-to-man. If offense dribbles, turnover to defense. If the ball stays still for 3 seconds (nobody moving to get open), coach counts aloud and awards possession to defense — this is the \"klump\" check: are players clumping near the ball instead of spreading the floor. Rotate groups through every few minutes so everyone gets touches against different opponents.\n\nSay: \"Inga dribblingar! Rör på benen istället för bollen. Ett... två... tre... bollbyte!\"\n\nEasier: allow one dribble per possession for players who are still struggling with the no-dribble constraint. Harder: require a minimum number of passes (e.g. 4) before a shot is allowed."
        },
        {
          id: "t4", title: "2v2 Half Court, Dribble Allowed", duration: 9,
          body: "Focus: direct comparison rep — same spacing/movement principle as the previous block, but now with the dribble available, to see whether the habit holds once the crutch is back in play.\nSetup: half court, split into 2v2 groups across multiple baskets/zones to maximize reps and keep queues short.\n\nHow: live 2v2, dribble allowed, normal rules. Watch specifically for whether players still relocate after passing or default straight back to dribbling everything themselves now that they can. No forced pass count — this is a freer rep than the no-dribble block, but still smaller-sided than Game 3.\n\nSay: \"Samma sak som nyss — men nu får ni dribbla. Glöm inte att röra på er!\"\n\nEasier: coach can call out \"Passa!\" as a live prompt if a group is stuck. Harder: add a condition — basket only counts if it follows at least one pass."
        },
        {
          id: "t5", title: "Game 3 — 3v3 Half Court, Free Play — Real Test", duration: 11,
          body: "Focus: the rung-2 gate. No constraints, dribble allowed — the honest, unprompted check on whether spacing and tempo survive without the klump-zon rule or the pass clock from the earlier blocks. This is the sole signal used to judge whether rung 2 (move-after-pass / spacing) has actually stuck.\nSetup: half court, 3v3, groups rotating every 2–3 minutes so different combinations of players are tested together.\n\nHow: free play, standard rules, no coaching during live play — observe and note, don't intervene. Watch specifically for: do players relocate after passing without being told; is there any spontaneous spacing; does tempo hold up without the clock forcing it. Keep a mental (or written) tally per player or per group rather than judging the team as one block, since this is a mixed-level group and the read will likely be mixed again.\n\nSay: \"Ha kul, testa saker — och peppa varandra!\" — and otherwise, stay quiet and watch.\n\nEasier: none — deliberately unconstrained; don't soften it even for weaker groups, since a softened version stops being the real test. Harder: none — same reasoning; don't add complexity either, since that would confound the read the same way Game 4 does."
        },

        {
          id: "s3", title: "Dribbling — Studsa & Rör dig", duration: 6,
          body: "Fokus: dedikerad bollhanteringsvolym, med fokus på svag hand — separat från beslutsfattande, som ligger i lekarna nedan.\nUppställning: spelarna sprider ut sig, en boll var.\n\nSå här: tränaren ropar sekvenser — \"Höger 10! Vänster 10! Alternera!\"\n\nSäg: \"Svag hand nu! Det är svårt men det är meningen!\"\n\nLättare: sittande/knästående för nybörjare. Svårare: blunda i 5 dribblingar, eller lågt dribbel under knähöjd."

        {
          id: "s4", title: "Klump, Tempoversion", duration: 16,

    thu: {
      tipLabel: "Tränartips",

      title: "Matchvecka — Spela & tillämpa",
      focus: "Samma första fyra block som standardmallen — förstärkning av ingen-dribbling, sedan jämförelsen med dribbling tillåten — följt av två lekar istället för den vanliga enskilda matchen: Lek 3 är det fria 3mot3-testet av om steg 2 (spacing / förflyttning efter passning) håller utan krycka, och Lek 4 är ny — helplan 4mot4, vanliga regler — eftersom det är en riktig match på söndag och laget behöver känna det faktiska formatet i benen innan dess. Lek 4 är matchförberedelse och levande förstärkning, inte en stegförflyttning eller ett grindtest: steg-status avgörs av Lek 3 ensam.",
      sections: [

          body: "Hälsa varje spelare vid namn när de kommer — kom dit tillräckligt tidigt för att hinna med det individuellt, inte som en gruppöverblick. Snabb runda: ett ord om hur alla känner sig. Beskriv kvällens plan i klartext.\n\nSäg: \"Vi kör samma spel som igår kväll, sen provar vi något nytt — en riktig match-övning, för på söndag ska ni spela på riktigt!\"\n\nPåminn laget om söndagens match (tid, plats, vad de ska ta med) så det landar två gånger — en gång nu, en gång vid avslutningen.\n\nSäg: \"Samling! Kolla här — på söndag är det match. Ikväll övar vi på precis det.\""

          body: "Fokus: bollrörelse och spacing utan dribbling som reserv — begränsningen \"ingen-dribbling-flöde\", som tvingar spelarna att röra sig för att skapa passningsvinklar istället för att förlita sig på bollen.\nUppställning: halvplan, 3mot3 eller 4mot4 beroende på antal. Ingen dribbling tillåten för anfall.\n\nSå här: anfallet får bara passa och röra sig — ingen dribbling. Försvaret spelar vanlig man-mot-man. Om anfallet dribblar blir det bollbyte till försvaret. Om bollen står still i 3 sekunder (ingen rör sig för att bli fri) räknar tränaren högt och ger bollen till försvaret — det här är \"klump\"-kontrollen: klumpar sig spelarna nära bollen istället för att sprida planen. Rotera grupperna genom var några minuter så alla får möta olika motståndare.\n\nSäg: \"Inga dribblingar! Rör på benen istället för bollen. Ett... två... tre... bollbyte!\"\n\nLättare: tillåt en dribbling per boll-innehav för spelare som fortfarande kämpar med ingen-dribbling-begränsningen. Svårare: kräv ett minsta antal passningar (t.ex. 4) innan ett skott får tas."
        },
        {
          id: "t4", title: "2mot2 halvplan, dribbling tillåten", duration: 9,
          body: "Fokus: direkt jämförelserep — samma spacing-/rörelseprincip som föregående block, men nu med dribbling tillgänglig, för att se om vanan håller när kryckan är tillbaka.\nUppställning: halvplan, uppdelat i 2mot2-grupper vid flera korgar/zoner för att maximera antalet repetitioner och hålla köerna korta.\n\nSå här: levande 2mot2, dribbling tillåten, vanliga regler. Titta specifikt på om spelarna fortfarande flyttar sig efter en passning eller om de går tillbaka till att dribbla allt själva nu när de får. Inget påtvingat antal passningar — det här är en friare rep än ingen-dribbling-blocket, men fortfarande mindre än Lek 3.\n\nSäg: \"Samma sak som nyss — men nu får ni dribbla. Glöm inte att röra på er!\"\n\nLättare: tränaren kan ropa \"Passa!\" som en levande påminnelse om en grupp fastnar. Svårare: lägg till ett villkor — korgen räknas bara om den kommer efter minst en passning."
        },
        {
          id: "t5", title: "Lek 3 — 3mot3 halvplan, fri lek — det riktiga testet", duration: 11,
          body: "Fokus: steg 2-grinden. Inga begränsningar, dribbling tillåten — den ärliga, ouppmanade kontrollen av om spacing och tempo överlever utan klump-zon-regeln eller passklockan från de tidigare blocken. Det här är det enda tecknet som används för att avgöra om steg 2 (förflyttning efter passning / spacing) faktiskt har fastnat.\nUppställning: halvplan, 3mot3, grupper roterar var 2–3:e minut så olika spelarkombinationer testas tillsammans.\n\nSå här: fri lek, vanliga regler, ingen coachning under levande spel — observera och anteckna, ingrip inte. Titta specifikt efter: flyttar sig spelarna efter en passning utan att bli tillsagda; finns det någon spontan spacing; håller tempot i sig utan att klockan tvingar fram det. Håll en mental (eller skriven) avstämning per spelare eller grupp istället för att bedöma laget som en enda enhet, eftersom det här är en grupp med blandad nivå och utfallet sannolikt blir blandat igen.\n\nSäg: \"Ha kul, testa saker — och peppa varandra!\" — och i övrigt: håll dig tyst och titta.\n\nLättare: ingen — medvetet obegränsad; mjuka inte upp den ens för svagare grupper, eftersom en uppmjukad version slutar vara det riktiga testet. Svårare: ingen — samma resonemang; lägg inte heller till komplexitet, eftersom det skulle förvirra utfallet på samma sätt som Lek 4 gör."
        },
        {
          id: "t6", title: "Lek 4 — helplan 4mot4, matchsimulering, ny", duration: 12,
          body: "Fokus: direkt förberedelse för söndag — riktigt format, riktiga spacing-krav, riktiga rotationer. Första gången den här säsongen på fullt 4mot4, medvetet tidigarelagd för matchberedskap snarare än för att stegen krävde det. Inte grindad — fri att coacha levande här. Första gången alla fyra stegens vanor (läsning, spacing, beslutsamhet, försvar) måste samexistera samtidigt på helplan — förvänta dig ingen polityr, titta bara på hur mycket som överförs.\nUppställning: helplan, två 4-spelarlag levande. Extra spelare roterar in på en timer (t.ex. var 2–3:e minut, eller efter ett försvarsstopp) för att hålla speltiden ungefär jämn över truppen — det här är en generalrepetition av den faktiska bytes-logistiken söndagen kommer att kräva, så behandla själva rotationen som något att få rätt, inte bara spelet.\n\nSå här: vanligt 4mot4, dribbling tillåten, vanligt försvar i båda ändarna, löpande poängräkning istället för att stanna vid en korg — närmare hur söndagen faktiskt kommer att kännas. Till skillnad från Lek 3 är tränaren aktiv här: peka ut spacing, fira en bra förflyttning efter en passning, namnge kommunikation i försvar. Den här leken fungerar också som en informell, sekundär koll av samma steg-2-vanor, men under verklig komplexitet (nytt helplansformat, fler spelare, levande försvar) — ett bakslag här är förväntat och ska inte tolkas som att vanan misslyckats; det är förväxlat med att allt är nytt på samma gång.\n\nSäg: \"Vem är fri? Peppa varandra — precis som söndag!\"\n\nPeppa-stund: namnge bra lagbeteende specifikt kopplat till vad söndagen kräver — kommunikation, kämpaglöd, stötta upp en miss."
        },
        {
          id: "t7", title: "Avslutningscirkel — Utcheckning", duration: 5,
          body: "Fråga 1–2 spelare vad de tyckte gick bra i Lek 4 (låt dem namnge det innan du gör det). Namnge en specifik försvars- eller lagkultur-stund du såg, tydligt kopplad till vad söndagen kräver. Bekräfta logistiken för söndag högt — tid, plats, vad de ska ta med, ankomsttid — och kolla att ingen har frågor.\n\nSäg: \"Bra jobbat ikväll! Kom ihåg — söndag, [tid], [plats]. Vi ses där!\""
        }
      ],
      tip: "Håll Lek 4 lågt tryck och observerande snarare än korrigerande — det är exponering, inte ett test att misslyckas med. Vilka luckor som än visar sig (och det kommer att finnas några, första gången på fullt 4mot4) är användbar information för vad som ska betonas mellan nu och söndag, inte en anledning att bli orolig eller övercoacha i stunden. Lek 3 förblir den enda leken som används för att avgöra om steg 2 faktiskt har fastnat."
    }
    }
  };

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
