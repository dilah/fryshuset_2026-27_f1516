<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {
    en: {
    wed: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 13 · WED 17–18",
      title: "Repetition — Real Match Week",
      focus: "No new concepts — four recap themes, all games the girls already know or a known game with one new twist: quick inbound (snabbt inkast), continuous movement with give-and-go, defence (Muren), and passes. Different from last week on purpose: swaps in different vehicles (No-dribble Muren, Inkast-racet with a chaser) so the same ideas feel fresh, not a replay. Standing rules all week: tempo over perfect passes, hugging gives the attacker a point, and after a basket the coach never hands the ball back — the nearest girl takes it and inbounds. Wednesday is the harder day; Thursday is short bursts with real rests so legs are fresh for the weekend's games.",
      sections: [
        {
          id: "s1", title: "Incheckning", duration: 2,
          body: "Circle.\n\nSay: \"I helgen har vi match! Den här veckan tränar vi på fyra saker vi redan kan: snabbt inkast, passa och spring, Muren och bra passningar.\"\n\nAsk one girl:\n\nSay: \"Vad gör du efter att du har passat?\"\n\n(Answer you want: \"Springer!\")"
        },
        {
          id: "s2", title: "Warm-Up — Snabbstart-Sprint Med Boll", duration: 10,
          body: "Known warm-up (week 11). Source: SBBF fysträning, competition sprints with varied start positions, ball added. Uses the big hall's full length, and Wednesday is the right day for the running.\nSetup: everyone on the baseline, one ball each.\n\nHow:\n\n- Rounds 1–3 (no ball, 3 min): vary the start position — sitting, lying on the stomach, lying on the back, facing backwards. Coach claps → sprint to half-court, jog back. 10–20 s rest.\n- Rounds 4–7 (ball, 4 min): same starts, ball on the floor beside them. Clap → grab the ball, speed dribble to the far free-throw line, stop, look up (coach holds up fingers, girls shout the number), dribble back with the weak hand.\n- Rounds 8–9 (pairs race, 3 min): one ball between two. Clap → first to the ball dribbles, the other chases (tag the back = point). Swap roles.\n\nSay: \"När jag klappar — upp och iväg! Snabbast vinner.\"\n\nSay: \"Titta upp! Hur många fingrar?\"\n\nSay: \"Tillbaka med svaga handen!\"\n\nPairing tip (rounds 8–9): pair girls of similar speed so the race is close."
        },
        {
          id: "s3", title: "Drill 1 — Inkast-Racet Med Jagare", duration: 12,
          body: "Focus: quick inbound + forward pass + give-and-go at tempo. Known drill (week 11) plus one twist: a chaser.\nSetup: full court. Groups of 3 behind the baseline. The coach holds the ball under the basket. One extra girl (the chaser) waits at the free-throw line.\n\nHow: the coach drops the ball through the hoop (= \"they just scored\"). The closest girl grabs it and steps out behind the baseline. The other two sprint wide to the sidelines. Inbound to a wing → pass ahead → finish at the far end. The twist: the chaser starts when the inbound pass is thrown. A slow inbound = the chaser catches up and it becomes 3v1. Coach counts out loud. Basket before 8 = 1 point. Give-and-go basket = 2 points. Rotate: the chaser joins the next group, one girl from the finishing group becomes the next chaser.\n\nSay: \"Närmast tar bollen — direkt!\"\n\nSay: \"Ut till kanten, spring framåt!\"\n\nSay: \"Fort, innan jagaren kommer!\"\n\nRecap check (talk it, 1 min, after round 3):\n\nSay: \"Säg till din kompis: vem tar inkastet, och var springer de andra?\"\n\n40-second rule after round 3:\n\nSay: \"Nu stänger vi ögonen i 40 sekunder och tänker på vad vi just gjorde.\"\n\nEasier: chaser starts at half-court (more head start). Harder: count to 6."
        },
        {
          id: "s4", title: "Drill 2 — Muren Utan Dribbling (3v3)", duration: 12,
          body: "Source: Bartzokas \"No-Dribble Flow\" + Muren rules. Focus: defence + passes + movement without the ball.\nSetup: two half-courts (big hall), 3v3 on each. Waiting girls rotate in after every basket.\n\nRules:\n\n- Offence: no dribbling, pass and move only. A dribble = turnover. The ball still for 3 seconds = the defence gets it (coach counts).\n- Defence: Muren. Body between your player and the basket. Hugging = a point to the attacker.\n- Give-and-go basket = 2 points.\n- Frys-kollen (2–3 times in total, not more): the coach shouts \"FRYS!\" Everyone freezes. Defenders check themselves, then play on.\n\nSay: \"Står jag mellan henne och korgen?\"\n\nWhy this combination: with no dribble, the attackers have to cut and move to get open. That forces the defenders to keep moving with their player, which is exactly the wall habit under pressure.\n\nSay: \"Inga dribblingar! Rör på benen istället för bollen.\"\n\nSay: \"Mur! Fötterna, inte armarna.\"\n\nSay: \"Var mellan henne och korgen!\"\n\nEasier: allow 1 dribble per possession. Harder: 4 passes before a shot."
        },
        {
          id: "s5", title: "Scrimmage — Full-Court 4v4, Match Rehearsal", duration: 20,
          body: "Focus: everything together, at match tempo, with your real squads and substitutions.\nSetup: full court. Two teams of 4 + substitutes. Run your actual weekend rotation on a timer.\n\nRules:\n\n- After a basket: the nearest girl inbounds, coach counts 5. Not in = ball to the other team.\n- Give-and-go basket = 2 points.\n- Hugging = 1 point to the attacker.\n- Coach's timeout once, at ~min 10:\n\nSay: \"Okej, ni har 30 sekunder. Bestäm själva vad ni ska göra.\"\n\nOne girl leads. Coach says nothing.\n\nCoach: reinforce live here. Call out fast inbounds, good walls and \"HIT!\" cuts by name. Praise passes and defence, not only baskets."
        },
        {
          id: "s6", title: "Cool-Down / Talk", duration: 4,
          body: "Circle.\n\nSay: \"Vem såg någon som var en bra mur idag?\"\n\nPeers name a teammate.\n\nOne takeaway:\n\nSay: \"Passar du? Då springer du.\"\n\nSay: \"Superbra träning! Vi ses imorgon!\""
        }
      ],
      tip: "In the scrimmage, watch who stops after passing — those are the girls to pair with a stronger teammate on Thursday."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 13 · THU 18–19",
      title: "Repetition — Light Legs Before the Weekend",
      focus: "Small hall, light legs. Four known games, each with the same four themes recapped once more before the weekend's real matches: quick inbound, continuous give-and-go, Muren, and quick decisions. Game 3 (free 3v3, no coaching) is the last look at what the girls do on their own — use it to choose one reminder for the match talk.",
      sections: [
        {
          id: "t1", title: "Incheckning", duration: 2,
          body: "Say: \"Igår sprang vi mycket på stor plan. Idag är hallen liten: snabba inkast, snabba passningar och Muren.\""
        },
        {
          id: "t2", title: "Warm-Up — Het Potatis-Kull", duration: 8,
          body: "Known version: taggers have no ball. Only a girl holding a ball can be tagged, so the ball must move fast. Small hall = more pressure = faster passes. Add 1–2 extra balls in the last 3 minutes.\n\nNew twist: bounce passes only for the last 2 minutes.\n\nSay: \"Bollen är het! Släpp den snabbt!\""
        },
        {
          id: "t3", title: "Game 1 — 3-Sekunders-Inkast (2v2)", duration: 10,
          body: "Known game (week 11).\n\n- Normal 2v2 half-court.\n- After a basket, the defending pair inbounds from the baseline. Coach counts 3. Not in by 3 = ball to the other team.\n- The receiver must get open (\"spelbar\"): fake one way, go the other.\n- Defenders play Muren on the inbound receiver.\n\nSay: \"Ett — två — tre! Snabbt in!\"\n\nSay: \"Gör dig spelbar!\"\n\nEasier: count to 5. Harder: full denial on the receiver."
        },
        {
          id: "t4", title: "Game 2 — Klump Med HIT-Bonus (3v3)", duration: 12,
          body: "Known game. Focus: spacing + continuous give-and-go + quick passes.\n\n- Klump spacing rules + 2-second pass clock.\n- Give-and-go basket (\"HIT!\") = 2 points.\n- Continuous: after a basket, the defending team inbounds immediately (3-count). No stopping between possessions.\n\nCoach: quiet in live play. At the water break ask before saying anything yourself.\n\nSay: \"Vad hände där ute?\"\n\nPairing tip: put Wednesday's \"stoppers\" with a stronger teammate."
        },
        {
          id: "t5", title: "Game 3 — Fri 3v3 — No Coaching", duration: 10,
          body: "No constraints, no bonuses. Only the standing rules (quick inbound, hugging = point).\nThe coach watches and stays quiet. This is the last chance before the games to see what they do on their own:\n\n- After a basket, does the nearest girl inbound without being told?\n- After a pass, do they move or stop?\n- Defence: wall with feet, or hugging with arms?\n\nUse what you see to choose one reminder for the match talk."
        },
        {
          id: "t6", title: "Game 4 — Snabba Kungen (3v3 King of the Court)", duration: 12,
          body: "Known game, the fun finish.\n\n- Score = you stay on. The next team sprints in and inbounds immediately.\n- 3 baskets in a row = leave anyway (everyone plays).\n- Waiting teams cheer and get ready.\n\nCoach reinforces live: call out quick inbounds and good walls by name."
        },
        {
          id: "t7", title: "Match Talk", duration: 6,
          body: "Sitting in a circle. Let the girls answer before you say it:\n\n- \"Vad gör vi när de har gjort korg?\" → nearest girl takes it, quick inbound, others run wide.\n- \"Vad gör du efter att du passat?\" → move! Give-and-go.\n- \"Hur försvarar vi?\" → Mur, feet not arms.\n- \"Om man gör ett misstag?\" → \"Nästa boll!\"\n\nPlus the one reminder you picked from Game 3.\n\nSay: \"Ni har tränat jättebra. Nu ska vi ha kul i helgen!\""
        }
      ],
      tip: "Never hand the ball back after a basket, in any game — let it drop, the nearest girl takes it. Count out loud, always; the counting creates urgency without you directing anything. This isn't a hard session: if the girls look tired, cut Game 3 to 6 min and give the time to rests — fresh legs beat one more drill. Small-hall safety: keep the baseline inbound spot 1–2 m from the wall, and keep waiting girls off the court line."
    }
    },
    sv: {
    wed: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 13 · ONS 17–18",
      title: "Repetition — Den Riktiga Matchveckan",
      focus: "Inga nya koncept — fyra repetitionsteman, allt lekar tjejerna redan kan eller en känd lek med en ny twist: snabbt inkast, kontinuerlig rörelse med give-and-go, försvar (Muren), och passningar. Medvetet annorlunda än förra veckan: byter in andra verktyg (Muren utan dribbling, Inkast-racet med en jagare) så samma idéer känns nya, inte en repris. Stående regler hela veckan: fart före perfekta passningar, en kram ger anfallaren en poäng, och efter en korg lämnar tränaren aldrig över bollen — den närmaste tjejen tar den och kastar in. Onsdagen är den tuffare dagen; torsdagen är korta ryck med riktig vila så benen är fräscha inför helgens matcher.",
      sections: [
        {
          id: "s1", title: "Incheckning", duration: 2,
          body: "Samling.\n\nSäg: \"I helgen har vi match! Den här veckan tränar vi på fyra saker vi redan kan: snabbt inkast, passa och spring, Muren och bra passningar.\"\n\nFråga en tjej:\n\nSäg: \"Vad gör du efter att du har passat?\"\n\n(Svaret du vill ha: \"Springer!\")"
        },
        {
          id: "s2", title: "Uppvärmning — Snabbstart-Sprint Med Boll", duration: 10,
          body: "Känd uppvärmning (vecka 11). Källa: SBBF fysträning, tävlingssprint med varierade startpositioner, boll tillagd. Använder hela den stora hallens längd, och onsdagen är den rätta dagen för löpningen.\nUppställning: alla på baslinjen, en boll var.\n\nSå här:\n\n- Omgång 1–3 (ingen boll, 3 min): variera startposition — sittande, liggande på mage, liggande på rygg, vänd baklänges. Tränaren klappar → sprinta till mittplan, jogga tillbaka. 10–20 s vila.\n- Omgång 4–7 (boll, 4 min): samma starter, boll på golvet bredvid dem. Klapp → ta bollen, snabbdribbla till den bortre frikastlinjen, stopp, titta upp (tränaren håller upp fingrar, tjejerna ropar numret), dribbla tillbaka med svaga handen.\n- Omgång 8–9 (parkapplöpning, 3 min): en boll mellan två. Klapp → den som är först vid bollen dribblar, den andra jagar (tagga ryggen = poäng). Byt roller.\n\nSäg: \"När jag klappar — upp och iväg! Snabbast vinner.\"\n\nSäg: \"Titta upp! Hur många fingrar?\"\n\nSäg: \"Tillbaka med svaga handen!\"\n\nParningstips (omgång 8–9): para tjejer med liknande fart så loppet blir jämnt."
        },
        {
          id: "s3", title: "Övning 1 — Inkast-Racet Med Jagare", duration: 12,
          body: "Fokus: snabbt inkast + passning framåt + give-and-go i tempo. Känd övning (vecka 11) plus en twist: en jagare.\nUppställning: helplan. Grupper om 3 bakom baslinjen. Tränaren håller bollen under korgen. En extra tjej (jagaren) väntar vid frikastlinjen.\n\nSå här: tränaren tappar bollen genom korgen (= \"de gjorde just mål\"). Den närmaste tjejen tar den och kliver ut bakom baslinjen. De andra två sprintar brett mot sidlinjerna. Inkast till en wing → passning framåt → avslut i den bortre änden. Twisten: jagaren startar när inkastpassningen kastas. Ett långsamt inkast = jagaren hinner upp och det blir 3mot1. Tränaren räknar högt. Mål före 8 = 1 poäng. Give-and-go-mål = 2 poäng. Rotation: jagaren går med i nästa grupp, en tjej från den avslutande gruppen blir nästa jagare.\n\nSäg: \"Närmast tar bollen — direkt!\"\n\nSäg: \"Ut till kanten, spring framåt!\"\n\nSäg: \"Fort, innan jagaren kommer!\"\n\nRepetitionskoll (prata om det, 1 min, efter omgång 3):\n\nSäg: \"Säg till din kompis: vem tar inkastet, och var springer de andra?\"\n\n40-sekundersregeln efter omgång 3:\n\nSäg: \"Nu stänger vi ögonen i 40 sekunder och tänker på vad vi just gjorde.\"\n\nLättare: jagaren startar vid mittplan (större försprång). Svårare: räkna till 6."

        {
          id: "s4", title: "Övning 2 — Muren Utan Dribbling (3mot3)", duration: 12,
          body: "Källa: Bartzokas \"No-Dribble Flow\" + Muren-regler. Fokus: försvar + passningar + rörelse utan bollen.\nUppställning: två halvplaner (stora hallen), 3mot3 på varje. Väntande tjejer roterar in efter varje korg.\n\nRegler:\n\n- Anfall: ingen dribbling, bara passa och röra sig. En dribbling = bollbyte. Bollen still i 3 sekunder = försvaret får den (tränaren räknar).\n- Försvar: Muren. Kroppen mellan din spelare och korgen. Kram = en poäng till anfallaren.\n- Give-and-go-mål = 2 poäng.\n- Frys-kollen (2–3 gånger totalt, inte fler): tränaren ropar \"FRYS!\" Alla fryser. Försvararna kollar sig själva, spelar sedan vidare.\n\nSäg: \"Står jag mellan henne och korgen?\"\n\nVarför den här kombinationen: utan dribbling måste anfallarna skära och röra sig för att bli fria. Det tvingar försvararna att hålla sig rörliga med sin spelare, vilket är exakt murvanan under press.\n\nSäg: \"Inga dribblingar! Rör på benen istället för bollen.\"\n\nSäg: \"Mur! Fötterna, inte armarna.\"\n\nSäg: \"Var mellan henne och korgen!\"\n\nLättare: tillåt 1 dribbling per boll-innehav. Svårare: 4 passningar innan ett skott."
        },

          id: "s5", title: "Match — Helplan 4mot4, Matchrepetition", duration: 20,

          body: "Cirkel.\n\nSäg: \"Vem såg någon som var en bra mur idag?\"\n\nKompisar namnger en lagkompis.\n\nEn slutsats:\n\nSäg: \"Passar du? Då springer du.\"\n\nSäg: \"Superbra träning! Vi ses imorgon!\""
        }

      tip: "I matchen, titta på vem som stannar efter en passning — det är de tjejerna att para med en starkare lagkompis på torsdagen."

      focus: "Liten hall, lätta ben. Fyra kända lekar, var och en med de fyra temana repeterade en gång till inför helgens riktiga matcher: snabbt inkast, kontinuerligt give-and-go, Muren, och snabba beslut. Lek 3 (fritt 3mot3, ingen coachning) är den sista titten på vad tjejerna gör på egen hand — använd den för att välja en påminnelse till matchpratet.",
      sections: [

        {

          body: "Inga begränsningar, inga bonusar. Bara de stående reglerna (snabbt inkast, kram = poäng).\nTränaren tittar och håller sig tyst. Det här är den sista chansen innan matcherna att se vad de gör på egen hand:\n\n- Efter en korg, kastar den närmaste tjejen in utan att bli tillsagd?\n- Efter en passning, rör de sig eller stannar de?\n- Försvar: mur med fötterna, eller kram med armarna?\n\nAnvänd det du ser för att välja en påminnelse till matchpratet."
        },
        {
          id: "t6", title: "Lek 4 — Snabba Kungen (3mot3 Kung På Planen)", duration: 12,
          body: "Känd lek, det roliga avslutet.\n\n- Mål = ni stannar kvar. Nästa lag sprintar in och kastar in direkt.\n- 3 korgar i rad = går av ändå (alla spelar).\n- Väntande lag hejar och gör sig redo.\n\nTränaren förstärker levande: ropa ut snabba inkast och bra murar vid namn."
        },
        {
          id: "t7", title: "Matchprat", duration: 6,
          body: "Sittande i en cirkel. Låt tjejerna svara innan du säger det:\n\n- \"Vad gör vi när de har gjort korg?\" → den närmaste tjejen tar den, snabbt inkast, de andra springer brett.\n- \"Vad gör du efter att du passat?\" → rör dig! Give-and-go.\n- \"Hur försvarar vi?\" → Mur, fötterna inte armarna.\n- \"Om man gör ett misstag?\" → \"Nästa boll!\"\n\nPlus den enda påminnelse du valde från Lek 3.\n\nSäg: \"Ni har tränat jättebra. Nu ska vi ha kul i helgen!\""
        }
      ],
      tip: "Lämna aldrig över bollen efter en korg, i någon lek — låt den studsa, den närmaste tjejen tar den. Räkna högt, alltid; räkningen skapar brådska utan att du styr något. Det här är inget tufft pass: om tjejerna ser trötta ut, korta Lek 3 till 6 min och ge tiden till vila — fräscha ben slår en övning till. Säkerhet i den lilla hallen: håll baslinje-inkastplatsen 1–2 m från väggen, och håll väntande tjejer utanför planlinjen."

    }
  };

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
