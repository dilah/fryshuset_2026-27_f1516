<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {
    en: {
    wed: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 8 · WED 17–18",
      title: "Give-and-Go & Boxing Out — Match-Week Volume",
      focus: "No new concepts — give-and-go (rung 2) and boxing out are both already known; this week is volume and confidence before Saturday's match, not new teaching. Boxing out doubles as a rung-3 seed: \"stay between her and the basket\" is the same idea as goal-side marking, and it addresses the transition-defense weakness after offensive rebounds. Speed over perfect passes — fast play with some loose passes is better than slow, careful play; nobody stops a rep for pass quality, and technique cues stay to one short phrase.",
      sections: [
        {
          id: "s1", title: "Warm-Up — BasketSmart 1", duration: 10,
          body: "Focus: the official BasketSmart warm-up, shortened, ball in hand throughout.\nSetup: whole group, each with a ball, along the baseline.\n\nHow:\n\n- Temperature raise (5 min): 4 dribbles forward, 2 back; shoulder-to-shoulder running; dribble + jump to each other; slide with dribble. Switch hand every time.\n- \"Uppväckning\" with one-leg hop and sprint (3 min).\n- \"Uppväckning\" with slide (2 min).\n\nSay: \"Knä över fot! Landa mjukt på två fötter! Byt hand varje gång!\""
        },
        {
          id: "s2", title: "Drill 1 — Passa–Spring–HIT (Give-and-Go)", duration: 12,
          body: "Focus: give-and-go (pass, cut to the basket, call \"HIT!\", receive, finish) plus bounce-pass technique.\nSetup: one basket per group of 5–6, one ball per group. Passer line at the wing, cutter line at the top, one defender at the elbow.\n\nRotation (works solo): cutter finishes, rebounds her own ball and joins the passer line. The passer becomes the defender. The defender goes to the cutter line.\n\nTeaching sequence: say it (30 sec) —\n\nSay: \"Du passar och springer förbi — mot korgen. Sen får du bollen tillbaka.\"\n\nShow it: two stronger players demo at full speed once, then slowly. Walk it: half speed, no defender, 2 reps each. Talk it — pairs say the 3 steps out loud: pass, cut, call \"HIT!\".\n\nSay: \"Säg till din kompis vad ni ska göra.\"\n\nPlay it: progress as below. 40-second rule after the 3rd rep.\n\nSay: \"Nu stänger vi ögonen i 40 sekunder och tänker på vad vi just gjorde.\"\n\nProgression:\n\n- Reps 1–4: cone defender (passive).\n- Reps 5+: live defender, who must not steal for the first 2 reps, then plays for real.\n- Return pass is a bounce pass, then layup. Keep it quick. Don't stop a rep for a loose pass, just one short cue between rounds.\n- Cutter holds up a target hand and calls \"HIT!\" before receiving.\n\nSay: \"Passa och spring förbi!\"\n\nSay: \"Skär mot korgen — ropa HIT!\"\n\nSay: \"Stega in, två händer, följ med!\"\n\nSay: \"Passar du? Då springer du. Alltid.\"\n\nEasier: cone defender the whole time, chest-pass return, walk the cut. Harder: live defender from rep 1, weak-hand layup, or the cutter has to fake away first.\n\nPairing: stronger passer with weaker cutter and vice versa. Put the weaker subgroup in the first reps, not the last."
        },
        {
          id: "s3", title: "Drill 2 — Stäng Ut! (Boxing Out)", duration: 12,
          body: "Focus: boxing out, rebounding with two hands, outlet pass.\nSetup: pairs, half court, one ball per pair for Phase B. Coach or assistant shoots.\n\nPhase A — body position, no ball (4 min): pairs, one \"shooter\" at the free-throw line, one defender in front of her. On \"SKOTT!\" the defender finds her player, turns, and holds her space.\n\n- Hitta (find) your player — hand or forearm on her, don't push.\n- Rumpan mot henne — low, wide, arms up.\n- Hold 3 seconds, then swap roles.\n\nPhase B — live rebound (8 min): groups of 3 (one shooter, one offensive rebounder, one defender), the rest in waiting lines. Defender boxes out, gets the rebound with two hands, ball under the chin, outlet pass to the coach. Defensive rebound + outlet = 1 point. Offensive rebound and putback = 1 point. Rotate every 3 shots.\n\nTeaching: say it, show it with a stronger pair, walk it in Phase A, then talk it, then play Phase B. No pushing. Contact is body position only.\n\nSay: \"Säg till din kompis: vad gör du när skottet går?\"\n\nSay: \"Hitta din spelare!\"\n\nSay: \"Rumpan mot henne, armarna upp!\"\n\nSay: \"Mellan henne och korgen!\"\n\nSay: \"Hoppa och ta bollen med två händer — bollen under hakan!\"\n\nEasier: Phase A only plus a slow rebound, no offensive rebounder. Harder: the offensive rebounder tries to get around the box-out.\n\nPairing: match by size where you can, not strong against weak, so nobody gets bullied."
        },
        {
          id: "s4", title: "Drill 3 — Styrkecirkel (Strength Circuit)", duration: 8,
          body: "Focus: conditioning and strength, mixing exercises from Kerri Kuzbyt's SBBF clinic (Basketball Scotland / Transforming Basketball) with two SBBF fysträning moves. Bodyweight only, one set per station.\nSetup: 5 stations around the court, pairs at each (5 pairs = one each, 6 pairs = two pairs at the Partner Mirror station). 1 min work, 30 sec change. Explain each station in one sentence before the circuit starts.\n\nStations:\n\n- Station 1 — Partner Mirror: one leads, the other copies (squats, side lunges, small/medium/high jumps). Swap leader every 20–30 sec.\n- Station 2 — One-Leg Ball Battle: both hold one ball, feet stay planted, one partner on one foot. 3 rounds of 10–15 sec, switch who is on one foot each round.\n- Station 3 — Planka med high fives.\n- Station 4 — Clap-Start Chase on the three-point line: the leader starts 1m ahead and claps when ready. The chaser tries to catch her over a short stretch of the arc. 3 short bursts, swap roles each time.\n- Station 5 — Gående utfall.\n\nSay: \"Knä över tå! Gör något din kompis kan kopiera.\"\n\nSay: \"Kontroll, inte kraft!\"\n\nSay: \"Tappa inte magen!\"\n\nSay: \"Ledaren klappar — då springer ni!\"\n\nSay: \"Överkroppen upprätt, knä över tå!\"\n\nSafety: tell the leaders upfront to pick something their partner can actually copy (no cartwheels), and land softly on high jumps. Keep Ball Battle rounds short and stay close to that station — if it turns into shoving, stop the round. Keep the Chase to a short stretch of the arc only, with enough space between pairs. Nobody trains through pain.\n\nSwaps for variety later: Fast-Walk 3-Point Line Race (walking only, no running) instead of the Chase, or Rock-Paper-Scissors Dodgeball Tag (aim at back or legs only, softer ball) as a game finish."
        },
        {
          id: "s5", title: "Closer — 3v2 Give-and-Go + Rebound", duration: 12,
          body: "Focus: apply give-and-go and boxing out together in a numbers-up shell (not an open scrimmage).\nSetup: two baskets, 3 attackers and 2 defenders at each — 10 players exactly for a 10-player roster. With 11 or 12 players, the extra 1–2 wait at the side.\n\nRules: offense of 3 plays against 2 defenders. 2-second pass clock (the standing \"Klump\" constraint). A basket from a give-and-go (a pass followed by the passer cutting and receiving) counts 2. Any other basket counts 1. On a miss, live rebound: the defense must box out. A defensive rebound ends the possession.\n\nRotation — possession-based, not a clock: after every possession (a basket, a defensive rebound, or a miss the defense grabs), the 2 defenders become attackers, one attacker stays on (pick the rule beforehand, e.g. \"the one who last touched the ball stays\"), and the other 2 attackers go defend. So the new attack is the 2 old defenders plus the 1 who stays, and the new defense is the 2 old attackers — everyone alternates between attack and defense without a list. With 11 or 12 players, the waiting players come in as the new defenders, and the 2 attackers who would have gone to defense go to the sideline instead, coming back in at the next possession, so nobody waits more than a couple of possessions.\n\nKeeping it fast: say \"Nästa!\" right after the possession so the new teams are on court within a few seconds. Waiting players do 30 sec of back-to-back squats at the sideline. The first possession starts when the coach passes the ball, so there's no waiting for everyone to be ready.\n\nSolo coach: stand between the two baskets. If two baskets is too much to watch, run one basket only, with the others in the waiting line doing partner squats — that works too, with less playing time per girl.\n\nSay: \"Sara, du sprang direkt efter passet — precis!\"\n\nCoach: stay quiet in live play. Praise by name and by behaviour, and praise a good box-out, not just baskets."
        },
        {
          id: "s6", title: "Cool-Down / Talk", duration: 6,
          body: "Gather the group. One takeaway.\n\nSay: \"Passar du? Då springer du.\"\n\nThen ask:\n\nSay: \"Vem såg någon stänga ut bra idag?\"\n\n(names, behaviours)\n\nSay: \"Superbra träning idag! Vi ses imorgon!\"\n\nWater and transitions take the rest of this block."
        }
      ],
      tip: "The only thing to watch tonight is whether the weaker subgroup still stops after passing — quietly note which girls, since it feeds Thursday's checklist. The strength circuit mixes exercises from Kerri Kuzbyt's SBBF clinic (Basketball Scotland / Transforming Basketball) with two SBBF fysträning moves; the Kuzbyt exercises are from memory of that clinic, not an official document, and the SBBF recommendation is 1–3 strength sessions of 20 min per week, so this circuit is a small slice of that."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 8 · THU 18–19",
      title: "Play & Apply — Match Preview",
      focus: "Apply give-and-go and rebounding at game tempo, then rehearse squad rotation for Saturday. Game 3 (free 3v3) stays the only clean read for the ladder; Game 4's full-court 4v4 is framed as a preview, never a test.",
      sections: [
        {
          id: "t1", title: "Warm-Up — SBBF Sprint Programme", duration: 10,
          body: "Focus: SBBF sprint training, trimmed for match week — keep it playful, nobody should be tired before the first game.\nSetup: 15m lengths, side line to side line.\n\nHow:\n\n- Walk 3 times with instructions (toes, heels, backwards, airplane arms).\n- Easy jog 3 times with instructions (high knees, heels to seat, sidestep), 4–5 sec rest.\n- 3–4 short accelerations, walk back.\n- Only 3 competition sprints (not 5), with 10–20 sec rest and fun starting positions (sitting, on the tummy, backwards)."
        },
        {
          id: "t2", title: "Game 1 — Rebound-Kriget", duration: 8,
          body: "Focus: rebounding and boxing out under game pressure.\nSetup: half court, 3v3.\n\nRules: same points as Wednesday — defensive rebound + outlet pass = 1, offensive rebound putback = 1, regular basket = 1. The offense can't shoot until it has made 2 passes.\n\nSay: \"Stäng ut henne — mellan henne och korgen!\"\n\nCoach: minimal talk. A quick \"bra box-out!\" is fine."
        },
        {
          id: "t3", title: "Game 2 — Klump with Give-and-Go Bonus", duration: 9,
          body: "Focus: combine the standing Klump spacing constraint with the give-and-go bonus from Wednesday.\nSetup: half court, 3v3.\n\nRules: Klump spacing rules plus the 2-second pass clock. A give-and-go basket counts 2.\n\nCoach: quiet in live play. Use the water break to ask before any instruction, and let them answer first.\n\nSay: \"Vad hände där ute?\""
        },
        {
          id: "t4", title: "Game 3 — Free 3v3, No Constraints", duration: 11,
          body: "Focus: no clock, no bonus, no coaching. This is the only clean read for the ladder.\nSetup: half court, 3v3.\n\nObservation checklist (tick roughly, don't score):\n\n- After a pass, who moves to a new spot, and who stops?\n- Who holds the spacing, and who bunches up?\n- Who stays between her player and the basket, and who watches the ball?\n- Who boxes out after a shot?\n- Does this hold at tempo, not just in a slow game?\n\nHow to read it: Oct 1 and Oct 8 both read as encouraging, so a third similar read here is enough to call rung 2 passed. Judge movement and spacing, not pass quality — loose passes at tempo don't count against it. If it holds when focused, at tempo: rung 2 is confirmed, rung 3 (stay attached, goal-side) opens in Week 9, and the box-out work has already started it. If it's shaky: treat that as information, possibly about the weaker subgroup or about focus, and repeat rung 2 once more. Either way, rung status comes from this game and nothing else, not from the match."
        },
        {
          id: "t5", title: "Game 4 — Full-Court 4v4 with Squads", duration: 16,
          body: "Focus: match preview and rotation rehearsal — not a test. This is the place to coach live: call out good spacing, good box-outs and good passes.\nSetup: full court, 4v4 (8 on court, 2–4 resting). A whistle every 2 minutes; the players who have been on court longest come off and the resting players come in, so everybody gets equal time.\n\n- 12 players: three squads of 4. One squad rests each round, and the squad that has been on longest comes off.\n- 11 players: three rest. Swap 3 each whistle, so everyone sits out about equally.\n- 10 players: two rest. Swap 2 each whistle.\n\nWrite the order on a card beforehand so you don't have to think during play. Count each girl's minutes quietly and fix any imbalance in the last round.\n\nSay: \"Byt! Ny trupp in!\"\n\nSay: \"Bra bytt — ni såg varandra!\"\n\nMatch talk (2 min, in the water break before Game 4) — keep it to three things, and ask them to repeat the three to a partner:\n\n- \"Passar du? Då springer du.\"\n- \"Stäng ut när skottet går.\"\n- \"Alla får spela lika mycket — det är viktigt för laget.\""
        },
        {
          id: "t6", title: "Cool-Down / Talk", duration: 6,
          body: "Gather. Say one thing you saw that you want to see on Saturday, then ask the girls to say one thing they are proud of. Keep it positive.\n\nSay: \"Ni är grymma! Vi ses på lördag!\""
        }
      ],
      tip: "The last thing the girls hear before a match should be calm and confident — don't introduce a new idea, and don't correct mistakes in Game 4 beyond a quick cue. Log Game 3 observations (even rough names) so Week 9's plan can be built on them, and once the club confirms the match format, adjust the whistle timing so rotations match the real periods."
    }
    },
    sv: {
    wed: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 8 · ONS 17–18",
      title: "Give-and-Go & Studs — Volym Inför Match",
      focus: "Inga nya koncept — give-and-go (steg 2) och att stänga ut (boxa ut) är redan kända; den här veckan handlar om volym och självförtroende inför lördagens match, inte ny undervisning. Att stänga ut är också ett steg-3-frö: \"stå mellan henne och korgen\" är samma idé som goal-side-marking, och det adresserar övergångsförsvarssvagheten efter anfallsreturer. Fart före perfekta passningar — snabbt spel med lite slarviga passningar är bättre än långsamt, försiktigt spel; ingen stoppar en repetition för passningskvalitet, och teknikledord hålls till en kort fras.",
      sections: [
        {
          id: "s1", title: "Uppvärmning — BasketSmart 1", duration: 10,
          body: "Fokus: det officiella BasketSmart-uppvärmningsprogrammet, förkortat, boll i handen hela tiden.\nUppställning: hela gruppen, en boll var, längs baslinjen.\n\nSå här:\n\n- Temperaturstegring (5 min): 4 dribblingar framåt, 2 bakåt; axel-mot-axel-löpning; dribbling + hopp mot varandra; glid med dribbling. Byt hand varje gång.\n- \"Uppväckning\" med enbenshopp och sprint (3 min).\n- \"Uppväckning\" med glid (2 min).\n\nSäg: \"Knä över fot! Landa mjukt på två fötter! Byt hand varje gång!\""
        },
        {
          id: "s2", title: "Övning 1 — Passa–Spring–HIT (Give-and-Go)", duration: 12,
          body: "Fokus: give-and-go (passa, skär mot korgen, ropa \"HIT!\", ta emot, avsluta) plus studspass-teknik.\nUppställning: en korg per grupp om 5–6, en boll per grupp. Passarkö vid kanten, skärarkö vid toppen, en försvarare vid armbågen.\n\nRotation (fungerar solo): skäraren avslutar, returnerar sin egen boll och går med i passarkön. Passaren blir försvarare. Försvararen går till skärarkön.\n\nUndervisningssekvens: säg det (30 sek) —\n\nSäg: \"Du passar och springer förbi — mot korgen. Sen får du bollen tillbaka.\"\n\nVisa det: två starkare spelare demonstrerar i full fart en gång, sedan långsamt. Gå igenom det: halvfart, ingen försvarare, 2 repetitioner var. Prata om det — par säger de 3 stegen högt: passa, skär, ropa \"HIT!\".\n\nSäg: \"Säg till din kompis vad ni ska göra.\"\n\nSpela det: progression enligt nedan. 40-sekundersregeln efter 3:e repetitionen.\n\nSäg: \"Nu stänger vi ögonen i 40 sekunder och tänker på vad vi just gjorde.\"\n\nProgression:\n\n- Rep 1–4: kon-försvarare (passiv).\n- Rep 5+: levande försvarare, som inte får sno bollen de första 2 repen, sedan spelar på riktigt.\n- Returpassningen är en studspassning, sedan layup. Håll det snabbt. Stoppa inte en rep för en slarvig passning, bara ett kort ledord mellan omgångarna.\n- Skäraren håller upp en målhand och ropar \"HIT!\" innan hon tar emot.\n\nSäg: \"Passa och spring förbi!\"\n\nSäg: \"Skär mot korgen — ropa HIT!\"\n\nSäg: \"Stega in, två händer, följ med!\"\n\nSäg: \"Passar du? Då springer du. Alltid.\"\n\nLättare: kon-försvarare hela tiden, bröstpass-retur, gå igenom skärningen. Svårare: levande försvarare från rep 1, layup med svag hand, eller att skäraren måste fejka bort först.\n\nParning: starkare passare med svagare skärare och vice versa. Sätt den svagare undergruppen i de första repen, inte de sista."
        },
        {
          id: "s3", title: "Övning 2 — Stäng Ut! (Boxa Ut)", duration: 12,
          body: "Fokus: boxa ut, returtagning med två händer, utpassning.\nUppställning: par, halvplan, en boll per par för fas B. Tränare eller assistent skjuter.\n\nFas A — kroppsposition, ingen boll (4 min): par, en \"skytt\" vid frikastlinjen, en försvarare framför henne. Vid \"SKOTT!\" hittar försvararen sin spelare, vänder sig och håller sin plats.\n\n- Hitta din spelare — hand eller underarm på henne, knuffa inte.\n- Rumpan mot henne — lågt, brett, armarna upp.\n- Håll i 3 sekunder, byt sedan roller.\n\nFas B — levande retur (8 min): grupper om 3 (en skytt, en anfallsreturtagare, en försvarare), resten i väntekö. Försvararen boxar ut, tar returen med två händer, bollen under hakan, utpassning till tränaren. Defensiv retur + utpassning = 1 poäng. Anfallsretur och putback = 1 poäng. Rotera var 3:e skott.\n\nUndervisning: säg det, visa det med ett starkare par, gå igenom det i fas A, prata sedan om det, spela sedan fas B. Ingen knuffning. Kontakt är bara kroppsposition.\n\nSäg: \"Säg till din kompis: vad gör du när skottet går?\"\n\nSäg: \"Hitta din spelare!\"\n\nSäg: \"Rumpan mot henne, armarna upp!\"\n\nSäg: \"Mellan henne och korgen!\"\n\nSäg: \"Hoppa och ta bollen med två händer — bollen under hakan!\"\n\nLättare: bara fas A plus en långsam retur, ingen anfallsreturtagare. Svårare: anfallsreturtagaren försöker ta sig runt boxningen.\n\nParning: matcha efter storlek där du kan, inte stark mot svag, så ingen blir överkörd."
        },
        {
          id: "s4", title: "Övning 3 — Styrkecirkel", duration: 8,
          body: "Fokus: kondition och styrka, blandar övningar från Kerri Kuzbyts SBBF-klinik (Basketball Scotland / Transforming Basketball) med två SBBF-fysträningsmoment. Bara kroppsvikt, ett set per station.\nUppställning: 5 stationer runt planen, par vid varje (5 par = en var, 6 par = två par vid Partner-spegel-stationen). 1 min arbete, 30 sek byte. Förklara varje station i en mening innan cirkeln startar.\n\nStationer:\n\n- Station 1 — Partner-spegel: en leder, den andra kopierar (knäböj, sidohopp, små/medium/höga hopp). Byt ledare var 20–30:e sekund.\n- Station 2 — Enbens-bollduell: båda håller i en boll, fötterna stannar på marken, en partner på ett ben. 3 omgångar à 10–15 sek, byt vem som står på ett ben varje omgång.\n- Station 3 — Plankan med high fives.\n- Station 4 — Klapp-start-jakt på trepoängslinjen: ledaren startar 1 m före och klappar när hon är redo. Jagaren försöker ta henne över en kort sträcka av bågen. 3 korta ryck, byt roller varje gång.\n- Station 5 — Gående utfall.\n\nSäg: \"Knä över tå! Gör något din kompis kan kopiera.\"\n\nSäg: \"Kontroll, inte kraft!\"\n\nSäg: \"Tappa inte magen!\"\n\nSäg: \"Ledaren klappar — då springer ni!\"\n\nSäg: \"Överkroppen upprätt, knä över tå!\"\n\nSäkerhet: säg till ledarna i förväg att välja något deras partner faktiskt kan kopiera (inga volter), och landa mjukt på höga hopp. Håll Bollduellen kort och stanna nära den stationen — om det blir knuffande, stoppa omgången. Håll Jakten till en kort sträcka av bågen, med tillräckligt med utrymme mellan paren. Ingen tränar genom smärta.\n\nByten för variation senare: Gångtävling på trepoängslinjen (bara gång, inget springande) istället för Jakten, eller Sten-sax-påse-dodgeball-tag (sikta bara mot rygg eller ben, mjukare boll) som en avslutande lek."
        },
        {
          id: "s5", title: "Avslutning — 3mot2 Give-and-Go + Retur", duration: 12,
          body: "Fokus: tillämpa give-and-go och att boxa ut tillsammans i ett numerärt övertags-skal (inte en öppen match).\nUppställning: två korgar, 3 anfallare och 2 försvarare vid varje — exakt 10 spelare för en trupp på 10. Med 11 eller 12 spelare väntar de extra 1–2 vid sidan.\n\nRegler: anfall med 3 spelar mot 2 försvarare. 2-sekunders passklocka (den stående \"Klump\"-begränsningen). En korg från ett give-and-go (en passning följd av att passaren skär och tar emot) räknas 2. Alla andra korgar räknas 1. Vid miss, levande retur: försvaret måste boxa ut. En defensiv retur avslutar boll-innehavet.\n\nRotation — baserad på boll-innehav, inte en klocka: efter varje boll-innehav (en korg, en defensiv retur, eller en miss försvaret tar) blir de 2 försvararna anfallare, en anfallare stannar kvar (bestäm regeln i förväg, t.ex. \"den som rörde bollen sist stannar\"), och de andra 2 anfallarna går och försvarar. Så det nya anfallet är de 2 gamla försvararna plus den 1 som stannar, och det nya försvaret är de 2 gamla anfallarna — alla växlar mellan anfall och försvar utan någon lista. Med 11 eller 12 spelare kommer de väntande spelarna in som de nya försvararna, och de 2 anfallarna som annars skulle gått till försvar går till sidlinjen istället och kommer tillbaka in vid nästa boll-innehav, så ingen väntar mer än ett par boll-innehav.\n\nHålla det snabbt: säg \"Nästa!\" direkt efter boll-innehavet så de nya lagen är på plan inom några sekunder. Väntande spelare gör 30 sek rygg-mot-rygg-knäböj vid sidlinjen. Första boll-innehavet startar när tränaren passar bollen, så ingen väntar på att alla ska vara redo.\n\nSolo-tränare: stå mellan de två korgarna. Om två korgar är för mycket att hålla koll på, kör bara en korg, med de andra i väntekön som gör partnerknäböj — det fungerar också, med mindre speltid per tjej.\n\nSäg: \"Sara, du sprang direkt efter passet — precis!\"\n\nTränare: var tyst under levande spel. Berömma vid namn och beteende, och berömma en bra boxning, inte bara korgar."

      tip: "Det enda att hålla koll på ikväll är om den svagare undergruppen fortfarande stannar upp efter passningen — notera tyst vilka tjejer, eftersom det förser torsdagens checklista. Styrkecirkeln blandar övningar från Kerri Kuzbyts SBBF-klinik (Basketball Scotland / Transforming Basketball) med två SBBF-fysträningsmoment; Kuzbyt-övningarna är från minnet av den klinikan, inte ett officiellt dokument, och SBBF:s rekommendation är 1–3 styrkepass på 20 min per vecka, så den här cirkeln är bara en liten del av det."
    },
    thu: {
      tipLabel: "Tränartips",

      focus: "Tillämpa give-and-go och returtagning i matchtempo, repetera sedan truppbyten inför lördagen. Lek 3 (fri 3mot3) förblir det enda rena testet för stegen; Lek 4:s helplans-4mot4 är inramat som en förhandsvisning, aldrig ett test.",
      sections: [
        {
          id: "t1", title: "Uppvärmning — SBBF Sprintprogram", duration: 10,
          body: "Fokus: SBBF:s sprintträning, trimmad för matchvecka — håll det lekfullt, ingen ska vara trött innan första leken.\nUppställning: 15 m längder, sidlinje till sidlinje.\n\nSå här:\n\n- Gå 3 gånger med instruktioner (tår, hälar, baklänges, flygplansarmar).\n- Lätt jogg 3 gånger med instruktioner (höga knän, hälar mot säte, sidsteg), 4–5 sek vila.\n- 3–4 korta accelerationer, gå tillbaka.\n- Bara 3 tävlingssprintar (inte 5), med 10–20 sek vila och roliga startpositioner (sittande, på mage, baklänges)."

        {

        {
          id: "t5", title: "Lek 4 — Helplan 4mot4 med Trupper", duration: 16,
          body: "Fokus: matchförhandsvisning och bytesrepetition — inte ett test. Det här är platsen att coacha levande: peka ut bra spacing, bra boxningar och bra passningar.\nUppställning: helplan, 4mot4 (8 på plan, 2–4 vilar). En vissling var 2:a minut; spelarna som varit på plan längst går av och de vilande spelarna kommer in, så alla får lika mycket tid.\n\n- 12 spelare: tre trupper om 4. En trupp vilar varje omgång, och truppen som varit inne längst går av.\n- 11 spelare: tre vilar. Byt 3 varje vissling, så alla sitter av ungefär lika mycket.\n- 10 spelare: två vilar. Byt 2 varje vissling.\n\nSkriv ordningen på ett kort i förväg så du inte behöver tänka under spelet. Räkna varje tjejs minuter tyst och fixa eventuell obalans i sista omgången.\n\nSäg: \"Byt! Ny trupp in!\"\n\nSäg: \"Bra bytt — ni såg varandra!\"\n\nMatchprat (2 min, i vattenpausen innan Lek 4) — håll det till tre saker, och be dem upprepa de tre för en partner:\n\n- \"Passar du? Då springer du.\"\n- \"Stäng ut när skottet går.\"\n- \"Alla får spela lika mycket — det är viktigt för laget.\""
        },
        {
          id: "t6", title: "Nedvarvning / Prat", duration: 6,
          body: "Samla. Säg en sak du såg som du vill se på lördag, be sedan tjejerna säga en sak de är stolta över. Håll det positivt.\n\nSäg: \"Ni är grymma! Vi ses på lördag!\""

      ],
      tip: "Det sista tjejerna hör innan en match ska vara lugnt och tryggt — introducera inget nytt, och rätta inte misstag i Lek 4 utöver ett snabbt ledord. Logga Lek 3-observationerna (även grova namn) så vecka 9:s plan kan byggas på dem, och när klubben bekräftar matchformatet, justera visseltiderna så bytena matchar de riktiga perioderna."

  };

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
