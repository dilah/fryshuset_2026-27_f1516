<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {
    en: {
    wed: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 10 · WED 17–18",
      title: "Muren + Passa först",
      focus: "Rung 3, re-activated after höstlov: personal defence (\"the wall\": low, wide, goal-side, feet not arms) now holding up when the ball moves, plus passing over dribbling and quick decisions. New today: when the ball is passed, the defender stays between her player and the basket instead of turning to chase the ball. Standing constraints: max 2 dribbles, then pass, and the 2-second pass clock. First week back — keep the first 10 minutes at moderate intensity and build up.",
      sections: [
        {
          id: "s1", title: "Incheckning — What Do We Remember?", duration: 3,
          body: "Retrieval after the break, no re-teaching yet. Pair talk, then take 2–3 answers.\n\nSay: \"Säg till din kompis: vad betyder muren?\"\n\nYou want to hear \"between her and the basket\" and \"feet, not arms\". If nobody says it, don't fill the gap — Muren 1v1 will bring it back."
        },
        {
          id: "s2", title: "Warm-Up — Het potatis-kull + Hav-skepp-land", duration: 10,
          body: "Moderate intensity to start — first session after the break.\n\nHet potatis-kull (6 min) — passing under pressure, quick decisions.\nSetup: half court. 2–3 taggers in bibs, no ball. The rest are runners with 3–4 balls among them (roughly one ball per 2–3 runners).\nHow: taggers can only tag a runner holding a ball. A runner without a ball is safe — so the ball is the hot potato: get rid of it fast with a pass. No dribbling. A tagged runner swaps bibs with the tagger. New taggers every ~90 s if nobody gets caught.\n\n- No passing straight back to the girl who just passed to you.\n- You can't refuse a pass: if it's thrown to you, catch it. A dropped ball belongs to the girl it was thrown to.\n- Chest or bounce pass only — no throws at the head.\n\nSay: \"Bollen är het! Har du bollen kan du bli tagen. Titta upp och passa snabbt!\"\n\nEasier: fewer balls (2–3) or fewer taggers. Harder: more balls, or bounce passes only.\n\nHav-skepp-land: Mur-versionen (4 min) — sprint, stop, knee control, wall stance. No balls.\nSetup: everyone on one baseline. Baseline = \"Hav\", midline = \"Skepp\", other baseline = \"Land\". Place calls = sprint to that line.\n\n- \"Mur!\" — stop instantly into the wall: low, feet wide, hands up. Freeze. Anyone who wobbles or steps does a quick redo.\n- \"Krabban!\" — slide sideways in stance, no crossing feet, until the next call.\n- \"Hajen kommer!\" — two squat jumps with soft landings, knees over toes, then freeze in the wall.\n\nMix fast: call an action mid-sprint (\"Land! … Mur!\") so they stop from full speed — that's the moment that trains the defensive stop. Last minute: last one to the line on a place call gets a fun job, e.g. she calls the next command.\n\nSay: \"Hav! … Skepp! … MUR! Stå still som en vägg!\"\n\nSay: \"Krabban – inga korsade fötter!\"\n\nSay: \"Hajen kommer – mjuk landning!\""
        },
        {
          id: "s3", title: "Muren 1v1 Lanes — Re-activation", duration: 10,
          body: "The Week 9 game as they know it: lanes ~4 m wide × 10 m, attacker dribbles to cross the goal line, defender stops her. Hug or grab = attacker scores. 20–30 s rounds, swap roles.\n\n- Quick re-demo of the rules only (30 s), no new teaching.\n- Hands-behind-back for any defender who keeps reaching.\n- Pairing: stronger vs. stronger first round, then stronger with weaker.\n\n40-second rule after round 3:\nSay: \"Nu stänger vi ögonen i 40 sekunder och tänker på muren — var stod du?\""
        },
        {
          id: "s4", title: "Muren 2v2 + Frys-kollen (New)", duration: 18,
          body: "Own design, building on Muren and 1v1 Shell Defense. The problem it targets: when the ball is passed, defenders turn to chase it and leave their own player open.\nSetup: two half courts (or two baskets on one side), 2v2 at each. Each defender has her attacker. Up to 4 groups of four; rotate teams on/off every 2 min if more players.\n\nRules:\n\n- Offence: max 2 dribbles, then pass or shoot. 2-second pass clock. 2 points per basket.\n- Defence: stay with your player. Hug or grab = basket to offence.\n- Frys-kollen: every 30–45 s the coach shouts \"FRYS!\" Everyone freezes. Each defender checks herself — between her player and the basket = 1 point for the defence. Then play on from where they are.\n- Swap offence/defence every 2 min.\n\nSay it (30 s):\nSay: \"Ni är två mot två. Försvararen har en egen spelare. När bollen passas – stanna hos din spelare, inte bollen.\"\n\nShow it (30 s): freeze two players yourself — one defender \"between\", one \"beside/chasing\".\nSay: \"Vem är muren?\"\n\nWalk it (1 min): one group at walking pace — pass → defenders adjust → FRYS.\n\nTalk it (30 s):\nSay: \"Säg till din kompis: vart går du när bollen passas?\"\n\nPlay it: full speed with Frys-kollen. At FRYS the self-check question is:\nSay: \"Står jag mellan min spelare och korgen?\"\n\nTeach it (if time): a player who gets it shows a partner at FRYS.\nSay: \"Kan du visa var hon borde stå?\"\n\nPause every 3–4 min and ask one question, then let them answer:\nSay: \"Vad hände när bollen flyttades?\"\n\nSay: \"Stå mellan, inte bredvid!\"\n\nSay: \"Din spelare, inte bollen!\"\n\nEasier: offence must pass at least once before shooting (gives defenders an easy \"ball moved\" moment). Harder: defenders get 1 bonus point for a steal without leaving goal-side.\n\nPairing: each pair = one stronger + one weaker, so the stronger defender models the position at every FRYS."
        },
        {
          id: "s5", title: "Klump 3v3, Max 2 Dribbles", duration: 15,
          body: "Klump with its 2-second pass clock, plus the dribble limit for the whole game. Keep Frys-kollen in, but less often (every ~90 s), so it becomes a habit check, not a stop-start game.\n\nDon't stop reps for loose passes — tempo first.\n\nSay: \"Passa först! Två studs, sen måste bollen gå.\""
        },
        {
          id: "s6", title: "Samling", duration: 4,
          body: "One takeaway, from them:\nSay: \"Vad gör muren när bollen passas?\"\n\nName 2–3 players for specific things: one defence, one pass, one hustle.\n\nClose with hands in the middle: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "At FRYS, the instinct will be to fix every player's position yourself. Don't — ask \"Är du mellan?\" and let them move themselves. The self-check is the learning; your correction isn't."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 10 · THU 18–19",
      title: "Muren + Passa först — The Test",
      focus: "Play/Apply for Wednesday's wall-on-the-pass. Game 1 (3v3v3 shuttle) puts it into transition, Game 2 (Match med joker) is where you coach live, and Game 3 — free 3v3, no constraints, no FRYS — is the rung-3 test. Stay quiet in Game 3.",
      sections: [
        {
          id: "t1", title: "Warm-Up — Sten-sax-påse-kull + Het potatis-kull", duration: 10,
          body: "- Sten-sax-påse-kull (5 min): as in Week 9 — loser sprints to the baseline, winner chases. Change start position every minute.\n- Het potatis-kull (5 min): repeat from Wednesday, adding one more ball for the last 2 minutes.\n\nSay: \"Bollen är het! Har du bollen kan du bli tagen. Titta upp och passa snabbt!\""
        },
        {
          id: "t2", title: "Game 1 — 3v3v3 Continuous Shuttle", duration: 12,
          body: "The established format: one triplet at midline, two at the baselines, continuous up and down. Klump rules (2 s clock) + max 2 dribbles.\n\nThis is where transition defence happens: after a turnover, the first job is to get back between her player and the basket.\n\nSay: \"Hitta din spelare!\""
        },
        {
          id: "t3", title: "Game 2 — Match med joker 4v4", duration: 15,
          body: "SBBF format: 4v4 full court, coach plays as joker — passing option for whichever team has the ball, can't score. Max 2 dribbles.\n\nThe joker makes passing easy and lets you reward good choices live: pass back to the girl who just moved into space.\n\nThis is the place to coach live (Game 2 isn't the test): call out good walls and good passes.\n\nSay: \"Jokern är alltid öppen — men kolla först om en kompis är friare!\""
        },
        {
          id: "t4", title: "Game 3 — Free 3v3, Rung-3 Test", duration: 18,
          body: "Half court. No constraints, no dribble limit, no FRYS. Stay quiet — encourage, don't direct. Rotate teams every 3 min.\n\nWatch for:\n\n- Feet or arms? Do defenders slide and stay in front, or hug/grab?\n- Ball moves — where does the defender go? Stays goal-side of her player, or turns and chases the ball?\n- Passing first, unprompted? With the dribble limit gone, do they still look for the pass, or fall back to dribbling?\n- Tempo: do they still play fast and decide quickly?\n\nRead it broadly, not per player. If most defenders hold the wall on passes, rung 3 is close to confirmed (one more Thursday before calling it). If they still chase the ball, repeat Muren 2v2 next Wednesday before moving on."
        },
        {
          id: "t5", title: "Samling", duration: 5,
          body: "Let the players name each other. Positive send-off.\n\nSay: \"Vem såg någon bygga en bra mur idag?\"\n\nClose with hands in the middle: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "Game 3 is the only clean read — read it broadly, not per player. Most defenders holding the wall on passes = rung 3 close to confirmed, one more Thursday to be sure. Still chasing the ball = repeat Muren 2v2 next Wednesday before moving on."
    }
    },
    sv: {
    wed: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 10 · ONS 17–18",
      title: "Muren + Passa först",
      focus: "Steg 3, återaktiverat efter höstlovet: personligt försvar (\"muren\": låg, bred, på målsidan, fötterna inte armarna) som nu ska hålla även när bollen rör sig, plus passning före dribbling och snabba beslut. Nytt idag: när bollen passas stannar försvararen mellan sin spelare och korgen istället för att vända sig och jaga bollen. Stående begränsningar: max 2 studs, sedan passning, och 2-sekunders passklocka. Första veckan tillbaka — håll de första 10 minuterna på måttlig intensitet och bygg upp.",
      sections: [
        {
          id: "s1", title: "Incheckning — vad minns vi?", duration: 3,
          body: "Återkallning efter lovet, ingen ny genomgång än. Parprat, ta sedan 2–3 svar.\n\nSäg: \"Säg till din kompis: vad betyder muren?\"\n\nDu vill höra \"mellan henne och korgen\" och \"fötterna, inte armarna\". Om ingen säger det, fyll inte i luckan — Muren 1mot1 tar tillbaka det."
        },
        {
          id: "s2", title: "Uppvärmning — Het potatis-kull + Hav-skepp-land", duration: 10,
          body: "Måttlig intensitet i början — första passet efter lovet.\n\nHet potatis-kull (6 min) — passning under press, snabba beslut.\nUppställning: halvplan. 2–3 kullare i västar, ingen boll. Resten är löpare med 3–4 bollar mellan sig (ungefär en boll per 2–3 löpare).\nSå här: kullarna får bara kulla en löpare som håller i en boll. En löpare utan boll är säker — så bollen är den heta potatisen: bli av med den snabbt med en passning. Ingen dribbling. En kullad löpare byter väst med kullaren. Nya kullare var ~90:e sekund om ingen blir tagen.\n\n- Ingen passning direkt tillbaka till den som just passade dig.\n- Du får inte vägra en passning: kastas den till dig, ta emot den. En tappad boll tillhör den den kastades till.\n- Bara bröst- eller studspassning — inga kast mot huvudet.\n\nSäg: \"Bollen är het! Har du bollen kan du bli tagen. Titta upp och passa snabbt!\"\n\nLättare: färre bollar (2–3) eller färre kullare. Svårare: fler bollar, eller bara studspassningar.\n\nHav-skepp-land: Mur-versionen (4 min) — sprint, stopp, knäkontroll, murstance. Inga bollar.\nUppställning: alla på en baslinje. Baslinjen = \"Hav\", mittlinjen = \"Skepp\", andra baslinjen = \"Land\". Platsrop = sprinta till den linjen.\n\n- \"Mur!\" — stanna direkt i muren: låg, fötterna brett, händerna upp. Frys. Den som vinglar eller tar ett steg gör om snabbt.\n- \"Krabban!\" — glid i sidled i stance, inga korsade fötter, tills nästa rop.\n- \"Hajen kommer!\" — två knäböjshopp med mjuka landningar, knä över tå, frys sedan i muren.\n\nBlanda snabbt: ropa en aktion mitt i en sprint (\"Land! … Mur!\") så de måste stanna från full fart — det är det ögonblicket som tränar det defensiva stoppet. Sista minuten: den sista till linjen på ett platsrop får ett roligt uppdrag, t.ex. ropa nästa kommando.\n\nSäg: \"Hav! … Skepp! … MUR! Stå still som en vägg!\"\n\nSäg: \"Krabban – inga korsade fötter!\"\n\nSäg: \"Hajen kommer – mjuk landning!\""
        },
        {
          id: "s3", title: "Muren 1mot1 i banor — återaktivering", duration: 10,
          body: "Vecka 9-leken som de känner den: banor ~4 m breda × 10 m, anfallaren dribblar för att ta sig över mållinjen, försvararen stoppar henne. Kram eller grepp = anfallaren gör mål. Omgångar på 20–30 s, byt roller.\n\n- Snabb omdemo av bara reglerna (30 s), ingen ny undervisning.\n- Händerna bakom ryggen för den försvarare som fortsätter sträcka sig.\n- Parindelning: starkare mot starkare första omgången, sedan starkare med svagare.\n\n40-sekundersregeln efter omgång 3:\nSäg: \"Nu stänger vi ögonen i 40 sekunder och tänker på muren — var stod du?\""
        },
        {
          id: "s4", title: "Muren 2mot2 + Frys-kollen (nytt)", duration: 18,
          body: "Egen design, bygger på Muren och 1v1 Shell Defense. Problemet den riktar sig mot: när bollen passas vänder försvararna sig för att jaga den och lämnar sin egen spelare fri.\nUppställning: två halvplaner (eller två korgar på en sida), 2mot2 vid varje. Varje försvarare har sin anfallare. Upp till 4 grupper om fyra; rotera lag in/ut varannan minut om ni är fler.\n\nRegler:\n\n- Anfall: max 2 studs, sedan passa eller skjut. 2-sekunders passklocka. 2 poäng per korg.\n- Försvar: stanna med din spelare. Kram eller grepp = korg till anfallet.\n- Frys-kollen: var 30–45:e sekund ropar tränaren \"FRYS!\" Alla fryser. Varje försvarare kollar sig själv — mellan sin spelare och korgen = 1 poäng till försvaret. Spela sedan vidare därifrån.\n- Byt anfall/försvar varannan minut.\n\nSäg det (30 s):\nSäg: \"Ni är två mot två. Försvararen har en egen spelare. När bollen passas – stanna hos din spelare, inte bollen.\"\n\nVisa det (30 s): frys två spelare själv — en försvarare \"mellan\", en \"bredvid/jagar\".\nSäg: \"Vem är muren?\"\n\nGå igenom det (1 min): en grupp i gångtakt — passning → försvararna justerar → FRYS.\n\nPrata om det (30 s):\nSäg: \"Säg till din kompis: vart går du när bollen passas?\"\n\nSpela det: full fart med Frys-kollen. Vid FRYS är självkollen:\nSäg: \"Står jag mellan min spelare och korgen?\"\n\nLär ut det (om tid finns): en spelare som förstått visar en kompis vid FRYS.\nSäg: \"Kan du visa var hon borde stå?\"\n\nPausa var 3–4:e minut och ställ en fråga, låt dem svara:\nSäg: \"Vad hände när bollen flyttades?\"\n\nSäg: \"Stå mellan, inte bredvid!\"\n\nSäg: \"Din spelare, inte bollen!\"\n\nLättare: anfallet måste passa minst en gång innan skott (ger försvararna ett enkelt \"bollen flyttades\"-läge att öva på). Svårare: försvararna får 1 bonuspoäng för en bollvinst utan att lämna målsidan.\n\nParindelning: varje par = en starkare + en svagare, så att den starkare försvararen visar positionen vid varje FRYS."

        {

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
