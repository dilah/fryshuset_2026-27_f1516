<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----

  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {
    en: {
    wed: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 3 · WED 17–18",
      title: "Bounce-Pass Rondo & Shooting Introduction",
      focus: "This week doesn't add new team-decision material — it re-tests and deepens rung 1 (triple threat + reading who's open) with a variation, because Thursday's open 3v3 test came back mixed. The variation is bounce-passes-only in the 3v1 Rondo: it's one of the loading options already built into that drill, so it isn't \"new,\" but it forces a slower, more deliberate release that should make the triple-threat pause easier to hold onto — and it doubles as the dedicated bounce-pass technique rep that's now flagged as its own weakness, separate from decision-making. Shooting form (BEEF) gets its first formal introduction this week too — already informally slated for \"around Week 3\" back in Week 1. Warm-up adds exactly one new piece, enbensknäböj — the earlier draft stacked four new BasketSmart moves in one go, which broke the same one-new-thing-at-a-time rule the rest of the plan runs on, so it's trimmed back; the rest of the reserved pieces (the partner-jump temperaturstegring variants, enbenshopp-och-sprint) queue up one per week starting Week 4 or 5. Dribbling's dedicated slot is also deliberately skipped this week for the same reason — it's getting ambient volume through the warm-up's ball-in-hand pieces, and a focused slot returns next week.",
      sections: [
        {
          id: "s1", title: "Opening Circle — Incheckning", duration: 5,
          body: "Quick gather. Recall last week: triple threat, reading who's open.\n\nSay: \"Vad var nytt förra veckan — trippelhot, och...?\"\n\nRemind the group today has two new things: a shooting rule you'll teach for the first time, and a twist on Rondon. Peppa varandra still gets named out loud in the moment, no scoring."
        },
        {
          id: "s2", title: "Warm-Up — Adding Enbensknäböj", duration: 10,
          body: "One new piece this week, everything else stays exactly as Weeks 1–2 so there's nothing to re-explain.\n\nCues throughout: \"Knä över tå,\" \"Kontroll,\" \"Upprätt position\"\n\n- Temperaturstegring, del 1 & del 2 (4 min): same as the last two weeks — dribble sequence baseline and back, then paired shoulder-to-shoulder running. Already familiar, just call it out.\n- Plankan (1 min): full stretch, no sagging.\n- Knäböj + utfallssteg med boll mot tak (3 min): same as always, ball overhead, knee over foot.\n- Enbensknäböj (2 min) — new today: stand on one leg, hands on hips, slow controlled squat up and down, foot-knee-hip in line, hips level.\n\nSay it once, show it once, then straight into reps: \"Upprätt position — tappa inte magen eller höften!\""
        },
        {
          id: "s3", title: "Shooting — BEEF Form Introduction", duration: 9,
          body: "Focus: first formal shooting technique of the season — form only, no scoring pressure. This is a habit being built over months, not a one-week teach.\nSetup: pairs, very close to the basket (1–2m), one ball per pair.\n\nHow: say it — B=Balance, E=Eyes on target, E=Elbow under the ball, F=Follow-through. Show it once, slow, connected. Then pairs take turns shooting and rebounding from point-blank range, focused purely on form.\n\nSay: \"Knän, armbåge under bollen, följ med handen mot korgen!\"\n\nPairing: stronger player shows the form first, weaker player copies.\n\nEasier: shoot from 1m, both hands OK. Harder: step back after each make, or use the weak hand.\n\n40-second rule: after the third make each, 40 seconds of silent replay — \"Nu stänger vi ögonen i 40 sekunder och tänker på hur handen följde med bollen.\""
        },
        {
          id: "s4", title: "3v1 Rondo — Bounce-Passes-Only Re-Test", duration: 15,
          body: "Focus: the same lesson as Week 2 (catch → triple threat → read → decide), re-tested through a variation rather than new material. Bounce-only forces a visible, slower release — it should make the triple-threat pause easier to spot and hold, and it's this week's dedicated bounce-pass technique rep at the same time.\nSetup: groups of 4, ~4–5m triangle marked by cones, one defender in the middle.\n\nHow: same rules as Week 2's Rondo — 10 passes in a row wins the round for attackers, a defender interception wins it for them, switch defender each round — but every pass must be a bounce pass this week. No lobbing.\n\nSay: \"Studspassning idag! Trippelhot innan du passar — vem är fri?\"\n\nFocus points: attackers read who's actually open before passing; defense stays big and in a stance; attackers call out a good read out loud once comfortable.\n\nEasier: bigger triangle, no time pressure, coach fills in as a 4th attacker if numbers are odd. Harder: 2-second \"hot potato\" rule on top of bounce-only.\n\nPeppa moment: name good reads and clean bounce-pass technique out loud as they happen."
        },

        },
        {
          id: "s6", title: "Closing Circle — Utcheckning", duration: 5,
          body: "Say: \"Vem peppade bra idag? Vad gjorde de?\"\n\nAsk one player to recall the shooting cue (BEEF, in their own words).\n\nClose with hands in the middle: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "Watch specifically whether the bounce-only constraint makes the triple-threat pause show up more consistently than last week's chest-pass version did — that's the comparison you're after. Keep the shooting block genuinely low-pressure; the goal this week is form existing at all, not makes. Next in the warm-up queue: partner-jump temperaturstegring variants and enbenshopp-och-sprint, one at a time, starting Week 4 or 5."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 3 · THU 18–19",
      title: "Opening Rung 2: Space & Time",
      focus: "Wednesday's bounce-only Rondo went well enough that today opens rung 2 rather than running another pure rung-1 retest — spacing and time-constrained passing, taught as one combined idea: a pass clock and shrinking numbers are what force players to spread out and get open, not a lecture on positioning. Club language throughout (\"Spacing,\" \"Göra sig fri,\" \"Spelbar,\" \"Vem är fri?\") comes from the Fryshuset coach handbook rather than invented terms. The four games build in a deliberate arc: easiest possible numbers advantage first (2v1), then the purest spacing test with nothing else layered on (2v2), then the combined spacing-plus-clock constraint (Klump, 3v3), then a full-court transition test where none of it is scripted anymore. Every game plays to a real basket and is scored first-to-1-then-reset, so rounds turn over fast and rotation stays high. Game 4 carries the actual test this week — whether rung 1 held from Wednesday, and whether any spacing habit shows up unprompted once the constraints are gone.",
      sections: [
        {
          id: "t1", title: "Opening Circle — Incheckning", duration: 5,

        },
        {
          id: "t3", title: "Game 1 — 2v1, Extra Pass Challenge", duration: 7,
          body: "Focus: the easiest possible numbers advantage — with a defender who can only cover one of two attackers, there's always a passing read available. Sets up everything after it: this is spacing and passing at their simplest.\nSetup: groups of 3, half court, real basket. Rotate the defender each round.\n\nHow: 2 attackers vs. 1 defender, no dribble — pass only. First to 1 basket wins the round, then rotate defender and reset. Only pass to the teammate once she's clearly more open than you are.\n\nSay: \"Ge passet du INTE behövde ge — det är det bästa passet!\"\n\nEasier: bigger space, defender plays soft. Harder: tighter space, defender allowed to jump passing lanes.\n\nPeppa moment: celebrate the extra pass itself — passer and scorer high-five before rotating."
        },
        {
          id: "t4", title: "Game 2 — 2v2 Half Court, Spacing on Full Display", duration: 10,
          body: "Focus: the purest spacing test — with only 2 attackers, there's nowhere to hide bad spacing. Stand too close together and one defender covers both of you.\nSetup: half court, 2v2, real basket, live defense, dribble allowed — this one plays like normal basketball, the numbers alone create the constraint.\n\nHow: standard 2v2, first to 1 basket then reset, rotate pairs regularly.\n\nSay: \"Två anfallare, hela planen — sprid ut er!\"\n\nEasier: defense plays softer, less help. Harder: defense allowed to switch/help aggressively.\n\nPeppa moment: name a moment where good spacing directly led to an open shot."

        {
          id: "t5", title: "Game 3 — Klump, 3v3 (Spacing + Pass Clock)", duration: 11,
          body: "Focus: real 3v3 to a basket, live defense — the klump-zone and pass clock are constraints layered on top of an actual game. Fourth week of the no-dribble/stall-clock lineage, now combined with spacing.\nSetup: 3v3, half court, real basket, live defense. No dribbling. A ~2m \"klump-zon\" surrounds whoever has the ball — moves with the ball.\n\nHow: first to 1 basket, then reset. Attackers pass and move only, no dribble, can't stand inside the klump-zon off-ball — step in it → \"Klump!\" → turnover. Ball-holder has 3 seconds to pass or shoot.\n\nSay: \"Ingen klump nära bollen — sprid ut er! Bli spelbar!\"\n\nSay: \"Ett... två... tre... BOLL BYTE!\"\n\nFocus points: off-ball attackers \"göra sig fri\" for a real look, not just avoiding the zone. Ball-holder asks \"Vem är fri?\" before every pass.\n\nEasier: bigger zone, 4-second clock. Harder: smaller zone, 2-second clock.\n\nPeppa moment: name a relocation that led to an actual shot look."

    }

      sections: [

        },
        {
          id: "s2", title: "Uppvärmning — Lägger till enbensknäböj", duration: 10,
          body: "En ny del denna vecka, allt annat är exakt som vecka 1–2 så det finns inget att förklara på nytt.\n\nLedord hela tiden: \"Knä över tå\", \"Kontroll\", \"Upprätt position\"\n\n- Temperaturstegring, del 1 & del 2 (4 min): samma som de senaste två veckorna — dribbelsekvens baslinjen och tillbaka, sedan parvis axel-mot-axel-löpning. Redan bekant, bara ropa ut det.\n- Plankan (1 min): full plankposition, ingen svank.\n- Knäböj + utfallssteg med boll mot tak (3 min): som alltid, boll över huvudet, knä över fot.\n- Enbensknäböj (2 min) — nytt idag: stå på ett ben, händerna på höfterna, långsam kontrollerad knäböj upp och ner, fot-knä-höft i linje, höfterna i nivå.\n\nSäg det en gång, visa det en gång, gå sedan rakt in i repetitioner: \"Upprätt position — tappa inte magen eller höften!\""
        },
        {
          id: "s3", title: "Skytte — Introduktion av BEEF-formen", duration: 9,
          body: "Fokus: säsongens första formella skytteteknik — bara form, inget poängtryck. Det här är en vana som byggs över månader, inte en engångslektion.\nUppställning: par, mycket nära korgen (1–2 m), en boll per par.\n\nSå här: säg det — B=Balans, E=Ögonen på målet, E=Armbågen under bollen, F=Följ igenom (BEEF). Visa det en gång, långsamt, sammankopplat. Sedan turas paren om att skjuta och retura på mycket nära håll, med fullt fokus på formen.\n\nSäg: \"Knän, armbåge under bollen, följ med handen mot korgen!\"\n\nParindelning: den starkare spelaren visar formen först, den svagare kopierar.\n\nLättare: skjut från 1 m, båda händerna okej. Svårare: kliv bakåt efter varje träff, eller använd den svaga handen.\n\n40-sekundersregeln: efter den tredje träffen var, 40 sekunder tyst repris — \"Nu stänger vi ögonen i 40 sekunder och tänker på hur handen följde med bollen.\""
        },
        {
          id: "s4", title: "3mot1 Rondo — Omtest med bara studspassningar", duration: 15,
          body: "Fokus: samma lektion som vecka 2 (fånga → trippelhot → läs av → bestäm), omtestad genom en variation istället för nytt material. Bara studspassningar tvingar fram en synlig, långsammare release — det borde göra trippelhot-pausen lättare att upptäcka och hålla, och det är samtidigt veckans dedikerade studspassnings-teknikrepetition.\nUppställning: grupper om 4, ~4–5 m triangel markerad med koner, en försvarare i mitten.\n\nSå här: samma regler som vecka 2:s Rondo — 10 passningar i rad vinner omgången för anfallarna, en försvararintercept vinner den för dem, byt försvarare varje omgång — men varje passning måste vara en studspassning denna vecka. Ingen lobbning.\n\nSäg: \"Studspassning idag! Trippelhot innan du passar — vem är fri?\"\n\nFokuspunkter: anfallarna läser av vem som faktiskt är fri innan de passar; försvaret håller sig stort och i baskettställning; anfallarna kallar ut en bra läsning högt när de är bekväma.\n\nLättare: större triangel, ingen tidspress, tränaren fyller i som fjärde anfallare om antalet är udda. Svårare: 2-sekundersregeln \"heta potatisen\" utöver bara studspassningar.\n\nPeppa-stund: kalla ut bra läsningar och ren studspassningsteknik högt när de händer."

      sections: [

          body: "Samma struktur som de senaste två veckorna, inga nya delar idag — det nya materialet finns i lekarna.\n\nLedord hela tiden: \"Knä över tå,\" \"Kontroll\"\n\n- Promenad (2 min): baslinjen och tillbaka, varierat.\n- Lätt jogg (1 min): baslinjen och tillbaka, höga knän / hälsparkar.\n- Lätt styrkeuppvärmning (2 min): knäböj, utfall, höftlyft.\n- Korta accelerationer (1 min): sprintar sidlinje till sidlinje.\n- Tävlingssprint (2 min): sidlinjelopp, varierade starter.\n- Plankan (1 min, invävd): full plankposition."
        },
        {

        },
        {
          id: "t4", title: "Lek 2 — 2mot2 halvplan, yta i fokus", duration: 10,
          body: "Fokus: det renaste yttestet — med bara 2 anfallare finns det ingenstans att gömma dålig yta. Står ni för nära varandra täcker en försvarare er båda.\nUppställning: halvplan, 2mot2, riktig korg, levande försvar, dribbling tillåten — den här spelas som vanlig basket, det är bara antalet spelare som skapar begränsningen.\n\nSå här: vanligt 2mot2, första till 1 korg och sedan återställ, rotera paren regelbundet.\n\nSäg: \"Två anfallare, hela planen — sprid ut er!\"\n\nLättare: försvaret spelar mjukare, mindre hjälpförsvar. Svårare: försvaret får växla/hjälpa aggressivt.\n\nPeppa-stund: namnge ett ögonblick där bra yta direkt ledde till ett öppet skottläge."

        {

          body: "Fokus: veckans riktiga test — övergångsspel på helplan, inget manusstyrt. Varje boll-innehav tar slut snabbt, och paret som just anföll måste sprinta tillbaka och försvara direkt istället för att sätta sig till rätta. Om steg 1 höll och om någon yt-vana visar sig utan uppmaning besvaras båda här. Par istället för trior gör det hanterbart på en liten plan.\nUppställning: helplan, dela in i par — kräver minst 3 par (6+ spelare), extra spelare bildar fler par och roterar genom väntplatsen. Två par är aktiva vid en korg (ett anfallande, ett försvarande), tredje paret väntar vid det änden.\n\nSå här: Par A anfaller korg 1 mot Par B som försvarar. I samma stund A:s boll-innehav tar slut — korg, defensiv retur, eller boll-erövring — passar B ut till väntande Par C, som för bollen mot korg 2. A sprintar hela vägen tillbaka för att försvara. B blir det nya väntande paret. Cykeln upprepas kontinuerligt.\n\nSäg: \"Boll ut — spring direkt!\"\n\nSäg: \"Vem är fri på snabb boll?\"\n\nOm ytan fortfarande känns trång: markera en bana längs varje sidlinje för att minska frontalkrock genom mitten. Om det fortfarande är för mycket: gå tillbaka till trekvartsplan istället för helplan — förlorar lite konditionsdistans men behåller själva övningen intakt.\n\nPeppa-stund: namnge paret som ställer om snabbast utan att tappa formen."

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
