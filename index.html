<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {
    en: {
    wed: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 12 · WED 17–18",
      title: "Repetition — Recap Before Saturday's Match",
      focus: "No new teaching this week — everything is a game the girls already know, with a constraint that brings back one idea from the last month: give-and-go (\"HIT!\"), boxing out (\"Stäng ut!\"), Muren (the wall — hugging a player costs the attacker a point, every game, all week), quick inbound and playing forward (\"Framåt!\"/\"Tillbaka!\"), and spacing/Klump (\"Spelbar\"). Tempo over perfect passes stays the standing rule, and after a basket the nearest girl inbounds right away — the coach never hands the ball back. Big hall today: full court, longer games. Wednesday is the harder session; Thursday stays game-based but shorter, with no sprint races, so legs are fresh for Saturday.",
      sections: [
        {
          id: "s1", title: "Incheckning", duration: 2,
          body: "Say: \"På lördag har vi match! Den här veckan lär vi oss inget nytt. Vi spelar alla lekar vi kan och visar hur mycket vi har lärt oss.\"\n\nQuick-fire questions, with one girl answering each.\n\nSay: \"Vad betyder Mur? Vad betyder HIT? Vad gör vi när bollen går i korgen?\""
        },
        {
          id: "s2", title: "Warm-Up — Hav-Skepp-Land (Mur / Krabban / Hajen Kommer)", duration: 8,
          body: "Use the full length of the hall: Hav = baseline, Skepp = half-court, Land = far baseline. Mix the old commands with the three new ones:\n\n- \"Mur!\": stop, take your defensive stance, hands up and NOT forward.\n- \"Krabban!\": slide sideways 3–4 steps and back.\n- \"Hajen kommer!\": jump up and land balanced on two feet.\n\nLast 2 minutes: elimination rounds, short ones, so nobody stands out for long."
        },
        {
          id: "s3", title: "Game 1 — Jagaren (2v1 + Chaser)", duration: 10,
          body: "Recap of: week 11, play the ball forward fast. Same as last week.\nSetup: coach drops the ball through the basket → the nearest girl inbounds → 2 attackers vs 1 defender at half-court → the jagare (chaser) starts 2 s late. Rotate: attackers → defender + jagare.\n\nConstraint this time: a basket scored without a dribble after the inbound = 2 points.\n\nSay: \"Jagaren kommer! Passa framåt — bollen är snabbare än du!\"\n\nTo the defender:\n\nSay: \"Mur!\"\n\nEasier: the jagare starts 3 s late. Harder: the jagare starts at once."
        },
        {
          id: "s4", title: "Game 2 — Klump 3v3 + HIT Bonus", duration: 12,
          body: "Recap of: spacing (Klump) + give-and-go (week 8). Half-court 3v3 on both baskets if possible (the big hall), with 4 teams of 3.\n\nRules:\n\n- Klump rules: if two teammates stand close enough to touch → the ball goes to the other team. Pass clock: 2 s, as in week 7.\n- A basket off a give-and-go (pass, cut, \"HIT!\", score) = 2 points.\n- The hugging rule stays on.\n\nSwitch opponents after 6 minutes.\n\nPause (~6 min):\n\nSay: \"Hur fick ni 2 poäng? Visa mig!\"\n\nOne trio shows its give-and-go, which is peer teaching."
        },
        {
          id: "s5", title: "Water", duration: 2,
          body: "Quick water break. No instruction — just a breather before the shuttle."
        },
        {
          id: "s6", title: "Game 3 — 3v3v3 Shuttle, \"Stäng Ut & Framåt\"", duration: 14,
          body: "Recap of: box out (week 8), transition defense (week 7), quick inbound / Framåt (week 11). Full court, continuous, as in week 7.\nSetup: one trio waits at each baseline and one trio attacks from half-court.\n\nHow: the attacking trio goes at one baseline trio. Whoever wins the ball (a basket, a defensive rebound or a steal) goes immediately the other way against the trio waiting at the far end. The team that lost the ball stays and becomes the waiting trio.\n\nConstraints:\n\n- On a missed shot the defenders shout \"Stäng ut!\" and box out. A rebound + outlet pass to a wing = 1 bonus point.\n- After a basket: quick inbound, and no waiting for the coach.\n- Score before the coach reaches \"8\" (counted from the moment your team wins the ball) = 2 points.\n\nPauses: on the clock, about every 4 minutes, 20 seconds each:\n\nSay: \"Vad var det som gjorde att ni hann före?\""
        },
        {
          id: "s7", title: "Game 4 — 4v4 Full Court, Match Rehearsal", duration: 9,
          body: "Run it exactly the way Saturday will work: squads, substitutions on the whistle, everyone gets equal time. Normal rules plus the hugging rule. The coach is silent except to praise by name.\n\nWith 10–12 girls: 3 squads of 4 (or 2 teams + bench), changing every 3 minutes."
        },
        {
          id: "s8", title: "Cool-Down / Talk", duration: 3,
          body: "Say: \"Vilken av lekarna idag kommer vi att använda mest på lördag?\"\n\nLet them answer, then:\n\nSay: \"Imorgon spelar vi ännu mer!\""
        }
      ],
      tip: "Recap isn't re-teach: if an old idea isn't showing, don't stop the game to explain it — raise its points value in the next round instead (e.g. a wall = 2 points). The constraint does the talking. Run Game 4 with the squads you plan to use on Saturday, so the girls already know who they play with."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 12 · THU 18–19",
      title: "Repetition — Four Games Before Saturday",
      focus: "Small hall, half-court games, short rounds, fast restarts, many touches. Four recap formats build up to the free read, then a calm wrap-up for Saturday: Muren (wk 9–10), numbers-up give-and-go (wk 8/11), the free 3v3 read on Muren/spacing/speed, and Snabba kungen as the fun finish. Shorter than Wednesday and no sprint races, so legs stay fresh for the match.",
      sections: [
        {
          id: "t1", title: "Incheckning", duration: 2,
          body: "Say: \"Idag spelar vi bara matcher! Fyra olika sorters.\""
        },
        {
          id: "t2", title: "Warm-Up — Het Potatis-Kull", duration: 8,
          body: "The week 10 version: the taggers have no ball, and only a runner who is holding a ball can be tagged. The small area keeps the pressure high. Add an extra ball for the last 2 minutes.\n\nSay: \"Bollen är het! Släpp den snabbt!\""
        },
        {
          id: "t3", title: "Game 1 — Muren 2v2 + Frys-Kollen", duration: 10,
          body: "Recap of: week 10, stay goal-side when the ball is passed. Played the same way as in week 10.\nSetup: 2v2 half-court. At any moment the coach shouts \"Frys!\": everyone freezes, and the defenders check.\n\nSay: \"Står jag mellan min spelare och korgen?\"\n\nIf both are right = a point for the defense. Then play on at once (keep the freezes short, max 5 seconds).\n\nHugging = a point to the attacker.\n\nUse 2 baskets if the hall has side baskets; otherwise rotate pairs in after each basket."
        },
        {
          id: "t4", title: "Game 2 — 3v2 Shell, \"Ta Ut & Attackera\"", duration: 12,
          body: "Recap of: numbers-up play (rung 4), give-and-go, playing fast after winning the ball (week 11). 3 attackers vs 2 defenders at one basket.\n\nConstraints:\n\n- A give-and-go basket = 2 points.\n- When the defense wins the ball, they take it out past the 3-point line and attack straight away, and the former attackers defend. A basket within 4 s of taking it out = 2 points.\n- Rotation is possession-based (as in week 8): after each basket, one waiting girl comes in and one goes out."
        },
        {
          id: "t5", title: "Game 3 — Free 3v3, The Read", duration: 12,
          body: "No constraints, no bonus points. Normal rules and a quick inbound after baskets. Coach watches silently.\n\nRead three things (broadly yes / mixed / mostly no for each):\n\n- Muren: do defenders stay between their player and the basket after a pass? Feet or arms?\n- Spacing: do they spread out without being told, and does anyone cut?\n- Speed: after a basket, does the nearest girl inbound without being told, and do the others run forward?\n\nThis also gives the starting point for planning after the match."
        },
        {
          id: "t6", title: "Game 4 — Snabba Kungen (3v3 King of the Court)", duration: 10,
          body: "Same as week 11: the team that scores stays on, the next team sprints in and inbounds immediately, and a team leaves after 3 baskets in a row so everyone plays.\n\nThis is the fun finish. Now coach live: call out fast inbounds, walls and give-and-go's by name."
        },
        {
          id: "t7", title: "Match Talk + Cool-Down", duration: 6,
          body: "Sit in a circle and stretch while talking. Keep it about three things only, in their words:\n\n- \"Vad gör vi när bollen går i korgen?\" → ta bollen, ut, framåt\n- \"Vad gör vi när vi försvarar?\" → Mur, inte krama\n- \"Vad gör vi om vi missar eller gör fel?\" → nästa boll! (the culture goal: trust and fun after mistakes)\n\nPractical info: meeting time and place, water bottle, sleep.\n\nSay: \"Ni har tränat jättebra. På lördag har vi kul och visar vad vi kan!\""
        }
      ],
      tip: "No extra sprints and no punishment runs today — keep the energy up with short rounds, not with volume. With this many short game formats there's little standing time; keep the waiting teams cheering and ready to come straight in, so they have a job."
    }
    },
    sv: {
    wed: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 12 · ONS 17–18",
      title: "Repetition — Återblick Inför Lördagens Match",
      focus: "Ingen ny undervisning den här veckan — allt är en lek tjejerna redan känner, med en begränsning som tar tillbaka en idé från den senaste månaden: give-and-go (\"HIT!\"), att stänga ut (\"Stäng ut!\"), Muren (väggen — att krama en spelare kostar anfallaren en poäng, i alla lekar, hela veckan), snabbt inkast och att spela framåt (\"Framåt!\"/\"Tillbaka!\"), och spacing/Klump (\"Spelbar\"). Fart före perfekta passningar förblir den stående regeln, och efter en korg kastar den närmaste tjejen in direkt — tränaren lämnar aldrig över bollen. Stor hall idag: helplan, längre lekar. Onsdagen är det tuffare passet; torsdagen förblir lekbaserad men kortare, utan sprinttävlingar, så benen är fräscha inför lördagen.",
      sections: [
        {
          id: "s1", title: "Incheckning", duration: 2,

        },
        {
          id: "s2", title: "Uppvärmning — Hav-Skepp-Land (Mur / Krabban / Hajen Kommer)", duration: 8,

        },
        {

        },
        {
          id: "s4", title: "Lek 2 — Klump 3mot3 + HIT-Bonus", duration: 12,
          body: "Repetition av: spacing (Klump) + give-and-go (vecka 8). Halvplan 3mot3 på båda korgarna om möjligt (den stora hallen), med 4 lag om 3.\n\nRegler:\n\n- Klump-regler: om två lagkompisar står nära nog att röra varandra → bollen går till det andra laget. Passklocka: 2 s, som i vecka 7.\n- En korg från ett give-and-go (passning, skärning, \"HIT!\", mål) = 2 poäng.\n- Kramregeln gäller.\n\nByt motståndare efter 6 minuter.\n\nPaus (~6 min):\n\nSäg: \"Hur fick ni 2 poäng? Visa mig!\"\n\nEn trio visar sitt give-and-go, vilket är kamratundervisning."
        },
        {
          id: "s5", title: "Vatten", duration: 2,
          body: "Snabb vattenpaus. Ingen instruktion — bara en andningspaus innan skytteln."
        },
        {
          id: "s6", title: "Lek 3 — 3mot3mot3-Skyttel, \"Stäng Ut & Framåt\"", duration: 14,
          body: "Repetition av: att stänga ut (vecka 8), omställningsförsvar (vecka 7), snabbt inkast / Framåt (vecka 11). Helplan, kontinuerligt, som i vecka 7.\nUppställning: en trio väntar vid varje baslinje och en trio anfaller från mittplan.\n\nSå här: den anfallande trion kör mot en baslinjetrio. Vem som vinner bollen (en korg, en defensiv retur eller en bollvinst) går direkt åt andra hållet mot trion som väntar i den bortre änden. Laget som förlorade bollen stannar och blir den väntande trion.\n\nBegränsningar:\n\n- Vid en missad skott ropar försvararna \"Stäng ut!\" och boxar ut. En retur + utpassning till en wing = 1 bonuspoäng.\n- Efter en korg: snabbt inkast, inget väntande på tränaren.\n- Mål innan tränaren räknar till \"8\" (räknat från stunden ert lag vinner bollen) = 2 poäng.\n\nPauser: på klockan, ungefär var 4:e minut, 20 sekunder var:\n\nSäg: \"Vad var det som gjorde att ni hann före?\""
        },
        {
          id: "s7", title: "Lek 4 — Helplan 4mot4, Matchrepetition", duration: 9,

      tip: "Repetition är inte omundervisning: om en gammal idé inte visar sig, stoppa inte leken för att förklara — höj poängvärdet i nästa omgång istället (t.ex. en mur = 2 poäng). Begränsningen gör pratet. Kör Lek 4 med de trupper ni planerar använda på lördag, så tjejerna redan vet vem de spelar med."

  };

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
