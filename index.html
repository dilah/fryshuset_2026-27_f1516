<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {
    en: {
    wed: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 11 · WED 17–18",
      title: "Snabbt Spel — Quick Inbounds, Play It Forward",
      focus: "One idea, two halves of it: Snabbt inkast — after a basket or out-of-bounds, the nearest girl grabs the ball, steps out, and passes in immediately, nobody waits for the coach or \"sets up\". Spela framåt — the first look after the catch is up the court; a pass ahead beats a dribble ahead, and teammates without the ball sprint wide and forward to be \"spelbar\". Uses the club's own keywords: \"Framåt\" (attack fast), \"Tillbaka\" (defense sprints back), \"Spelbar\" (get open). Muren stays as the defensive habit — the fast-break defender games keep it live without teaching it again. Tempo over precision (standing rule): don't stop reps for loose passes, praise the fast decision, not the perfect pass. Big hall this week — use the full length for running waves and full-court games; Thursday's small hall shifts the speed to the restart instead.",
      sections: [
        {
          id: "s1", title: "Incheckning", duration: 2,
          body: "Circle up. One question.\n\nSay: \"Vad betyder 'Framåt' när vi spelar?\"\n\nTake 2–3 answers, then:\n\nSay: \"Idag tränar vi på att vara snabbast i hela hallen — snabbast med bollen, inte bara snabbast att springa.\""
        },
        {
          id: "s2", title: "Warm-Up — Snabbstart-sprint med boll", duration: 10,
          body: "Source: SBBF fysträning — tävlingssprint with varied start positions, with a ball added.\nSetup: everyone on the baseline, one ball each. Full length of the court.\n\nHow:\n\n- Rounds 1–3 (no ball, 3 min): start positions vary — sitting, lying on stomach, lying on back, facing backwards. Coach claps → sprint to half-court, jog back. 10–20 s rest between.\n- Rounds 4–7 (ball, 4 min): same start positions, ball on the floor beside them. Clap → grab ball, speed dribble to the far free-throw line, stop, look up (coach holds up fingers, girls shout the number), dribble back with the weak hand.\n- Round 8–9 (race, 3 min): pairs, one ball between two. Clap → first to the ball dribbles, the other chases (tag the back = point). Swap roles.\n\nThe \"look up and shout the number\" bit is the point — speed with eyes up, not eyes on the ball.\n\nSay: \"När jag klappar — upp och iväg! Snabbast vinner.\"\n\nSay: \"Titta upp! Hur många fingrar?\"\n\nSay: \"Tillbaka med svaga handen!\""
        },
        {
          id: "s3", title: "Drill 1 — Inkast-racet", duration: 12,
          body: "Focus: quick inbound + first pass forward. This is the week's new concept — full teaching sequence.\nSetup: full court. Groups of 3 lined up behind the baseline at one end (4 groups if 12 girls). One ball per group, held by the coach at the basket.\n\nHow it works: coach drops the ball through the basket (= \"the other team just scored\"). The 3 girls react: closest girl grabs it, steps out behind the baseline. The other two sprint wide — one to each sideline, at least to the free-throw line extended. Inbound pass to a wing → that wing passes ahead to the other girl running the far sideline (or dribbles if nothing is open) → finish with a layup at the far end. Coach counts out loud from the drop. Score before \"8\" = 1 point for the group. Walk back along the sideline; next group goes.\n\nTeaching sequence: say it —\n\nSay: \"När bollen går i korgen — den som är närmast tar bollen och går ut. De andra springer brett, mot sidlinjerna. Första blicken är framåt.\"\n\nShow it: walk one group through it slowly, pointing at the three spots (inbounder, two wide runners). Walk it: every group does one rep at half speed, no counting. Talk it:\n\nSay: \"Säg till din kompis: vem tar bollen, och vart springer de andra?\"\n\n(20 seconds in the group)\n\nPlay it: full speed with the 8-count. Teach it (if time): one girl from a fast group shows another group where she ran.\n\nSay: \"Kan du visa var du sprang?\"\n\n40-second rule after the third full-speed round:\n\nSay: \"Nu stänger vi ögonen i 40 sekunder och tänker på vad vi just gjorde.\"\n\nSay: \"Ta bollen — ut — in! Snabbt!\"\n\nSay: \"Brett! Spring till sidlinjen!\"\n\nSay: \"Framåt! Vem är längst fram?\"\n\nEasier: no count — just complete the inbound + one pass forward + any finish. Harder: count drops to 6, or add one defender at half-court who must be beaten with a pass, not a dribble.\n\nPairing tip: each group of 3 = 1–2 stronger + 1 weaker. Rotate who inbounds every rep so the weaker girl doesn't hide on the wing."
        },
        {
          id: "s4", title: "Drill 2 — Jagaren (2v1 + Chaser)", duration: 12,
          body: "Focus: playing the ball forward fast, because someone is coming. Defense side: \"Tillbaka\" + Muren in transition.\nSetup: full court. Two lines at the baseline (attackers), one defender at half-court, one \"jagare\" (chaser) standing behind the baseline next to the attackers.\n\nHow it works: coach passes to one attacker (or drops the ball through the basket → quick inbound, like Drill 1). The two attackers go 2v1 against the half-court defender toward the far basket. The jagare starts 2 seconds later (coach shouts \"Jagare!\") and sprints to help defend → if the attackers are slow, it becomes 2v2. Rotation: attackers → become next half-court defender and jagare; defender + jagare → back of the attack lines.\n\nThe chaser is the whole point: the girls feel that slow = 2v2, fast = 2v1. Nobody needs to explain it.\n\nTeaching sequence: rules only (this is a game, not new technique) — quick demo of who starts where and when the jagare goes. Then play. Pause once around the 5-minute mark and ask, then let them answer:\n\nSay: \"När var det lättast att göra mål? Varför?\"\n\n(let them find \"when we passed forward quickly\")\n\nSay: \"Jagaren kommer! Ni har två sekunder!\"\n\nSay: \"Passa framåt — bollen är snabbare än du!\"\n\nTo the defender:\n\nSay: \"Mur! Stå mellan bollen och korgen.\"\n\nTo the jagare:\n\nSay: \"Tillbaka! Spring hela vägen!\"\n\nEasier: jagaren starts 3 seconds late. Harder: jagaren starts immediately, or 3v2 with a chaser (if the group is strong today).\n\nPairing tip: stronger + weaker together as attackers. Put a strong girl as jagare against weaker attackers — it makes the speed lesson clear without making it a 1v1 contest."
        },
        {
          id: "s5", title: "Scrimmage — 8-Sekunders-Matchen", duration: 20,
          body: "Format: full court 4v4 (or 3v3 + subs if 10 girls), squads rotating every 3–4 minutes.\n\nRules:\n\n- Snabbt inkast is mandatory: after every basket, the other team inbounds right away from behind the baseline. No coach handing the ball over, no waiting.\n- 8-second bonus: coach counts from the inbound. Score before 8 = 2 points. Normal basket = 1 point.\n- Tillbaka rule: when you lose the ball, the whole team sprints back past half-court before anyone else defends.\n\nStay quiet during play — just count out loud and call out good inbounds by name.\n\nSay: \"Bra inkast, Ella!\"\n\nPause on the clock (roughly every 4 minutes), 20 seconds:\n\nSay: \"Vad gjorde laget som fick 2 poäng?\"\n\nWorks solo: yes — counting is the only job. With an assistant: assistant runs the rotation and the bench."
        },
        {
          id: "s6", title: "Cool-Down / Talk", duration: 4,
          body: "Stretch in a circle. One takeaway:\n\nSay: \"Vad är det första du gör när bollen går i korgen?\"\n\n(aim for \"ta bollen, ut, in\" or \"spring brett\")\n\nSay: \"Superbra träning idag! Ni var snabba! Vi ses imorgon!\""
        }
      ],
      tip: "Don't hand the ball over after baskets — in any game this week. Every time the coach picks up the ball and gives it back, the girls learn to wait; let it bounce, the nearest girl gets it. Count out loud, always — the counting is the coaching, it creates urgency without you directing anything. Watch the weaker subgroup on the wings — they tend to stand at the inbound spot waiting for the ball instead of running wide, so rotate who inbounds so everyone does both jobs."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 11 · THU 18–19",
      title: "Snabbt Spel — The Restart Test",
      focus: "Small hall, so every game here is about the restart: who reacts first after a basket, a turnover, or a ball going out. Small-sided games rising in size and freedom, ending in the honest read. Game 3 (free 3v3) is not a gate on its own, but a first look at whether quick inbounds and playing forward transferred to free play — and the next rung-3 (Muren) data point if last Thursday's read wasn't clear.",
      sections: [
        {
          id: "t1", title: "Incheckning", duration: 2,
          body: "Say: \"Igår var vi snabba på stor plan. Idag är hallen liten — så idag handlar det om att vara snabbast efter att bollen gått i korgen.\""
        },
        {
          id: "t2", title: "Warm-Up — Het Potatis-Kull", duration: 10,
          body: "Same version as Week 10: taggers have no ball; only runners holding a ball can be tagged, so the ball has to move fast. Shrink the playing area to fit the hall — a small space actually makes it better here (more pressure, faster passes). Add 1–2 extra balls in the last 3 minutes.\n\nSay: \"Bollen är het! Släpp den snabbt!\""
        },
        {
          id: "t3", title: "Game 1 — 3-Sekunders-Inkast (2v2)", duration: 10,
          body: "Setup: one basket. Two (or three) 2v2 games if the hall has side baskets; otherwise 2v2 with waiting teams rotating in after each basket.\n\nRules:\n\n- Normal 2v2 half-court.\n- After a basket, the defending pair inbounds from the baseline — coach counts 3 out loud. Not in by 3 = ball to the other team.\n- The inbounder's partner must get open (\"spelbar\") — fake one way, go the other.\n\nSay: \"Ett — två — tre! Snabbt in!\"\n\nSay: \"Gör dig spelbar!\"\n\nEasier: count to 5. Harder: defenders may deny the inbound pass (full pressure on the receiver)."
        },
        {
          id: "t4", title: "Game 2 — Ta Ut & Attackera (3v2)", duration: 12,
          body: "Setup: one basket, half court. 3 attackers vs 2 defenders, rest wait at the sideline.\n\nRules:\n\n- 3v2 half-court.\n- When the defense wins the ball (steal or rebound), they must get the ball out beyond the 3-point line (or a cone line if the hall is tiny), and then they attack right away — the former attackers now defend. That's the small-hall version of a fast break.\n- Score within 4 seconds of taking it out = 2 points. Coach counts.\n- After each basket, rotate: one waiting girl in, one out (possession-based rotation, as in Week 8).\n\nThe two former defenders are now attacking 2 vs 3 — they'll lose often unless they are fast before the other three get organised. That's exactly the lesson.\n\nSay: \"Vi har bollen — ut och FRAMÅT!\"\n\nSay: \"Fort, innan de hinner tillbaka!\"\n\nTo the team that just lost it:\n\nSay: \"Tillbaka! Mur!\"\n\nPairing tip: stronger + weaker girl together on the 2-side so the weaker girl gets fast-break touches with support."
        },
        {
          id: "t5", title: "Game 3 — Free 3v3, The Read", duration: 12,
          body: "Free 3v3, no constraints, no bonus points. Only standing game rules (quick inbound after a basket is a basketball rule, not a coaching constraint).\n\nCoach watches, stays quiet. Read two things:\n\n- Speed: after a basket — does the nearest girl take the ball and inbound without being told? Do the others go wide and forward?\n- Muren (rung 3): do defenders stay between their player and the basket after a pass? Feet or arms?\n\nWrite down: broadly yes / mixed / mostly no, for each. If last Thursday's rung-3 read (Nov 5) wasn't clear, this counts as the next rung-3 data point. The quick-inbound read is not a gate — it's a first look at whether the week's idea transferred to free play."
        },
        {
          id: "t6", title: "Game 4 — Snabba Kungen (3v3 King of the Court)", duration: 10,
          body: "Setup: one basket. Teams of 3 (4 teams if 12 girls). Two teams play, the others wait at the baseline.\n\nRules:\n\n- Score = you stay on. The losing team leaves, the next team sprints in and inbounds immediately — the winning team must be ready to defend at once.\n- A team that scores 3 in a row leaves anyway (everyone plays).\n- Waiting teams: cheer and be ready — the next team in has no time to set up.\n\nCoach reinforces live here (it's not the gate): call out fast inbounds and girls who ran wide by name."
        },
        {
          id: "t7", title: "Cool-Down / Talk", duration: 4,
          body: "Circle.\n\nSay: \"Vem såg någon som var snabb med inkastet idag?\"\n\n(let the girls name a teammate — peer praise)\n\nSay: \"Bra jobbat hela veckan — ni blev snabbare!\""
        }
      ],
      tip: "Same rule as Wednesday — never hand the ball back after a basket, and keep counting out loud; the counting is the coaching. Small-hall safety: fast restarts near walls, so set the baseline inbound spot at least 1–2 m from the wall, and keep the waiting girls well off the court line."
    }
    },
    sv: {
    wed: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 11 · ONS 17–18",
      title: "Snabbt Spel — Snabba Inkast, Spela Framåt",
      focus: "En idé, två halvor: Snabbt inkast — efter en korg eller utanför plan tar den närmaste tjejen bollen, kliver ut, och passar in direkt, ingen väntar på tränaren eller \"sätter upp\" spelet. Spela framåt — första blicken efter fångsten är uppåt plan; en passning framåt slår en dribbling framåt, och lagkompisar utan boll sprintar brett och framåt för att vara \"spelbara\". Använder klubbens egna ledord: \"Framåt\" (anfalla snabbt), \"Tillbaka\" (försvaret sprintar tillbaka), \"Spelbar\" (göra sig fri). Muren förblir försvarsvanan — snabbkontring-försvarslekarna håller den vid liv utan att undervisa den igen. Fart före precision (stående regel): stoppa inte repetitioner för slarviga passningar, berömma det snabba beslutet, inte den perfekta passningen. Stor hall den här veckan — använd hela längden för löpvågor och helplanslekar; torsdagens lilla hall flyttar farten till omstarten istället.",
      sections: [
        {
          id: "s1", title: "Incheckning", duration: 2,
          body: "Samling. En fråga.\n\nSäg: \"Vad betyder 'Framåt' när vi spelar?\"\n\nTa 2–3 svar, sedan:\n\nSäg: \"Idag tränar vi på att vara snabbast i hela hallen — snabbast med bollen, inte bara snabbast att springa.\""
        },
        {
          id: "s2", title: "Uppvärmning — Snabbstart-sprint med boll", duration: 10,
          body: "Källa: SBBF fysträning — tävlingssprint med varierade startpositioner, med en boll tillagd.\nUppställning: alla på baslinjen, en boll var. Hela planens längd.\n\nSå här:\n\n- Omgång 1–3 (ingen boll, 3 min): startpositioner varierar — sittande, liggande på mage, liggande på rygg, vänd baklänges. Tränaren klappar → sprinta till mittplan, jogga tillbaka. 10–20 s vila mellan.\n- Omgång 4–7 (boll, 4 min): samma startpositioner, boll på golvet bredvid dem. Klapp → ta bollen, snabbdribbla till den bortre frikastlinjen, stopp, titta upp (tränaren håller upp fingrar, tjejerna ropar numret), dribbla tillbaka med svaga handen.\n- Omgång 8–9 (kapplöpning, 3 min): par, en boll mellan två. Klapp → den som är först vid bollen dribblar, den andra jagar (tagga ryggen = poäng). Byt roller.\n\n\"Titta upp och ropa numret\"-delen är poängen — fart med ögonen uppe, inte på bollen.\n\nSäg: \"När jag klappar — upp och iväg! Snabbast vinner.\"\n\nSäg: \"Titta upp! Hur många fingrar?\"\n\nSäg: \"Tillbaka med svaga handen!\""
        },
        {
          id: "s3", title: "Övning 1 — Inkast-racet", duration: 12,
          body: "Fokus: snabbt inkast + första passningen framåt. Det här är veckans nya koncept — full undervisningssekvens.\nUppställning: helplan. Grupper om 3 uppställda bakom baslinjen i en ände (4 grupper om 12 tjejer). En boll per grupp, hålls av tränaren vid korgen.\n\nSå det fungerar: tränaren tappar bollen genom korgen (= \"det andra laget gjorde just mål\"). De 3 tjejerna reagerar: den närmaste tar bollen, kliver ut bakom baslinjen. De andra två sprintar brett — en till varje sidlinje, minst till frikastlinjens förlängning. Inkast till en wing → den wingen passar framåt till den andra tjejen som springer den bortre sidlinjen (eller dribblar om inget är öppet) → avslutar med layup i den bortre änden. Tränaren räknar högt från tappet. Mål före \"8\" = 1 poäng för gruppen. Gå tillbaka längs sidlinjen; nästa grupp går.\n\nUndervisningssekvens: säg det —\n\nSäg: \"När bollen går i korgen — den som är närmast tar bollen och går ut. De andra springer brett, mot sidlinjerna. Första blicken är framåt.\"\n\nVisa det: gå igenom en grupp långsamt, peka ut de tre platserna (inkastare, två breda löpare). Gå igenom det: varje grupp gör en rep i halvfart, ingen räkning. Prata om det:\n\nSäg: \"Säg till din kompis: vem tar bollen, och vart springer de andra?\"\n\n(20 sekunder i gruppen)\n\nSpela det: full fart med 8-räkningen. Lär ut det (om tid finns): en tjej från en snabb grupp visar en annan grupp var hon sprang.\n\nSäg: \"Kan du visa var du sprang?\"\n\n40-sekundersregeln efter den tredje omgången i full fart:\n\nSäg: \"Nu stänger vi ögonen i 40 sekunder och tänker på vad vi just gjorde.\"\n\nSäg: \"Ta bollen — ut — in! Snabbt!\"\n\nSäg: \"Brett! Spring till sidlinjen!\"\n\nSäg: \"Framåt! Vem är längst fram?\"\n\nLättare: ingen räkning — bara fullborda inkastet + en passning framåt + valfritt avslut. Svårare: räkningen sänks till 6, eller lägg till en försvarare vid mittplan som måste slås med en passning, inte en dribbling.\n\nParningstips: varje grupp om 3 = 1–2 starkare + 1 svagare. Rotera vem som kastar in varje rep så den svagare tjejen inte gömmer sig på kanten."
        },
        {
          id: "s4", title: "Övning 2 — Jagaren (2mot1 + Jagare)", duration: 12,
          body: "Fokus: spela bollen framåt snabbt, eftersom någon är på väg. Försvarssida: \"Tillbaka\" + Muren i omställning.\nUppställning: helplan. Två köer vid baslinjen (anfallare), en försvarare vid mittplan, en \"jagare\" stående bakom baslinjen bredvid anfallarna.\n\nSå det fungerar: tränaren passar till en anfallare (eller tappar bollen genom korgen → snabbt inkast, som i Övning 1). De två anfallarna spelar 2mot1 mot mittplansförsvararen mot den bortre korgen. Jagaren startar 2 sekunder senare (tränaren ropar \"Jagare!\") och sprintar för att hjälpa försvaret → om anfallarna är långsamma blir det 2mot2. Rotation: anfallare → blir nästa mittplansförsvarare och jagare; försvarare + jagare → bak i anfallsköerna.\n\nJagaren är hela poängen: tjejerna känner att långsamt = 2mot2, snabbt = 2mot1. Ingen behöver förklara det.\n\nUndervisningssekvens: bara regler (det här är en lek, inte ny teknik) — snabb demo av vem som startar var och när jagaren går. Spela sedan. Pausa en gång runt 5-minutersmärket och fråga, låt dem sedan svara:\n\nSäg: \"När var det lättast att göra mål? Varför?\"\n\n(låt dem komma fram till \"när vi passade framåt snabbt\")\n\nSäg: \"Jagaren kommer! Ni har två sekunder!\"\n\nSäg: \"Passa framåt — bollen är snabbare än du!\"\n\nTill försvararen:\n\nSäg: \"Mur! Stå mellan bollen och korgen.\"\n\nTill jagaren:\n\nSäg: \"Tillbaka! Spring hela vägen!\"\n\nLättare: jagaren startar 3 sekunder senare. Svårare: jagaren startar direkt, eller 3mot2 med en jagare (om gruppen är stark idag).\n\nParningstips: starkare + svagare tillsammans som anfallare. Sätt en stark tjej som jagare mot svagare anfallare — det gör fartlektionen tydlig utan att göra det till en 1mot1-tävling."
        },
        {
          id: "s5", title: "Match — 8-Sekunders-Matchen", duration: 20,
          body: "Format: helplan 4mot4 (eller 3mot3 + avbytare om 10 tjejer), trupper roterar var 3–4:e minut.\n\nRegler:\n\n- Snabbt inkast är obligatoriskt: efter varje korg kastar det andra laget in direkt bakom baslinjen. Ingen tränare som lämnar över bollen, inget väntande.\n- 8-sekundersbonus: tränaren räknar från inkastet. Mål före 8 = 2 poäng. Vanlig korg = 1 poäng.\n- Tillbaka-regeln: när ni förlorar bollen sprintar hela laget tillbaka förbi mittplan innan någon annan försvarar.\n\nVar tyst under spelet — bara räkna högt och ropa ut bra inkast vid namn.\n\nSäg: \"Bra inkast, Ella!\"\n\nPausa på klockan (ungefär var 4:e minut), 20 sekunder:\n\nSäg: \"Vad gjorde laget som fick 2 poäng?\"\n\nFungerar solo: ja — räkningen är det enda jobbet. Med en assistent: assistenten sköter rotationen och bänken."
        },
        {
          id: "s6", title: "Nedvarvning / Prat", duration: 4,
          body: "Stretch i en cirkel. En slutsats:\n\nSäg: \"Vad är det första du gör när bollen går i korgen?\"\n\n(sikta på \"ta bollen, ut, in\" eller \"spring brett\")\n\nSäg: \"Superbra träning idag! Ni var snabba! Vi ses imorgon!\""
        }
      ],
      tip: "Lämna inte över bollen efter korgar — i någon lek den här veckan. Varje gång tränaren plockar upp bollen och ger den tillbaka lär sig tjejerna att vänta; låt den studsa, den närmaste tjejen tar den. Räkna högt, alltid — räkningen är coachningen, den skapar brådska utan att du styr något. Håll koll på den svagare undergruppen på kanterna — de tenderar att stå på inkastplatsen och vänta på bollen istället för att springa brett, så rotera vem som kastar in så alla gör båda jobben."
    },
    thu: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 11 · TORS 18–19",
      title: "Snabbt Spel — Omstartstestet",
      focus: "Liten hall, så varje lek här handlar om omstarten: vem reagerar först efter en korg, en bollförlust, eller en boll som går ut. Småspel som växer i storlek och frihet, och slutar i den ärliga läsningen. Lek 3 (fritt 3mot3) är inte en grind i sig, utan en första titt på om snabba inkast och att spela framåt har förts över till fritt spel — och nästa steg-3-datapunkt (Muren) om förra torsdagens läsning inte var tydlig.",
      sections: [
        {
          id: "t1", title: "Incheckning", duration: 2,
          body: "Säg: \"Igår var vi snabba på stor plan. Idag är hallen liten — så idag handlar det om att vara snabbast efter att bollen gått i korgen.\""
        },
        {
          id: "t2", title: "Uppvärmning — Het Potatis-Kull", duration: 10,
          body: "Samma version som vecka 10: kullarna har ingen boll; bara löpare som håller i en boll kan bli kullade, så bollen måste röra sig snabbt. Krymp spelytan för att passa hallen — en liten yta gör det faktiskt bättre här (mer press, snabbare passningar). Lägg till 1–2 extra bollar de sista 3 minuterna.\n\nSäg: \"Bollen är het! Släpp den snabbt!\""
        },
        {
          id: "t3", title: "Lek 1 — 3-Sekunders-Inkast (2mot2)", duration: 10,
          body: "Uppställning: en korg. Två (eller tre) 2mot2-lekar om hallen har sidokorgar; annars 2mot2 med väntande lag som roterar in efter varje korg.\n\nRegler:\n\n- Vanlig 2mot2 halvplan.\n- Efter en korg kastar det försvarande paret in från baslinjen — tränaren räknar till 3 högt. Inte inne på 3 = bollen till det andra laget.\n- Inkastarens partner måste göra sig fri (\"spelbar\") — fejka åt ett håll, gå åt det andra.\n\nSäg: \"Ett — två — tre! Snabbt in!\"\n\nSäg: \"Gör dig spelbar!\"\n\nLättare: räkna till 5. Svårare: försvararna får neka inkastpassningen (full press på mottagaren)."
        },

          body: "Uppställning: en korg, halvplan. 3 anfallare mot 2 försvarare, resten väntar vid sidlinjen.\n\nRegler:\n\n- 3mot2 halvplan.\n- När försvaret vinner bollen (bollvinst eller retur) måste de ta ut bollen bortom trepoängslinjen (eller en konlinje om hallen är väldigt liten), och sedan anfaller de direkt — de forna anfallarna försvarar nu. Det är den lilla hallens version av en snabbkontring.\n- Mål inom 4 sekunder efter uttag = 2 poäng. Tränaren räknar.\n- Efter varje korg, rotera: en väntande tjej in, en ut (rotation baserad på boll-innehav, som i vecka 8).\n\nDe två forna försvararna anfaller nu 2 mot 3 — de kommer förlora ofta om de inte är snabba innan de andra tre hinner organisera sig. Det är exakt lektionen.\n\nSäg: \"Vi har bollen — ut och FRAMÅT!\"\n\nSäg: \"Fort, innan de hinner tillbaka!\"\n\nTill laget som just förlorade bollen:\n\nSäg: \"Tillbaka! Mur!\"\n\nParningstips: starkare + svagare tjej tillsammans på 2-sidan så den svagare tjejen får snabbkontrings-touches med stöd."
        },
        {
          id: "t5", title: "Lek 3 — Fritt 3mot3, Läsningen", duration: 12,
          body: "Fritt 3mot3, inga begränsningar, inga bonuspoäng. Bara stående spelregler (snabbt inkast efter en korg är en basketregel, inte en coachningsbegränsning).\n\nTränaren tittar, håller sig tyst. Läs två saker:\n\n- Fart: efter en korg — tar den närmaste tjejen bollen och kastar in utan att bli tillsagd? Går de andra brett och framåt?\n- Muren (steg 3): stannar försvararna mellan sin spelare och korgen efter en passning? Fötter eller armar?\n\nSkriv ner: brett ja / blandat / mestadels nej, för varje. Om förra torsdagens steg-3-läsning (5 nov) inte var tydlig räknas den här som nästa steg-3-datapunkt. Snabbt-inkast-läsningen är inte en grind — det är en första titt på om veckans idé fördes över till fritt spel."
        },
        {
          id: "t6", title: "Lek 4 — Snabba Kungen (3mot3 Kung På Planen)", duration: 10,
          body: "Uppställning: en korg. Lag om 3 (4 lag om 12 tjejer). Två lag spelar, de andra väntar vid baslinjen.\n\nRegler:\n\n- Mål = ni stannar kvar. Det förlorande laget går av, nästa lag sprintar in och kastar in direkt — det vinnande laget måste vara redo att försvara genast.\n- Ett lag som gör mål 3 i rad går av ändå (alla spelar).\n- Väntande lag: heja och var redo — nästa lag in har ingen tid att sätta upp.\n\nTränaren förstärker levande här (det är inte grinden): ropa ut snabba inkast och tjejer som sprang brett vid namn."
        },
        {
          id: "t7", title: "Nedvarvning / Prat", duration: 4,
          body: "Cirkel.\n\nSäg: \"Vem såg någon som var snabb med inkastet idag?\"\n\n(låt tjejerna namnge en lagkompis — kamratberöm)\n\nSäg: \"Bra jobbat hela veckan — ni blev snabbare!\""
        }
      ],
      tip: "Samma regel som onsdagen — lämna aldrig över bollen efter en korg, och fortsätt räkna högt; räkningen är coachningen. Säkerhet i den lilla hallen: snabba omstarter nära väggar, så sätt baslinje-inkastplatsen minst 1–2 m från väggen, och håll de väntande tjejerna väl utanför planlinjen."
    }
    }
  };

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
