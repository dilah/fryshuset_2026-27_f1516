<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {
    en: {
    wed: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 6 · WED 17–18",
      title: "Give & Go — Rung 2, Deepened",
      focus: "Deepens rung 2 (move-after-pass / spacing) using Give & Go as this week's one integrated concept — building directly on what the team already started last week under Victor rather than introducing something brand new. A give-and-go is literally the rung-2 habit (pass, then relocate to open space) wrapped in a game players already responded well to, so this is repetition with a sharper edge, not a reset. Short individual-skill slices continue two under-served tracks (weak-hand dribble, BEEF shooting form). Closes with a first, low-key mention of the confirmed Oct 17 match and the idea of a rotation plan — logistics, not a drill.",
      sections: [
        {
          id: "s1", title: "Opening Circle", duration: 5,
          body: "Focus: arrival, connection, framing.\nSetup: whole group circle at center court.\n\nHow: greet every player by name. Acknowledge last week's session with Victor's group by name — ask 1–2 players what they remember from the give-and-go work, so tonight's teach visibly builds on it rather than replacing it. State tonight's plan simply.\n\nSay: \"Ni jobbade med 'give and go' förra veckan med Victor — ikväll bygger vi vidare på det!\""
        },
        {
          id: "s2", title: "Warm-Up — Conditioning + Weak-Hand Dribble", duration: 9,
          body: "Focus: raise heart rate; continue the left-hand dribble emphasis from last week, since it's an individual skill track that's responded well and shouldn't lose momentum.\nSetup: full court. Three spots on the baseline — Cola is the left corner, Fanta is the middle of the baseline, Sprite is the right corner. Everyone starts spread out at half court. No balls for the first half, then one ball per player.\n\nHow: Part 1, no ball (4 min): the coach calls a drink, and everyone sprints to that spot on the baseline, touches the line, and jogs back to half court. The players who arrive first hold ready position (knees bent, hands up) until the last one is in. Call the drinks fast and out of order, sometimes the same one twice in a row, so they have to listen and can't just follow the group. Change the movement now and then: sprint, defensive slide, backpedal.\n\nPart 2, with ball (5 min): same game, but everyone dribbles to the called spot with the weak hand only, does a jump stop on the line, and dribbles back with the weak hand. Whoever arrives last does 5 stationary weak-hand dribbles before the next call. It continues last week's left-hand work, and the sprinting rounds provide the conditioning.\n\nSay: \"Cola! ... Fanta! ... Sprite! Svag hand hela vägen!\"\n\nEasier: allow two hands in the dribbling round for players who are still shaky, or shorten the distance to the free-throw line. Harder: eyes up, not on the ball (hold up fingers to check), or call two drinks in a row (\"Cola, Sprite!\") and they run to one and then the other."
        },
        {
          id: "s3", title: "Skill Drill — BEEF Shooting Form", duration: 6,
          body: "Focus: shooting mechanics — form only, no scoring pressure. This individual skill track hasn't had a dedicated slot in a couple of weeks and needs to stay recurring, not one-off.\nSetup: pairs, close to the basket (1–2m). One ball per pair.\n\nHow: shoot from very close range, focus entirely on form — Balance, Eyes on target, Elbow under the ball, Follow-through. Stronger shooter demonstrates first, weaker copies.\n\nSay: \"Knän, armbåge under bollen, följ med handen mot korgen!\"\n\nEasier: shoot from 1m; foam ball if available. Harder: step back after each make; try weak hand."
        },
        {
          id: "s4", title: "Teach Block — Give & Go as the Rung-2 Vehicle", duration: 13,
          body: "Focus: one integrated concept — pass, then cut hard to open space, and be ready to receive it back. This is spacing and move-after-pass taught through a game players already have a foothold in, not through isolated blocks.\nSetup: half court. Start in pairs/trios at the top of the key (Pass & Follow shape), then move into live 2v2 at several baskets so everyone plays at once.\n\nHow: Stage 1 (4 min) — Pass & Follow: player passes to the opposite line, then follows the pass and cuts toward the basket calling for it back, finishing with a layup.\n\nStage 2 (5 min) — live 2v2 that looks like a real game. Each possession starts like it would in play: a wing catches the ball (triple threat), a teammate is a step away, and both defenders play normal man-to-man on their own player, dribble allowed, score it. There is no set pattern and no instruction about what to do. The only rule is a bonus: a basket that comes off a give-and-go (pass, cut, return pass) counts double. The defender's reaction is what creates the read — if the passer's defender sags off, the cutter is free; if the defender chases, the passer keeps going or gets it back. Players figure out when the cut works from the defense, not from you. Rotate the pairs every 2 possessions or so, and offense and defense swap after each score or stop.\n\nStage 3 (4 min) — 3v2 give-and-go, the same idea with a numbers advantage, still a shell.\n\nThroughout, name it out loud every time it happens correctly.\n\nSay: \"DET där är give-and-go!\"\n\nSay: \"Passa och spring! Kom tillbaka öppen — det är give-and-go!\"\n\nEasier: in Stage 2, start with the defenders at 50% (contest but don't fully close out) so the cut is easier to find, or stay on Stage 1 with no defender for pairs who aren't ready. Harder: add a third offensive player as a spacing outlet (3v3 live), or make the give-and-go bonus a must (offense can only score off it in the first possession of each rotation)."
        },
        {
          id: "s5", title: "Close — 3v2 Give-and-Go Shell", duration: 12,
          body: "Focus: numbers-advantage shell, not open scrimmage — consistent with how every Wednesday closes. Offense has a 3v2 advantage and is rewarded specifically for finding the give-and-go read rather than just the numbers advantage itself.\nSetup: half court, 3 offense vs. 2 defense, rotating groups through every few possessions.\n\nHow: live 3v2. Call out and celebrate any basket that comes directly off a give-and-go pattern — that's the specific behavior being reinforced tonight, on top of the general numbers-advantage decision-making.\n\nSay: \"Hitta given-and-go-passningen — det är det vi vill se ikväll!\"\n\nEasier: defense plays passive (contest but don't fully deny) for early reps. Harder: add a pass-count requirement (must complete at least 2 passes before scoring)."
        },
        {
          id: "s6", title: "Logistics Huddle — Oct 17 Match", duration: 5,
          body: "Focus: coaching logistics, not a drill. First mention to the team that there's a real, confirmed game on Oct 17, and that the group will start working out who plays when so everyone gets fair time.\nSetup: whole group, seated or standing circle.\n\nHow: announce the date plainly and keep it low-key — this is early, no need to build pressure. Explain in one sentence that everyone will get to play, and that in the coming weeks the team will practice moving in and out as a group so it feels normal on match day, not confusing.\n\nSay: \"Den 17 oktober har vi match! Alla kommer få spela — vi övar på byten de närmaste veckorna så det känns naturligt.\""
        },
        {
          id: "s7", title: "Closing Circle", duration: 5,
          body: "Focus: wind down, reinforce one thing, confirm everyone's clear on Wednesday's takeaway.\nSetup: whole group circle.\n\nHow: ask one player to explain give-and-go back in their own words. Correct gently if needed. Remind the team Thursday will be more free play building on tonight.\n\nSay: \"Bra jobbat! På torsdag kör vi det här på riktigt i spel.\""
        }
      ],
      tip: "This is a \"deepen, don't reset\" session — the team already has a real foothold in give-and-go from last week's assistant-led work, so lean into that rather than re-teaching from zero. The logistics huddle at the end should stay genuinely low-pressure; Oct 17 is still 2.5 weeks out, and the goal tonight is just familiarity with the idea of a rotation, not the plan itself."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 6 · THU 17:30–19",
      title: "Play & Apply — The Rung-2 Read",
      focus: "Small-sided games rising in size and freedom, ending in the real test: a clean, unconstrained 3v3 read on rung 2 (move-after-pass / spacing). Wednesday went well: the team is starting to get the give-and-go and there was clearly less klumping around the ball. Tonight is where that either shows up on its own or it doesn't, so Games 1 and 2 are for play and fun and Game 3 stays untouched as the actual gate. The session also keeps two threads going: a short boxing-out/rebounding touch (well received under Victor) and the match-readiness bridge, aimed at the confirmed Oct 17 match.",
      sections: [
        {
          id: "t1", title: "Opening Circle", duration: 5,
          body: "Greet every player by name. Start with the win: tell the team what you saw on Wednesday, that they spread out much better and the give-and-go is starting to click, and name one or two players by name. Then tell them tonight is where they just play with it, no more drilling the pattern.\n\nSay: \"Igår såg jag riktigt bra spacing och give-and-go! Ikväll får ni spela — testa det om ni ser läget, men mest, ha kul.\""
        },
        {
          id: "t2", title: "Warm-Up — Sprint & Conditioning Set", duration: 9,
          body: "Focus: raise heart rate, continue the conditioning ramp.\nSetup: full court, no balls.\n\nHow: 6 min of baseline-to-baseline sprint intervals, defensive slides and change-of-direction work. Finish with 3 min of Cola Fanta Sprite without a ball (Cola is the left baseline, Fanta the middle, Sprite the right), called fast and out of order. They know it from Wednesday, so it's quick to start and fun.\n\nSay: \"Full fart till linjen! Cola! ... Fanta! ... Sprite!\""
        },
        {
          id: "t3", title: "Game 1 — Give & Go Reinforcement, Small-Sided", duration: 9,
          body: "Focus: direct carryover from Wednesday's teach — same concept, now in freer small-sided play rather than a shell.\nSetup: half court, 2v2 or 3v3 depending on numbers, multiple groups running in parallel to maximize touches.\n\nHow: live small-sided play, dribble allowed, no defense-denial constraint. Award a visible bonus (point, cheer, tally) for any basket that clearly comes off a give-and-go pattern — same reinforcement as Wednesday's close, now with more freedom around it. Build the groups with stronger and weaker players mixed, so the weaker ones get paired with someone who already spaces and cuts well. Coach actively here, quick calls only: \"Kom tillbaka öppen!\", \"Rör dig efter passen!\". Wednesday showed they are close, so a nudge is enough.\n\nSay: \"Hitta given-and-go igen om ni kan — men spela fritt!\"\n\nEasier: let the defenders play at 50% for a couple of possessions if a group is stuck. Harder: require the give-and-go bonus basket to happen at least once per rotation before the group switches, or add a second bonus: a basket where no one clumped near the ball (everyone spread out when the shot went up)."
        },
        {
          id: "t4", title: "Game 2 — Boxing-Out / Rebounding", duration: 8,
          body: "Focus: short continuation of the rebounding/boxing-out work from last week, which landed well under Victor — not part of the core ladder, but worth keeping warm as a recurring team-skill thread.\nSetup: pairs at the basket, one shooter/rebounder pairing per basket if numbers allow, or a \"war rebounding\" format (2 players, 1 ball tossed off the rim, both box out and pursue).\n\nHow: coach or a player takes a shot; both players must find and hold a box-out position on the nearest opponent before pursuing the ball. Rotate shooter role.\n\nSay: \"Box out först — sen bollen!\"\n\nEasier: coach tosses the ball off the rim directly rather than a live shot, so the rebound contest is more predictable. Harder: live 2v2 shot + rebound, both ends live."
        },
        {
          id: "t5", title: "Game 3 — 3v3 Half Court, Free Play — Real Test", duration: 11,
          body: "Focus: the rung-2 gate, and the first clean read in several weeks. No constraints, dribble allowed. The honest, unprompted check on whether spacing/move-after-pass — including give-and-go specifically — shows up on its own, now that Wednesday has given them the tools.\nSetup: half court, 3v3, groups rotating every 2–3 minutes. Keep the same mixed groups as Game 1 or reshuffle, but don't pair strong with strong only, since you want to see the weaker players too.\n\nHow: free play, standard rules, no coaching during live play — observe only. This is the sole signal for judging rung 2. Watch for three things: (1) unprompted relocation after passing, across most of the roster and not just the top few; (2) any spontaneous give-and-go; (3) whether it holds when the pace goes up, since spacing that survives speed is the strongest evidence. Also note whether the klumping around the ball stays low without you or the klump rule enforcing it. Keep a quick tally per group (relocates after passing: most / some / few; give-and-go seen: yes / no), written down right after the game.\n\nSay: \"Ha kul, testa saker — och peppa varandra!\" — then stay quiet and watch.\n\nEasier: none — deliberately unconstrained; don't adjust either direction, since that would compromise the read. Harder: none — same reasoning."
        },
        {
          id: "t6", title: "Game 4 — Full-Court 4v4, Match-Readiness Bridge", duration: 12,
          body: "Focus: continues the match-readiness bridge, now aimed concretely at the confirmed Oct 17 match (roughly 2.5 weeks out) rather than a general \"someday\" game. Not gated — coach live here.\nSetup: full court, two 4-player teams live, extras rotating in on a timer. Start actually assigning temporary \"squads\" for the rotation, so the team gets a first feel for moving in and out as a group rather than individually drifting on and off.\n\nHow: standard 4v4, dribble allowed, normal defense both ends, running score. Coach actively: call out spacing, celebrate a give-and-go under real pressure, name good box-out positioning carried over from Game 2. This also doubles as an informal, secondary look at rung-2 habits under full complexity — a breakdown here is expected and not read as the habit failing; Game 3 remains the actual gate.\n\nSay: \"Vem är fri? Peppa varandra — vi bygger mot 17 oktober!\""
        },
        {
          id: "t7", title: "Closing Circle", duration: 5,
          body: "Focus: wind down, land the Oct 17 date a second time, reinforce one specific thing from tonight.\nSetup: whole group circle, water break first.\n\nHow: ask 1–2 players what they noticed went well. Name one specific give-and-go or box-out moment tied to a player by name. Remind the group that Oct 17 is coming and rotations will keep getting practiced between now and then.\n\nSay: \"Bra jobbat! Kom ihåg — vi bygger mot matchen den 17:e. Vi ses nästa vecka!\""
        }
      ],
      tip: "Game 3 is doing real diagnostic work tonight — resist the urge to fold what you saw in Games 1–2 (where you were coaching) into how you judge it. Wednesday's progress is encouraging, but only Game 3 counts as the read. If the majority holds spacing and move-after-pass at pace, with the weaker players showing it at least sometimes, that's a strong result, and you can decide whether to open rung 3 next week or confirm with one more Thursday. If it looks shaky, repeat and deepen rung 2 once more rather than moving on — same rule as always, just with an actual test behind the decision this time."
    }
    },
    sv: {
    wed: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 6 · ONS 17–18",
      title: "Give & Go — Fördjupning av steg 2",
      focus: "Fördjupar steg 2 (förflyttning efter passning / spacing) genom att använda Give & Go som veckans enda integrerade koncept — bygger direkt vidare på det laget redan påbörjade förra veckan med Victor istället för att introducera något helt nytt. Ett give-and-go är bokstavligen steg-2-vanan (passa, förflytta dig sedan till öppen yta) inbakad i en lek spelarna redan svarat bra på, så det här är repetition med skärpa, inte en omstart. Korta individuella färdighetspass fortsätter två eftersatta spår (svag-hands-dribbling, BEEF-skytteform). Avslutas med ett första, lågmält omnämnande av den bekräftade matchen den 17 oktober och tanken på en bytesplan — logistik, inte en övning.",

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
</body>
</html>
