<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {
    en: {
    wed: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 9 · WED 17–18",
      title: "Muren — The Wall",
      focus: "Rung 3: defensive body position — \"the wall\": low and wide, goal-side, feet not arms — plus balance and fast, quick decisions. Defence was lacking in the Oct 17 matches. Help defence is too advanced for now, so this week is personal defence only. Skill tracks: stance and balance (main), weak-hand dribble inside the lanes, passing inside Klump.",
      sections: [
        {
          id: "s1", title: "Incheckning + Match Talk", duration: 3,
          body: "Pair talk about the matches, then take 2–3 answers. Don't fix anything yet.\n\nSay: \"Vad var svårast i försvaret i matchen?\""
        },
        {
          id: "s2", title: "Warm-Up — Balance", duration: 10,
          body: "- Enbenshopp & Go (4 min): stand on one leg with the ball. Coach calls \"fram / bak / sida\" — they hop and land on one leg, hold, then sprint on \"Gå\".\n- Spegeln (3 min): partner mirror. The leader moves, the follower slides sideways in stance. Swap leader every 30 s.\n- One-Leg Ball Battle (3 min): pairs, one ball, feet planted, one player on one leg. 10–15 s rounds, swap legs.\n\nSay: \"Knä över tå, stå still som en staty!\"\n\nSay: \"Kontroll, inte kraft.\""
        },
        {
          id: "s3", title: "Muren — 1v1 Lane Game", duration: 15,
          body: "Own design, adapted from 1v1 Shell Defense and Defensive Slide Relay.\nSetup: cone lanes about 4 m wide and 10 m long, from the midline toward each baseline (three lanes per half, up to 12 players). One pair per lane. Attacker starts with the ball; defender about one arm's length in front. The end of the lane is the goal line.\n\nRules:\n\n- Attacker dribbles and tries to cross the goal line with the ball under control, staying inside the cones.\n- Defender stops her. Winning the ball is also a win.\n- Foul = attacker scores: wrapping arms around the attacker or grabbing gives her the goal.\n- Rounds of 20–30 s, then swap roles.\n\nSay + show the game (1 min): one stronger pair demos while the others watch.\nSay: \"Anfallaren ska över linjen. Försvararen ska stoppa henne. Inga knuffar, inga kramar.\"\n\nShow stance and slide (1 min): low and wide, knees bent, chest up, one arm's length away, hands up and out — never around her. Slide sideways, feet never cross.\nSay: \"Böj på knäna, händerna uppe! Korsa inte fötterna!\"\n\nEveryone tries it (30 s): a few slides left and right on the spot.\n\nWalk it (30 s): one round with the attacker walking, to check the rules.\n\nRound 1, play (~3 min): full speed. Stance coaching only, no positioning coaching.\n\nPause + talk (~2 min): pair talk, then take answers.\nSay: \"Var stod de som stoppade henne?\"\nSay: \"Vad hände när någon kramade?\"\nName it: mur — in front of her, between her and the line.\n\nHands-behind-back round (30 s): defenders can only use their feet. Quick and fun, and it breaks the arm habit.\n\nRound 2, play (~3 min): swap roles, same rules.\n\n40-second silent replay:\nSay: \"Nu stänger vi ögonen i 40 sekunder och tänker på vad vi just gjorde.\"\n\nEasier: attacker walks. Harder: attacker uses her weak hand only, or a narrower lane.\n\nSolo or with assistant: works solo. With an assistant, split into two groups by lane."
        },
        {
          id: "s4", title: "Mållinjen — 3v3", duration: 12,
          body: "Setup: 3v3 half court. Offence scores by dribbling or passing the ball over the baseline. No basket, no shooting.\n\n- A defender who runs to the other side to block the pass leaves the goal side open and gets scored on. This punishes exactly the chase habit.\n- On a turnover the new offence goes immediately.\n\nSay: \"Bollen förlorad? Mur direkt!\"\n\nSay: \"Stå mellan, inte bredvid.\"\n\nIf the chase keeps happening, pause and ask:\nSay: \"Var var linjen när du sprang dit?\""
        },
        {
          id: "s5", title: "Klump 3v3 — Defence Point", duration: 16,
          body: "Klump as usual — keep the 2 s pass clock. A defensive stop is worth 1 point.\n\nStay quiet during play. Pause for reflection every 3–4 minutes."
        },
        {
          id: "s6", title: "Samling", duration: 4,
          body: "One takeaway.\n\nName one defensive play, by player.\n\nClose with hands in the middle: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "This plan assumes rung 2 was confirmed on Oct 8 — if it wasn't, swap the Klump block for a rung-2 version. Keep it to personal defence this week: help defence is too advanced for now, so don't coach rotations or helping, only the wall."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 9 · THU 18–19",
      title: "Muren — The Test",
      focus: "Play/Apply for Wednesday's wall: low and wide, goal-side, feet not arms. A short lane refresher, then Game 3 — free 3v3 with no constraints and no prompting — is the clean rung-3 test. Game 4, the continuous 3v3v3 shuttle, is live reinforcement where cues and praise are fine.",
      sections: [
        {
          id: "t1", title: "Incheckning — Retrieval", duration: 3,
          body: "Pairs show each other, then one or two show the group.\n\nSay: \"Visa din kompis vad en mur är.\""
        },
        {
          id: "t2", title: "Warm-Up", duration: 9,
          body: "- Spegeln (3 min): partner mirror, follower slides in stance.\n- Enbenshopp & Go (3 min).\n- Sten-sax-påse-kull (3 min): quick decisions, high energy. No ball.\n\nSten-sax-påse-kull\nSetup: pairs on either side of the midline.\nHow: pairs play \"sten, sax, påse\". The loser turns and sprints toward the baseline. The winner chases and tries to tag her before she gets there. Both jog back, find a new partner and go again.\nVariations (change about every minute): start sitting with straight legs, lying on the stomach, lying on the back, in a push-up position, jumping on both feet, hopping on one leg, or the loser runs backwards.\nKeep instructions to a minimum.\n\nSay: \"Spring för fullt!\""
        },
        {
          id: "t3", title: "Muren Lanes — Refresher", duration: 6,
          body: "Same lane game as Wednesday, harder version: weak-hand attackers, same foul rule (foul = attacker scores). No new teaching.\n\nSay: \"Fötterna stoppar henne, inte armarna.\""
        },
        {
          id: "t4", title: "Game 3 — Free 3v3, The Test", duration: 13,
          body: "Half court, 3v3. No constraints, no prompting. Stay quiet and observe.\n\nPick two names per game to follow, and write yes or no for the first two checks.\n\nChecklist:\n\n- 1. Does the defender get between her player and the basket on her own?\n- 2. Feet or arms? Does she slide, or reach, wrap or grab?\n- 3. Does she give up the goal side to chase the pass?\n- 4. After a turnover, does she turn and sprint back straight away?\n- 5. Do spacing and the extra pass still hold?"
        },
        {
          id: "t5", title: "Water", duration: 2,
          body: "Water break."
        },
        {
          id: "t6", title: "Game 4 — Continuous 3v3v3 Shuttle", duration: 22,
          body: "Includes pauses.\nSetup: one triplet at midline, two at the baselines, continuous up and down.\n\nKlump rules (2 s clock). A defensive stop = 1 point. Pause for reflection every 3–4 minutes.\n\nThis is the live-reinforcement game: cues and name-based praise are fine here.\n\nSay: \"Du är en mur!\"\n\nSay: \"Låg och bred, händerna uppe.\"\n\nTreat a breakdown here as a new-format effect, not the rung-3 test result. Game 3 is the only clean signal."
        },
        {
          id: "t7", title: "Samling", duration: 5,
          body: "One takeaway.\n\nHighlight one defensive play by name — with energy or communication — even if the ball went in.\n\nClose with hands in the middle: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "You can't watch five things at once. In Game 3, follow two names, count arms vs. feet, and note the result — Week 10 gets set from it."
    }
    },
    sv: {
    wed: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 9 · ONS 17–18",
      title: "Muren",
      focus: "Steg 3: defensiv kroppsposition — \"muren\": låg och bred, på målsidan, fötterna inte armarna — plus balans och snabba beslut. Försvaret brast i matcherna 17 okt. Hjälpförsvar är för avancerat än så länge, så den här veckan är det bara personligt försvar. Färdighetsspår: stance och balans (huvudspår), svag-hand-dribbling i banorna, passning i Klump.",
      sections: [
        {
          id: "s1", title: "Incheckning + matchprat", duration: 3,
          body: "Parprat om matcherna, ta sedan 2–3 svar. Rätta inget än.\n\nSäg: \"Vad var svårast i försvaret i matchen?\""
        },
        {
          id: "s2", title: "Uppvärmning — Balans", duration: 10,
          body: "- Enbenshopp & Go (4 min): stå på ett ben med bollen. Tränaren ropar \"fram / bak / sida\" — de hoppar och landar på ett ben, håller, och sprintar på \"Gå\".\n- Spegeln (3 min): partnerspegel. Ledaren rör sig, följaren glider i sidled i stance. Byt ledare var 30:e sekund.\n- Enbens-bollkamp (3 min): par, en boll, fötterna fast i golvet, en spelare på ett ben. Omgångar på 10–15 s, byt ben.\n\nSäg: \"Knä över tå, stå still som en staty!\"\n\nSäg: \"Kontroll, inte kraft.\""
        },
        {
          id: "s3", title: "Muren — 1mot1 i banor", duration: 15,
          body: "Egen design, anpassad från 1v1 Shell Defense och Defensive Slide Relay.\nUppställning: konbanor ca 4 m breda och 10 m långa, från mittlinjen mot varje baslinje (tre banor per planhalva, upp till 12 spelare). Ett par per bana. Anfallaren börjar med bollen; försvararen ungefär en armlängd framför. Slutet på banan är mållinjen.\n\nRegler:\n\n- Anfallaren dribblar och försöker ta sig över mållinjen med bollen under kontroll, innanför konerna.\n- Försvararen stoppar henne. Vinner hon bollen är det också en vinst.\n- Foul = anfallaren gör mål: om försvararen kramar om eller tar tag i anfallaren får anfallaren målet.\n- Omgångar på 20–30 s, sedan byter de roller.\n\nSäg + visa leken (1 min): ett starkare par visar medan de andra tittar.\nSäg: \"Anfallaren ska över linjen. Försvararen ska stoppa henne. Inga knuffar, inga kramar.\"\n\nVisa stance och glidsteg (1 min): låg och bred, böjda knän, bröstet upp, en armlängd bort, händerna upp och ut — aldrig runt henne. Glid i sidled, fötterna korsas aldrig.\nSäg: \"Böj på knäna, händerna uppe! Korsa inte fötterna!\"\n\nAlla provar (30 s): några glidsteg vänster och höger på stället.\n\nGå igenom det (30 s): en omgång där anfallaren går, för att kolla reglerna.\n\nOmgång 1, spela (~3 min): full fart. Coacha bara stance, inte positionering.\n\nPaus + prat (~2 min): parprat, ta sedan svar.\nSäg: \"Var stod de som stoppade henne?\"\nSäg: \"Vad hände när någon kramade?\"\nGe det ett namn: mur — framför henne, mellan henne och linjen.\n\nHänderna-bakom-ryggen-omgång (30 s): försvararna får bara använda fötterna. Snabbt och roligt, och det bryter armvanan.\n\nOmgång 2, spela (~3 min): byt roller, samma regler.\n\n40 sekunders tyst repris:\nSäg: \"Nu stänger vi ögonen i 40 sekunder och tänker på vad vi just gjorde.\"\n\nLättare: anfallaren går. Svårare: anfallaren får bara använda svag hand, eller smalare bana.\n\nEnsam eller med assisterande: fungerar ensam. Med en assisterande, dela upp i två grupper efter bana."
        },
        {
          id: "s4", title: "Mållinjen — 3mot3", duration: 12,
          body: "Uppställning: 3mot3 halvplan. Anfallet gör poäng genom att dribbla eller passa bollen över baslinjen. Ingen korg, inget skytte.\n\n- En försvarare som springer till andra sidan för att blockera passningen lämnar målsidan öppen och blir överspelad. Det straffar precis jaga-vanan.\n- Vid bollförlust går det nya anfallet direkt.\n\nSäg: \"Bollen förlorad? Mur direkt!\"\n\nSäg: \"Stå mellan, inte bredvid.\"\n\nOm jagandet fortsätter, pausa och fråga:\nSäg: \"Var var linjen när du sprang dit?\""
        },
        {
          id: "s5", title: "Klump 3mot3 — försvarspoäng", duration: 16,
          body: "Klump som vanligt — behåll 2-sekunders passklockan. Ett försvarsstopp ger 1 poäng.\n\nVar tyst under spelet. Pausa för reflektion var 3–4:e minut."
        },
        {
          id: "s6", title: "Samling", duration: 4,
          body: "En sak att ta med sig.\n\nNamnge en försvarsaktion, per spelare.\n\nAvsluta med händerna i mitten: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "Planen förutsätter att steg 2 bekräftades 8 okt — om inte, byt Klump-blocket mot en steg-2-version. Håll dig till personligt försvar den här veckan: hjälpförsvar är för avancerat än så länge, så coacha inte rotationer eller hjälp, bara muren."
    },
    thu: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 9 · TORS 18–19",
      title: "Muren — testet",
      focus: "Spela/tillämpa onsdagens mur: låg och bred, på målsidan, fötterna inte armarna. En kort repetition i banorna, sedan är lek 3 — fritt 3mot3 utan begränsningar och utan uppmaningar — det rena steg-3-testet. Lek 4, den kontinuerliga 3mot3mot3-skytteln, är förstärkning i spel där ledord och beröm är okej.",
      sections: [
        {
          id: "t1", title: "Incheckning — återkallning", duration: 3,
          body: "Paren visar varandra, sedan visar en eller två för gruppen.\n\nSäg: \"Visa din kompis vad en mur är.\""
        },
        {
          id: "t2", title: "Uppvärmning", duration: 9,
          body: "- Spegeln (3 min): partnerspegel, följaren glider i stance.\n- Enbenshopp & Go (3 min).\n- Sten-sax-påse-kull (3 min): snabba beslut, hög energi. Ingen boll.\n\nSten-sax-påse-kull\nUppställning: par på var sin sida om mittlinjen.\nSå här: paren kör \"sten, sax, påse\". Förloraren vänder och sprintar mot baslinjen. Vinnaren jagar och försöker kulla henne innan hon kommer fram. Båda joggar tillbaka, hittar en ny partner och kör igen.\nVariationer (byt ungefär varje minut): starta sittande med raka ben, liggande på mage, liggande på rygg, i armhävningsposition, hoppande jämfota, hoppande på ett ben, eller förloraren springer baklänges.\nHåll instruktionerna till ett minimum.\n\nSäg: \"Spring för fullt!\""
        },
        {
          id: "t3", title: "Muren i banor — repetition", duration: 6,
          body: "Samma banlek som i onsdags, svårare version: anfallarna dribblar med svag hand, samma foulregel (foul = anfallaren gör mål). Ingen ny undervisning.\n\nSäg: \"Fötterna stoppar henne, inte armarna.\""
        },
        {
          id: "t4", title: "Lek 3 — fritt 3mot3, testet", duration: 13,
          body: "Halvplan, 3mot3. Inga begränsningar, inga uppmaningar. Var tyst och observera.\n\nVälj två namn per match att följa, och skriv ja eller nej för de två första punkterna.\n\nChecklista:\n\n- 1. Tar sig försvararen mellan sin spelare och korgen på egen hand?\n- 2. Fötter eller armar? Glider hon, eller sträcker sig, kramar eller tar tag?\n- 3. Lämnar hon målsidan för att jaga passningen?\n- 4. Efter en bollförlust, vänder hon och sprintar tillbaka direkt?\n- 5. Håller spacing och extrapasset fortfarande?"
        },
        {
          id: "t5", title: "Vatten", duration: 2,
          body: "Vattenpaus."
        },
        {
          id: "t6", title: "Lek 4 — kontinuerlig 3mot3mot3-skyttel", duration: 22,
          body: "Inklusive pauser.\nUppställning: en trio vid mittlinjen, två vid baslinjerna, kontinuerligt fram och tillbaka.\n\nKlump-regler (2-sekundersklocka). Ett försvarsstopp = 1 poäng. Pausa för reflektion var 3–4:e minut.\n\nDet här är förstärkningsleken: ledord och beröm med namn är okej här.\n\nSäg: \"Du är en mur!\"\n\nSäg: \"Låg och bred, händerna uppe.\"\n\nSe ett sammanbrott här som en effekt av det nya formatet, inte som resultatet av steg-3-testet. Lek 3 är den enda rena signalen."
        },
        {
          id: "t7", title: "Samling", duration: 5,
          body: "En sak att ta med sig.\n\nLyft fram en försvarsaktion med namn — med energi eller kommunikation — även om bollen gick i.\n\nAvsluta med händerna i mitten: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "Du kan inte titta på fem saker samtidigt. I lek 3, följ två namn, räkna armar mot fötter och anteckna resultatet — vecka 10 sätts utifrån det."
    }
    }
  };

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
</body>
</html>
