<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {
    en: {
    wed: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 7 · WED 17–18",
      title: "Opening Rung 3: Marking & Goal-Side",
      focus: "Marking and goal-side positioning, discovered live under transition pressure rather than lectured first — the team gets the mechanics explained, then has to find the positioning read for themselves inside continuous play, with brief pause points to question what they're seeing rather than tell them. The second half shifts mode entirely: 1v1 rim attack, explicitly framed as different from team play — when you're alone and nobody can help you, be aggressive; when you're in a group, read the spacing instead.",
      sections: [
        {
          id: "s1", title: "Opening Circle", duration: 5,
          body: "Recall the three behaviors from recent weeks.\n\nSäg: \"Förra veckan, när ni var fokuserade och inte fånade er, så funkade spacingen jättebra — ni kan redan det här.\""
        },
        {
          id: "s2", title: "Warm-Up", duration: 10,
          body: "Partner Mirror (4–5 min): one leads, one mimics — side lunges, squats, jumps (small/medium/high).\n\nBasketSmart control (5–6 min): Plankan, Knäböj med boll mot tak, Utfallssteg med boll mot tak."
        },
        {
          id: "s3", title: "Stage A — 3v3v3 Shuttle + Klump, Discovery-First", duration: 20,
          body: "Focus: marking and goal-side positioning, found live under transition pressure rather than taught up front — the only thing explained beforehand is the mechanics of the drill, not the lesson inside it.\nSetup: continuous 3v3v3 shuttle. One triplet starts at midline, two triplets wait at opposite baselines. The midline triplet attacks one baseline; the instant possession ends, that defending triplet immediately becomes attacker heading the other way. Continuous, no stopping between transitions. Klump rules layered on top: pass-clock at 2 seconds, confined spacing, first-to-1-basket.\n\nHow: before starting, explain only the mechanics — nothing about the actual lesson. A quick physical walk-through of where groups stand and how the switch triggers is probably faster than explaining it out loud. Then play — say nothing about positioning, good or bad, while it's live. The only thing worth saying during live play is effort/character praise, a different axis entirely that doesn't give away what you're waiting for them to discover.\n\nSay: \"Bra kämpat, Signe!\" for a hard recovery sprint, regardless of whether she ends up in the right spot.\n\nPause every 3–4 minutes (time, not transition count — much easier to actually hold while you're also running the clock, the spacing, and the scoring). At each pause, ask whichever question fits what just happened, then 40 seconds of silent reflection — no talking — then straight back into continuous play.\n\nSay: \"Vad hände precis innan hon var helt öppen?\"\n\nSay: \"Vem skulle du leta efter på returen?\"\n\nOver 20 minutes, that's roughly 5–6 pause points — enough spread to catch a fast-break gap, a rebound scramble, and an ordinary possession, rather than reacting to the same kind of moment every time."
        },
        {
          id: "s4", title: "Stage B — 1v1 Rim Attack, Progressive", duration: 20,
          body: "Focus: 1v1 aggression and finishing, explicitly framed as a different mode from team play — alone against a defender, be aggressive; in a group, read the spacing instead.\nSetup: half court, pairs at the rim. Three stages, same pair structure throughout, difficulty rising stage to stage.\n\nHow: framing, said once before starting.\n\nSäg: \"Det här är när du är ensam och ingen kan hjälpa dig — då ska du vara aggressiv. I Klump, när ni är flera, läser ni spacingen istället.\"\n\nStage B1 (7 min): defender starts a full step behind. Recovery-only defense.\n\nStage B2 (7 min): even start. Attacker must create her own separation.\n\nStage B3 (6 min): even start plus a ~3-second finish clock. Forces decisiveness.\n\nNo need to announce the shift between stages — let them feel the defender arriving sooner, same discovery logic as Stage A. Rotate roles every 2 reps. Praise both finishes and recovery contests by name — the contest matters even when the attacker still scores."
        },
        {
          id: "s5", title: "Closing Circle", duration: 5,
          body: "Säg: \"Vad var roligast idag?\"\n\nBehavior callback — tie it to one of the three behaviors named earlier in the circle."
        }
      ],
      tip: "The silence during live play is the entire teaching method tonight — resist narrating positioning while Stage A is running, even when you see exactly what's wrong. The pause points and the questions inside them are doing all the actual teaching; talking during play would just hand them the answer and skip the discovery. Stage B works the same way — let the defender's timing teach the stages, don't announce them."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 7 · THU 18–19",
      title: "Play & Apply — Reset Day",
      focus: "Reset the tone, keep everyone busy, and play small-sided games with real opposition. Nothing new technically.",
      sections: [
        {
          id: "t1", title: "Opening Circle: Reset", duration: 5,
          body: "Open with togetherness, not an apology — we're all here to play and learn basketball, and we do it together.\n\nSay: \"Vi är alla här för att spela och lära oss basket tillsammans — vi lyckas tillsammans, och vi misslyckas tillsammans.\"\n\nSet the floor.\n\nSay: \"Ni behöver inte älska basket varje dag. Men medan vi är här förstör vi inte för dem som vill träna.\"\n\nAgree the on/off signal (a clap pattern or raised hand = \"game on\"). Laughing is welcome between rounds, at water breaks and in the closing circle.\n\nName the reward.\n\nSay: \"Sista matchen får ni välja mellan två alternativ, om vi har fokus idag.\"\n\nQuiet check-in.\n\nSay: \"Är det någon som känner sig dålig idag?\"\n\nAnyone who's off takes a lighter role (referee, rotation helper) and joins in when ready."
        },
        {
          id: "t2", title: "Warm-Up", duration: 8,
          body: "Vote in under 30 seconds. Say both options before you say anything about choosing.\n\nSay: \"Alternativ A: Linjekul med boll. Alternativ B: Hav-Skepp-Land. Räck upp handen för A eller B.\"\n\nMajority wins and it's final. If someone pitches her own game, say:\n\nSay: \"Det är inte ett av alternativen idag. Idéburken.\"\n\nPlay the winner for 5–6 minutes, in short rounds. Each round runs 60–90 seconds, and everyone is back in at the start of the next one. If you tag or call someone out, she does something small on the spot (5 dribbles or the self-toss) and watches, so nobody waits more than a minute. At the end of each round, celebrate the last three standing, not just one winner.\n\nOption A — Linjekul med boll:\n\n- Everyone dribbles a ball and may only move on the lines. One or two taggers (with a ball too) try to touch the others.\n- Tag by touch only, with no pushing. Use only the three-point line and the baseline, so they don't pile onto one stretch of line.\n- A tagged player is out for the round (5 dribbles in the corner), then back in for the next one.\n\nOption B — Hav-Skepp-Land:\n\n- Everyone starts on one baseline. Baseline = Hav, midline = Skepp, far baseline = Land. Call a command and they react as fast as they can.\n- Commands: Hav / Skepp / Land (run to that place), Bommen kommer (lie flat on your stomach, then up fast), Kanonkula (curl up like a cannonball, then up fast), Kapten kommer (stand at attention), Hajen kommer (jump up off the floor), Piratdisco (dance), Livrädda! (lie on your back, then up fast).\n- Harder: add more commands or shorten the time between them.\n- Last woman standing: the last to do a command is out for the round. If elimination starts bringing the laughter down, switch to keeping everyone in instead — the last one does 5 frog jumps, then jumps back in.\n\nControl exercises (2 min), fixed: Knäböj and Utfallssteg with the ball overhead.\n\nSay: \"Det här gör vi alltid, det är inte ett val.\""
        },
        {
          id: "t3", title: "Game 1 — 2v1 Give-and-Go", duration: 8,
          body: "Focus: two attackers against one defender, numbers favouring the attackers — Attacker 1 drives, passes as the defender commits, Attacker 2 cuts to the rim.\nSetup: 2v1 groups, mixed so no two of the most contagious girls are together, and a focused girl in each group.\n\nHow: keep the explanation to one sentence and show it rather than talk. Praise the cut by name."
        },
        {
          id: "t4", title: "Game 2 — 2v2", duration: 10,
          body: "Focus: first-to-1-basket, winners stay and losers rotate off, so goofing costs the team straight away. Short rounds mean nobody waits long.\nSetup: half court, 2v2, rotating groups.\n\nHow: stay silent on positioning and praise effort by name. Use one quick pause only if a natural moment comes.\n\nSay: \"Vad hände precis innan hon var öppen?\""
        },
        {
          id: "t5", title: "Game 3 — 3v3, Unconstrained", duration: 14,
          body: "Focus: no clock, no zone, signals only. Count it as the rung-2 read only if they're fresh and focused today. If energy or focus is low, play it and don't log it — the plan already allows one more Thursday.\nSetup: half court, 3v3, rotating groups.\n\nHow: free play, no coaching during live play — observe only."
        },
        {
          id: "t6", title: "Game 4 — The Closed A/B Choice", duration: 10,
          body: "Focus: the closed A/B choice — the reward named in the opening circle, if focus held up tonight.\nSetup: say both options before you say the word \"choose.\"\n\nSay: \"Alternativ A: helbana 4 mot 4 med roterande lag. Alternativ B: halvplan 3 mot 3, vinnarna stannar. Räck upp handen för A eller B.\"\n\nMajority wins and it's final. If the session was messy, skip the vote and pick it yourself without a speech. Rotation in either version doubles as rest and as Oct 17 rotation practice."
        },
        {
          id: "t7", title: "Closing Circle", duration: 5,
          body: "Name two or three specific good things by name, then finish on something fun. No running."
        }
      ],
      tip: "If an assistant is there, ask them to stand near whichever group is drifting, with no correcting, just presence. If arguing starts: \"Prova en gång, sen berättar du vad du tycker.\" If energy is low from the start, drop Game 4 and extend Games 2 and 3 with more resting rotations."
    }
    },
    sv: {
    wed: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 7 · ONS 17–18",
      title: "Öppnar steg 3: Marking & Goal-Side",
      focus: "Marking och goal-side-position, upptäckt levande under press i övergångsspel istället för föreläst i förväg — laget får mekaniken förklarad, och måste sedan själva hitta positioneringsläsningen inuti kontinuerligt spel, med korta pauser för att ifrågasätta vad de ser istället för att bli tillsagda. Andra halvan byter läge helt: 1mot1-anfall mot korgen, uttryckligen inramat som skilt från lagspel — när du är ensam och ingen kan hjälpa dig, var aggressiv; när ni är i grupp, läs spacingen istället.",
      sections: [
        {
          id: "s1", title: "Öppningscirkel", duration: 5,
          body: "Minns de tre beteendena från de senaste veckorna.\n\nSäg: \"Förra veckan, när ni var fokuserade och inte fånade er, så funkade spacingen jättebra — ni kan redan det här.\""
        },
        {
          id: "s2", title: "Uppvärmning", duration: 10,
          body: "Partner-spegel (4–5 min): en leder, en imiterar — sidohopp, knäböj, hopp (liten/medium/hög).\n\nBasketSmart-kontroll (5–6 min): Plankan, Knäböj med boll mot tak, Utfallssteg med boll mot tak."
        },
        {
          id: "s3", title: "Steg A — 3mot3mot3 Shuttle + Klump, upptäckt först", duration: 20,
          body: "Fokus: marking och goal-side-position, hittad levande under press i övergångsspel istället för undervisad i förväg — det enda som förklaras i förväg är mekaniken i övningen, inte lektionen inuti den.\nUppställning: kontinuerlig 3mot3mot3-shuttle. En trio börjar vid mittlinjen, två trior väntar vid motsatta baslinjer. Mittlinje-trion anfaller en baslinje; i samma stund boll-innehavet tar slut blir den försvarande trion direkt anfallare åt andra hållet. Kontinuerligt, inga stopp mellan övergångarna. Klump-regler läggs ovanpå: passklocka på 2 sekunder, begränsad spacing, första till 1 korg.\n\nSå här: förklara bara mekaniken innan ni börjar — inget om själva lektionen. En snabb fysisk genomgång av var grupperna står och hur bytet triggas är troligen snabbare än att förklara det muntligt. Spela sedan — säg ingenting om positionering, bra eller dåligt, medan det pågår levande. Det enda värt att säga under levande spel är beröm för kämpaglöd/karaktär, en helt annan axel som inte avslöjar vad du väntar på att de ska upptäcka.\n\nSäg: \"Bra kämpat, Signe!\" för en hård returspring, oavsett om hon hamnar på rätt plats.\n\nPausa var 3:e–4:e minut (tid, inte antal övergångar — mycket lättare att faktiskt hålla medan du samtidigt sköter klockan, spacingen och poängräkningen). Vid varje paus, fråga det som passar det som just hände, sedan 40 sekunder tyst reflektion — inget prat — sedan rakt tillbaka till kontinuerligt spel.\n\nSäg: \"Vad hände precis innan hon var helt öppen?\"\n\nSäg: \"Vem skulle du leta efter på returen?\"\n\nÖver 20 minuter blir det ungefär 5–6 pauspunkter — tillräckligt utspritt för att fånga ett snabbt-anfall-glapp, en returscramble och ett vanligt boll-innehav, istället för att reagera på samma typ av stund varje gång."
        },
        {
          id: "s4", title: "Steg B — 1mot1 korgattack, progressiv", duration: 20,
          body: "Fokus: 1mot1-aggression och avslut, uttryckligen inramat som ett annat läge än lagspel — ensam mot en försvarare, var aggressiv; i grupp, läs spacingen istället.\nUppställning: halvplan, par vid korgen. Tre steg, samma parstruktur genomgående, svårighetsgraden stiger steg för steg.\n\nSå här: ramen, sagd en gång innan ni börjar.\n\nSäg: \"Det här är när du är ensam och ingen kan hjälpa dig — då ska du vara aggressiv. I Klump, när ni är flera, läser ni spacingen istället.\"\n\nSteg B1 (7 min): försvararen börjar ett helt steg bakom. Bara återhämtningsförsvar.\n\nSteg B2 (7 min): jämn start. Anfallaren måste skapa sin egen frihet.\n\nSteg B3 (6 min): jämn start plus en ~3-sekunders avslutsklocka. Tvingar fram beslutsamhet.\n\nIngen anledning att annonsera skiftet mellan stegen — låt dem känna att försvararen kommer snabbare, samma upptäckarlogik som Steg A. Rotera roller var 2:a repetition. Berömma både avslut och återhämtningsförsvar vid namn — kampen räknas även när anfallaren ändå gör mål."
        },
        {
          id: "s5", title: "Avslutningscirkel", duration: 5,

    thu: {

        {

          body: "Fokus: två anfallare mot en försvarare, numerärt övertag för anfallarna — Anfallare 1 kör, passar av när försvararen tar bollen, Anfallare 2 skär mot korgen.\nUppställning: 2mot1-grupper, blanda så att inga två av de mest smittsamt busiga tjejerna är tillsammans, och sätt en fokuserad tjej i varje grupp.\n\nSå här: håll förklaringen till en mening och visa istället för att prata. Beröm skärningen vid namn."

          body: "Fokus: det stängda A/B-valet — belöningen som namngavs i öppningscirkeln, om fokuset höll ikväll.\nUppställning: säg båda alternativen innan du säger ordet \"välj\".\n\nSäg: \"Alternativ A: helbana 4 mot 4 med roterande lag. Alternativ B: halvplan 3 mot 3, vinnarna stannar. Räck upp handen för A eller B.\"\n\nMajoriteten vinner och det är slutgiltigt. Om passet var stökigt, hoppa över röstningen och välj själv utan tal. Rotationen i båda versionerna fungerar både som vila och som övning inför bytena den 17 oktober."

      ],
      tip: "Om en assistent är där, be dem stå nära den grupp som driver iväg, utan att rätta till, bara närvaro. Om bråk börjar: \"Prova en gång, sen berättar du vad du tycker.\" Om energin är låg redan från start, släpp Lek 4 och förläng Lek 2 och 3 med fler vilorotationer."

  };

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
