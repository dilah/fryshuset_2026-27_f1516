<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --wood:#EFD9AE;
    --wood-stripe:#E4C88C;
    --card:#FFFBF3;
    --ink:#1C2A44;
    --ink-soft:#5B6980;
    --orange:#EA6A1E;
    --orange-deep:#C4530F;
    --orange-tint:#FCE3D0;
    --shadow: 0 2px 0 rgba(28,42,68,0.06), 0 8px 20px -10px rgba(28,42,68,0.25);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:repeating-linear-gradient(90deg, var(--wood-stripe) 0 3px, var(--wood) 3px 46px);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--orange);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--orange-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Archivo Black',sans-serif; font-weight:400;
    font-size:30px; line-height:1.05; margin:6px 0 8px; letter-spacing:-0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--orange); background:var(--orange-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:16.5px;line-height:1.25;margin:0;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--orange-tint); color:var(--orange-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--orange-deep);
    background:var(--orange-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--orange);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--wood); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--orange-tint); color:var(--orange-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Archivo Black',sans-serif;font-weight:400;font-size:24px;line-height:1.15;margin:14px 0 12px;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--orange-deep);
    background:var(--orange-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(28,42,68,0.25);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--orange);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSION (English + Swedish) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  const CONTENT = {
    en: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 1 · WED 17–18",
      title: "Season Kickoff",
      focus: "Re-entry and reconnection. No new technical teaching today — reconnect bodies to the ball and the group to shared expectations, and set the warm-up ritual for the season. Keep energy playful and intensity moderate; nobody has trained since spring.",
      sections: [
        {
          id: "s1", title: "Opening Circle — Incheckning", duration: 10,
          body: "Gather in a circle. Greet each player individually on the way in — high five, eye contact.\n\nSay: \"Okej allihopa, välkomna tillbaka! Kul att se er igen!\"\n\nCasual check-in: go around — one word each on something fun from the summer.\nSay: \"Berätta en grej ni gjort i sommar — bara ett ord!\"\n\nTeam behaviors (new this season, ~7 min): ask the group directly rather than dictating — three shorter questions instead of one broad one, each aimed at a different goal for the season, so the answers stay concrete instead of landing on generic \"be nice\":\n\n- \"Vad kan vi göra så att alla känns som en del av laget?\" → becoming a team\n- \"Hur peppar vi varandra när någon missar?\" → trust and fun, especially around mistakes\n- \"Vad behöver ni av oss tränare för att känna er trygga?\" → respect, and makes it mutual rather than one-directional\n\nPull one concrete answer from each question — that gives 3 behaviors, one per goal, instead of a diluted list of five. Keep them simple and visible (e.g. \"peppa varandra,\" \"klappa för försök, inte bara mål,\" \"räck upp handen\"). Repeat these at the start of every session going forward — this is the one that sticks."
        },
        {
          id: "s2", title: "Warm-Up — Simple Re-Entry", duration: 12,
          body: "Trimmed version of SBBF's BasketSmart warm-up — full version has a lot of new choreography (partner timing, hand-switching, hops) that fights against today's \"no new teaching\" goal. Keep the real injury-prevention value (the control exercises) and drop the complex coordination pieces for now. Build the rest back in over Weeks 2–3 as the group gets more used to the ritual.\n\nCues to repeat throughout: \"Knä över tå,\" \"Kontroll,\" \"Upprätt position,\" \"Tappa inte magen\"\n\n- Simple movement warm-up (5 min): jog the baseline and back, then backward jog and back, then side shuffle and back. No ball, no partners, nothing new to explain — just call each one out.\n- Plankan (1 min): full stretch, no sagging.\n- Knäböj med boll mot tak (2–3 min): ball held overhead with straight arms (not dribbled — it's just there to keep the torso upright). Slow squat down, knee over foot, back up.\n- Utfallssteg med boll mot tak (2–3 min): same ball-overhead setup. Step forward into a lunge, pause 2–3 sec at the top, back up.\n\nSave for later weeks: Temperaturstegring (partnered, hand-switching sequence), enbensknäböj, and enbenshopp-och-sprint — all genuinely useful, but each needs its own teaching moment, so they don't belong on the one day you're deliberately keeping simple."
        },
        {
          id: "s3", title: "Bolltjuven", duration: 10,
          body: "Focus: reconnecting with the ball, protecting it, low-pressure defense.\nSetup: half court, 50–75% of players have a ball.\n\nHow: ball-holders dribble around; players without a ball (\"bolltjuvar\") try to steal one. Steal it → become the dribbler; the one who lost it becomes the new thief. Must go after a different player each time.\n\nFocus points (introduce first two only today):\n- Anfall: keep dribbling when defense comes (avoid double dribble)\n- Försvar: take the ball without hitting or grabbing\n\nSay: \"Håll koll på bollen — och på vem som jagar dig!\""
        },
        {
          id: "s4", title: "Red Light / Green Light Dribble", duration: 8,
          body: "Focus: controlled stopping — ties directly into the warm-up's landing mechanics.\nSetup: full court length, everyone on the baseline with a ball.\n\nHow: \"Grön!\" = dribble forward. \"Röd!\" = stop on two feet (jump stop). Last to stop does 3 dribbles in place — keep it light, not a punishment.\n\nSay: \"Grön! ... Röd! Stanna med båda fötterna — knä över tå!\"\nEasier: walking pace is fine today for anyone still finding their rhythm."
        },
        {
          id: "s5", title: "Scrimmage — 3v3 Half Court", duration: 15,
          body: "Free play, no rule twists today — the point is touches and fun, not teaching. Rotate groups every ~5 min so everyone plays with different teammates. Great format solo since it's easy to watch and rotate.\n\nIf an assistant is here: split into two separate 3v3 games on two baskets — doubles everyone's touches.\n\nSay: \"Ha kul, testa saker, det är okej att missa!\""
        },
        {
          id: "s6", title: "Closing Circle — Utcheckning", duration: 5,
          body: "Gather in the circle. Ask what was most fun today, and re-surface one or two of the team behaviors from the opening circle.\nSay: \"Vad var roligast idag?\" / \"Vad kom vi överens om att vi skulle tänka på?\"\n\nClose with hands in the middle: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "Resist the urge to correct technique today — almost everything here is deliberately familiar (games they already know) so the focus stays on movement and reconnection, not new information. If a few girls look noticeably out of breath, that's expected after the summer gap — let them self-pace rather than push through it. This session is also your quiet baseline check: who's picked up a ball over the summer and who hasn't — useful for pairing decisions from Week 2 onward."
    },
    sv: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 1 · ONS 17–18",
      title: "Säsongsstart",
      focus: "Återstart och återkoppling. Ingen ny teknikträning idag — vi kopplar ihop kroppen med bollen igen och gruppen med gemensamma förväntningar, och sätter uppvärmningsritualen för säsongen. Håll energin lekfull och intensiteten måttlig; ingen har tränat sedan våren.",
      sections: [
        {
          id: "s1", title: "Öppningscirkel — Incheckning", duration: 10,
          body: "Samlas i en cirkel. Hälsa varje spelare individuellt när de kommer in — high five, ögonkontakt.\n\nSäg: \"Okej allihopa, välkomna tillbaka! Kul att se er igen!\"\n\nEnkel incheckning: gå laget runt — ett ord var om något roligt från sommaren.\nSäg: \"Berätta en grej ni gjort i sommar — bara ett ord!\"\n\nLagbeteenden (nytt för i år, ~7 min): fråga gruppen direkt istället för att bestämma åt dem — tre kortare frågor istället för en bred, var och en riktad mot ett eget mål för säsongen, så svaren blir konkreta istället för att landa i ett generellt \"var snälla\":\n\n- \"Vad kan vi göra så att alla känns som en del av laget?\" → att bli ett lag\n- \"Hur peppar vi varandra när någon missar?\" → tillit och glädje, särskilt kring misstag\n- \"Vad behöver ni av oss tränare för att känna er trygga?\" → respekt, och gör det ömsesidigt istället för enkelriktat\n\nPlocka fram ett konkret svar från varje fråga — det ger 3 beteenden, ett per mål, istället för en utspädd lista med fem. Håll dem enkla och synliga (t.ex. \"peppa varandra\", \"klappa för försök, inte bara mål\", \"räck upp handen\"). Upprepa dessa i början av varje pass framöver — det här är den som fastnar."
        },
        {
          id: "s2", title: "Uppvärmning — Enkel återstart", duration: 12,
          body: "Nedbantad version av SBBF:s BasketSmart-uppvärmning — hela versionen har mycket ny koreografi (partiming, handbyten, hopp) som går emot dagens mål om \"ingen ny inlärning\". Behåll det verkliga skadeförebyggande värdet (kontrollövningarna) och släpp de mer komplexa koordinationsmomenten för nu. Bygg tillbaka resten under vecka 2–3 när gruppen vant sig vid ritualen.\n\nLedord att upprepa hela tiden: \"Knä över tå\", \"Kontroll\", \"Upprätt position\", \"Tappa inte magen\"\n\n- Enkel rörelseuppvärmning (5 min): jogga längs baslinjen och tillbaka, sedan baklänges jogg och tillbaka, sedan sidohopp/glidsteg och tillbaka. Ingen boll, inga par, inget nytt att förklara — bara ropa ut varje övning.\n- Plankan (1 min): full plankposition, ingen svank.\n- Knäböj med boll mot tak (2–3 min): bollen hålls över huvudet med raka armar (inte studsad — den är bara där för att hålla överkroppen upprätt). Långsam knäböj ner, knä över fot, upp igen.\n- Utfallssteg med boll mot tak (2–3 min): samma bolluppsträckning. Kliv fram i utfall, pausa 2–3 sek i botten, upp igen.\n\nSpara till senare veckor: Temperaturstegring (parövning med handbyten), enbensknäböj och enbenshopp-och-sprint — alla genuint bra, men var och en behöver sitt eget inlärningsmoment, så de hör inte hemma på dagen du medvetet håller enkel."
        },
        {
          id: "s3", title: "Bolltjuven", duration: 10,
          body: "Fokus: återkoppling till bollen, skydda den, lågintensivt försvar.\nUppställning: halvplan. 50–75% av spelarna har en boll.\n\nSå här: bollinnehavare dribblar runt; spelare utan boll (\"bolltjuvar\") försöker sno en. Lyckas de → blir de dribblare, den som blev av med bollen blir ny tjuv. Måste gå efter en annan spelare varje gång.\n\nFokuspunkter (introducera bara de första två idag):\n- Anfall: fortsätt dribbla när försvaret kommer (undvik dubbeldribbling)\n- Försvar: ta bollen utan att slå eller nypa\n\nSäg: \"Håll koll på bollen — och på vem som jagar dig!\""
        },
        {
          id: "s4", title: "Rött ljus / Grönt ljus-dribbling", duration: 8,
          body: "Fokus: kontrollerade stopp — kopplar direkt till uppvärmningens landningsmekanik.\nUppställning: hela planens längd, alla på baslinjen med en boll.\n\nSå här: \"Grön!\" = dribbla framåt. \"Röd!\" = stanna på två fötter (jump stop). Sist att stanna gör 3 dribblingar på stället — håll det lekfullt, inte som ett straff.\n\nSäg: \"Grön! ... Röd! Stanna med båda fötterna — knä över tå!\"\nLättare variant: gånghastighet är helt okej idag för den som fortfarande hittar sitt tempo."
        },
        {
          id: "s5", title: "Matchspel — 3mot3 halvplan", duration: 15,
          body: "Fri lek, inga regeltillägg idag — poängen är bollkontakter och kul, inte inlärning. Rotera grupperna var ~5:e minut så alla spelar med olika lagkompisar. Bra format att köra själv eftersom det är lätt att bevaka och rotera.\n\nOm en assistent är på plats: dela upp i två separata 3mot3-matcher på två korgar — dubblar allas bollkontakter.\n\nSäg: \"Ha kul, testa saker, det är okej att missa!\""
        },
        {
          id: "s6", title: "Avslutningscirkel — Utcheckning", duration: 5,
          body: "Samlas i cirkeln. Fråga vad som var roligast idag, och lyft fram ett eller två av lagbeteendena från öppningscirkeln.\nSäg: \"Vad var roligast idag?\" / \"Vad kom vi överens om att vi skulle tänka på?\"\n\nAvsluta med händerna i mitten: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "Stå emot lusten att rätta teknik idag — nästan allt här är medvetet igenkännbart (lekar de redan kan) så fokus stannar på rörelse och återkoppling, inte ny information. Om några tjejer verkar ordentligt andfådda är det väntat efter sommaruppehållet — låt dem styra sitt eget tempo istället för att pressa på. Det här passet är också din tysta nulägeskoll: vem har hållit i en boll under sommaren och vem har inte — användbart för hur du delar in par från vecka 2 och framåt."
    }
  };

  let lang = 'en';
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchDeltaX = 0, touching = false;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    touchStartX = e.touches[0].clientX;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    touchDeltaX = e.touches[0].clientX - touchStartX;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:true});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
  });

  // ---------- language toggle ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));

  renderView();
})();
</script>
</body>
</html>
