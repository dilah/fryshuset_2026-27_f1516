<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fryshuset Practice Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F5F3;
    --card:#FFFFFF;
    --ink:#0F0F10;
    --ink-soft:#63636B;
    --red:#E5151F;
    --red-deep:#AD0E16;
    --red-tint:#FBE2E3;
    --shadow: 0 2px 0 rgba(0,0,0,0.08), 0 10px 24px -12px rgba(0,0,0,0.35);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter',system-ui,sans-serif;
    color:var(--ink);
    background:var(--bg);
    min-height:100vh;
    padding-bottom:64px;
  }
  .container{max-width:480px;margin:0 auto;padding:18px 16px 40px;position:relative;}

  .topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;gap:8px;}
  .topbar .brand{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;}
  .topbar-controls{display:flex;align-items:center;gap:8px;flex-shrink:0;}
  .langtoggle{display:flex;background:var(--card);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;}
  .langtoggle button{
    border:none;background:none;padding:8px 11px;font-family:'Space Mono',monospace;
    font-size:11.5px;font-weight:700;letter-spacing:.04em;color:var(--ink-soft);cursor:pointer;
  }
  .langtoggle button.active{background:var(--red);color:#fff;}
  .iconbtn{
    border:none;background:var(--card);color:var(--ink);
    width:38px;height:38px;border-radius:10px;
    display:flex;align-items:center;justify-content:center;
    box-shadow:var(--shadow); font-size:16px; cursor:pointer; flex-shrink:0;
  }
  .iconbtn:active{transform:translateY(1px);}
  .iconbtn:disabled{opacity:.35; cursor:default;}
  .iconbtn:disabled:active{transform:none;}

  header.session-head{margin-bottom:16px;}
  .eyebrow{
    font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.16em;
    color:var(--red-deep); font-weight:700; text-transform:uppercase;
  }
  h1{
    font-family:'Anton',sans-serif; font-weight:400; text-transform:uppercase;
    font-size:32px; line-height:1.05; margin:6px 0 8px; letter-spacing:0.01em;
  }
  .focus{font-size:14.5px; line-height:1.55; color:var(--ink-soft); margin:0;}

  .sideline{position:relative; margin-top:22px;}
  .sideline::before{
    content:""; position:absolute; left:19px; top:8px; bottom:8px; width:2px;
    background-image:linear-gradient(var(--ink) 60%, transparent 0%);
    background-size:2px 10px; background-repeat:repeat-y; opacity:.22;
  }
  .card{
    position:relative; padding:14px 14px 14px 50px;
    background:var(--card); border-radius:14px; box-shadow:var(--shadow);
    margin-bottom:12px;
  }
  .node{
    position:absolute; left:10px; top:16px; width:20px;height:20px;border-radius:50%;
    border:2.5px solid var(--red); background:var(--red-tint);
  }
  .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;cursor:pointer;}
  .card-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:17px;line-height:1.25;margin:0;letter-spacing:0.01em;}
  .duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:12.5px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:3px 9px; white-space:nowrap; flex-shrink:0;
  }
  .chevron{transition:transform .2s ease; color:var(--ink-soft); font-size:11px; margin-left:6px;}
  .card.open .chevron{transform:rotate(180deg);}
  .card-body{
    max-height:0; overflow:hidden; transition:max-height .28s ease;
    font-size:14px; line-height:1.6; color:var(--ink);
  }
  .card.open .card-body{max-height:1200px; margin-top:10px;}
  .card-body p{margin:0 0 10px;}
  .card-body p:last-child{margin-bottom:0;}
  .card-body ul{margin:0 0 10px; padding-left:18px;}
  .card-body li{margin-bottom:4px;}
  .card-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:8px; padding:7px 10px; margin:4px 0 10px;
  }

  .tip{
    margin-top:18px; background:var(--ink); color:#fff; border-radius:14px;
    padding:16px; box-shadow:var(--shadow);
  }
  .tip .eyebrow2{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--red);text-transform:uppercase;font-weight:700;}
  .tip p{font-size:13.5px; line-height:1.6; margin:8px 0 0; color:#E9EDF4;}

  /* ---------- Practice mode (swipe view) ---------- */
  .practice-mode{
    position:fixed; inset:0; background:var(--bg); z-index:100;
    display:none; flex-direction:column;
  }
  .practice-mode.active{display:flex;}
  .practice-topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:14px 16px; padding-top:calc(14px + env(safe-area-inset-top,0px));
    flex-shrink:0; gap:8px;
  }
  .practice-counter{font-family:'Space Mono',monospace;font-size:13px;color:var(--ink-soft);letter-spacing:.08em;}
  .practice-track{
    flex:1; display:flex; touch-action:pan-y; will-change:transform;
    min-height:0;
  }
  .p-slide{
    min-width:100%; max-width:100%; padding:4px 16px 12px;
    overflow-y:auto; display:flex; flex-direction:column;
  }
  .p-card{
    background:var(--card); border-radius:18px; padding:22px 20px; box-shadow:var(--shadow);
    display:flex; flex-direction:column; min-height:100%; flex-shrink:0;
  }
  .p-duration{
    font-family:'Space Mono',monospace; font-weight:700; font-size:15px;
    background:var(--red-tint); color:var(--red-deep); border-radius:20px;
    padding:5px 13px; align-self:flex-start;
  }
  .p-title{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:26px;line-height:1.15;margin:14px 0 12px;letter-spacing:0.01em;}
  .p-body{font-size:15px;line-height:1.65;flex:1;}
  .p-body p{margin:0 0 12px;}
  .p-body p:last-child{margin-bottom:0;}
  .p-body ul{margin:0 0 12px;padding-left:20px;}
  .p-body li{margin-bottom:5px;}
  .p-body em.say{
    display:block; font-style:italic; color:var(--red-deep);
    background:var(--red-tint); border-radius:10px; padding:9px 12px; margin:6px 0 12px;
  }
  .practice-nav{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:14px 16px calc(16px + env(safe-area-inset-bottom,0px)); flex-shrink:0;
  }
  .nav-btn{
    width:44px;height:44px;border-radius:50%;border:none;background:var(--card);
    font-size:20px;color:var(--ink);box-shadow:var(--shadow);cursor:pointer;flex-shrink:0;
  }
  .nav-btn:disabled{opacity:.3;}
  .practice-dots{display:flex;gap:6px;justify-content:center;flex:1;flex-wrap:wrap;}
  .p-dot{width:8px;height:8px;border-radius:50%;background:rgba(15,15,16,0.22);cursor:pointer;transition:all .2s ease;border:none;padding:0;}
  .p-dot.current{width:20px;border-radius:5px;background:var(--red);}
</style>
</head>
<body>
<div class="container">
  <div class="topbar">
    <span class="brand">Fryshuset · Girls 2015–16</span>
    <div class="topbar-controls">
      <div class="langtoggle" id="daytoggle">
        <button id="dayWed">WED</button>
        <button id="dayThu">THU</button>
      </div>
      <div class="langtoggle">
        <button id="langEn" class="active">EN</button>
        <button id="langSv">SV</button>
      </div>
      <button class="iconbtn" id="practiceToggle" aria-label="Swipe view">▶</button>
    </div>
  </div>

  <div id="view">
    <header class="session-head">
      <div class="eyebrow" id="v-eyebrow"></div>
      <h1 id="v-title"></h1>
      <p class="focus" id="v-focus"></p>
    </header>

    <div class="sideline" id="v-sections"></div>

    <div class="tip" id="v-tip-wrap" style="display:none;">
      <div class="eyebrow2" id="v-tip-label">Coach's tip</div>
      <p id="v-tip"></p>
    </div>
  </div>

  <div id="practice" class="practice-mode">
    <div class="practice-topbar">
      <span class="practice-counter" id="p-counter">1 / 1</span>
      <button class="iconbtn" id="practiceClose" aria-label="Close swipe view">✕</button>
    </div>
    <div class="practice-track" id="p-track"></div>
    <div class="practice-nav">
      <button class="nav-btn" id="p-prev" aria-label="Previous">‹</button>
      <div class="practice-dots" id="p-dots"></div>
      <button class="nav-btn" id="p-next" aria-label="Next">›</button>
    </div>
  </div>
</div>

<script>
(function(){

  // ---- THIS WEEK'S SESSIONS (English + Swedish, Wed + Thu) ----
  // To update: ask Claude to edit this object for next week's plan, then hit Publish again.
  // Before overwriting a week, archive the outgoing week's content to archive/week-NN-<day>.md.
  const CONTENT = {
    en: {
    wed: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 2 · WED 17–18",
      title: "Catch, Decide, Pass",
      focus: "First real teaching session of the season, built around one integrated idea rather than several separate ones: catch the ball, get into triple threat, read the defense, decide. Passing is taught through SBBF's own official 3v1 Rondo rather than static partner drilling, with the triple-threat check folded in as a coaching cue inside the game — not a separate block. We also rebuild one piece of the BasketSmart warm-up, and drop the \"peppa-poäng\" tally idea from the earlier draft in favor of specific, named recognition in the moment — closer to how the SBBF framework and Bartzokas actually recommend building this kind of culture. Closing game is a 3v2 half-court shell, not an open scrimmage — that's reserved for Thursday, which is the actual test of what's taught here.",
      sections: [
        {
          id: "s1", title: "Opening Circle — Incheckning", duration: 5,
          body: "Quick gather. Recall 1–2 of the three team behaviors from Week 1.\n\nSay: \"Kommer ni ihåg vad vi bestämde förra veckan?\"\n\nRemind the group that \"peppa varandra\" is one of those behaviors, and today you're going to start actually naming it out loud when you see it — no scoring, just calling it out the moment it happens, same as you'd point out a good pass or a good defensive slide.\n\nSay: \"Idag peppar vi varandra på riktigt — jag kommer säga era namn när jag ser det!\""
        },
        {
          id: "s2", title: "Warm-Up — Building Back the Ritual", duration: 12,
          body: "Same control exercises as Week 1 (the injury-prevention core — don't drop these). New this week: swap the plain jog for the first two pieces of BasketSmart's real \"temperaturstegring\" — the ones that add the ball back in without needing a partner-timing element yet. Save the partner-jump variants and enbensknäböj/enbenshopp-sprint for Week 3, same one-piece-at-a-time approach as Week 1.\n\nCues to repeat throughout: \"Knä över tå,\" \"Kontroll,\" \"Upprätt position,\" \"Tappa inte magen\"\n\n- Temperaturstegring, del 1 (3 min): two lines behind the baseline. Run the baseline and back, twice. First round — 4 dribbles forward, 2 dribbles backward. Switch side and dribbling hand each pass.\n- Temperaturstegring, del 2 (2 min): same two lines. Run shoulder-to-shoulder in pairs, baseline and back, no ball this time — just the paired running.\n- Plankan (1 min): full stretch, no sagging.\n- Knäböj med boll mot tak (2–3 min): ball overhead, straight arms, slow squat, knee over foot.\n- Utfallssteg med boll mot tak (2–3 min): same ball-overhead setup, step into lunge, pause 2–3 sec at the top.\n\nSave for Week 3: the two partner-jump temperaturstegring variants, enbensknäböj, and enbenshopp-och-sprint."
        },
        {
          id: "s3", title: "Catch, Decide, Pass — Triple Threat into 3v1 Rondo", duration: 18,
          body: "Focus: one integrated lesson — triple threat and passing taught together, through a game, not as two separate technical blocks. This is a deliberate change from an earlier draft of this session, which had them as separate 8+10 minute blocks; that was one new concept too many stacked side by side.\n\nPart 1 — the why, quickly (2 min): \"Every time you catch the ball, someone's trying to take it away, and you've got three choices — pass, shoot, dribble. Triple threat is how you stand so the ball's protected and all three are still open while you look. That's it — it's a pause for looking, not a pose.\" Demonstrate the full chain live once, connected: catch → land → triple threat → scan → decide.\n\nSay: \"Knän böjda, boll vid höften, titta upp — vad kan du göra härifrån?\"\n\nPart 2 — pass mechanics, quickly (3 min): say it / show it only. Chest pass: step into the pass, push through with both hands, follow through with palms out. Bounce pass: same step, aim the bounce about two-thirds of the way to your partner. One slow rep each in pairs — just enough to have the form exist before it gets tested for real.\n\nSay: \"Stega in i passet! Händerna ut framåt när du passar!\"\n\nPart 3 — 3v1 Rondo (13 min), the real teaching vehicle. Groups of 4. Three attackers spread in a triangle (cones marking a ~4–5m triangle), one defender in the middle. Attackers pass the ball around; defender tries to intercept. 10 passes in a row = attackers win the round. Defender gets the ball = defender wins. Switch defender each round. No lobbing passes over the defender's head.\n\nStaying at 3v1, not 2v1 — with only one other option, there's no real read; the whole point of this drill is the decision.\n\nNew coaching layer this week: every catch gets a quick triple-threat beat (knees bent, ball at hip, look up) before the next pass — this is where Part 1's teaching actually gets applied, live, inside the game.\n\nFocus points:\n- Attack: read who's actually open before you pass — don't just pass to the same person\n- Social: attackers count their passes out loud together\n- Defense: make yourself big with your arms, stay in a basketball stance\n- Attack (once comfortable): use a pass fake to move the defender out of position\n\nLoading options (once the basic version is running): bounce passes only; vary the triangle size (bigger = easier); \"hot potato\" — must pass within 2 seconds; add a second defender or go 4v1.\n\nSay: \"Läs av vem som är fri! Trippelhot innan du passar!\"\n\nNo basket here on purpose — this stays a closed passing/scanning game, same as the official version. The scoring/finishing rep comes next.\n\nEasier: bigger triangle, no time pressure, coach or assistant fills in as a 4th attacker if numbers are odd. Harder: bounce passes only, or the 2-second \"hot potato\" rule. Pairing: mix levels within each group of 4 — this format works with any mix, since the defender role rotates. Peppa moment: call out good \"read\" passes and loud pass-counting by name — first spot today for the named-recognition habit from the opening circle."
        },
        {
          id: "s4", title: "3v2 Half-Court Shell", duration: 20,
          body: "Focus: applying today's teaching (triple threat, reading the pass) with a slight numbers advantage — a guided practice rep, not the open test. That's Thursday's job.\nSetup: half court, 3 attackers vs. 2 defenders. Rotate players through both sides regularly, including an assistant if you have one to keep both baskets going.\n\nHow: attackers run normal offense — catch, triple threat, read, decide (pass or attack the hoop). Defenders play honest 2v3 — this is genuinely harder for them, which is the point of the numbers edge: attackers get real reps succeeding at the decision before facing full 3v3 pressure on Thursday.\n\nBecause it's a shell, not a scrimmage: feel free to pause briefly and ask a question when something's worth pointing out (\"Vad såg du där?\") — that coaching-in-the-moment is appropriate here in a way it wouldn't be during Thursday's actual test.\n\nSay: \"Trippelhot, titta upp, vem är fri?\"\n\nEasier: attackers get 2 dribbles max before deciding, to slow the decision down. Harder: switch to 3v3 briefly at the end if a group looks ready — but treat that as a preview, not the plan. Peppa moment: name specific good decisions out loud as they happen — a triple threat that led to a good read, a loud call for the ball."
        },
        {
          id: "s5", title: "Closing Circle — Utcheckning", duration: 5,
          body: "Gather in the circle. Ask who peppade well today — name someone specific, not a score.\n\nSay: \"Vem peppade bra idag? Berätta vad de gjorde!\" / \"Vad var roligast?\"\n\nClose with hands in the middle: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "Triple threat and passing are now one lesson, not two — if a girl freezes without scanning, or passes to the same teammate every time in the Rondo, ask \"vad ser du?\" rather than repeating the mechanic. Don't be surprised if the 3v2 shell still looks rough — that's exactly what it's for; the real test is Thursday's scrimmage, not today. Keep the named \"peppa\" call-outs short and in-the-moment, not a pause in play."
    },
    thu: {
      tipLabel: "Coach's tip",
      eyebrow: "WEEK 2 · THU 18–19",
      title: "Play & Apply — Small-Sided Games",
      focus: "Thursday is now built almost entirely around small-sided games, rising in size and freedom, rather than isolated repetition drills — that's the actual mechanism for \"applying what was learned,\" not just a label for the day. Everything from Wednesday (triple threat on the catch, reading who's open, named \"peppa\" recognition) gets tested with real opposition, starting small (2v2) and ending in the week's true open test (3v3, no constraints). Two of the drills from the earlier draft of this session — Pass & Follow and Pass & Sprint — are cut; they're no-defense repetition drills, which is the right tool for a Teach day, not an Apply one. New warm-up format continues from the earlier draft (SBBF's sprint/conditioning structure), since it directly answers Week 1's \"tired easily\" note and the girls responded well to Thursday's unconventional warm-up in Week 1.",
      sections: [
        {
          id: "t1", title: "Opening Circle — Incheckning", duration: 5,
          body: "Quick gather. Recall what was new on Wednesday.\n\nSay: \"Vad var nytt igår — trippelhot, och...?\"\n\nRemind the group: today is about playing, not more teaching — and \"peppa varandra\" still gets named out loud in the moment when you see it, no scoring."
        },
        {
          id: "t2", title: "Warm-Up — Sprint & Conditioning Set", duration: 12,
          body: "Same format as the earlier draft — SBBF's official speed-training structure, a direct answer to Week 1's \"tired easily\" observation, packaged as a game rather than laps. Keep the plank but compress it.\n\nCues throughout: \"Knä över tå,\" \"Kontroll\"\n\n- Promenad (2 min): baseline and back, 2–3 times, varied — walk on toes, on heels, arms out like an airplane.\n- Lätt jogg (2 min): baseline and back, high knees one way, heel-kicks the other way.\n- Lätt styrkeuppvärmning (3 min): quick round of squats, lunges, and hip lifts — 6–8 reps each, knee-control focus, no ball.\n- Korta accelerationer (2 min): short sideline-to-sideline sprints, 3–4 times, walk back to recover.\n- Tävlingssprint (3 min): sideline-to-sideline race, varied starting positions each round (standing, sitting, lying down) — playful and competitive, not a fitness test.\n- Plankan (1 min, folded into the set): full stretch, no sagging.\n\nSay: \"Nu tävlar vi — men med olika starter varje gång!\""
        },
        {
          id: "t3", title: "Game 1 — 2v2 Half Court, Catch & Decide", duration: 9,
          body: "Focus: smallest possible live-opposition format — maximum touches, direct carryover of Wednesday's Rondo lesson (catch → triple threat → read → decide), now against a real defender instead of the Rondo's shared one.\nSetup: half court divided into zones if running multiple groups at once, 2v2 in each.\n\nHow: normal play, no rule twists — the constraint here is just the small numbers, which naturally forces the catch-decide sequence into the open more often than a bigger game would.\n\nSay: \"Trippelhot när du tar emot — vem är fri?\"\n\nEasier: allow 2 dribbles before the defender can pressure closely. Harder: no dribbling at all — pure catch/triple-threat/pass or drive. Peppa moment: name a good read out loud the moment it happens."
        },
        {
          id: "t4", title: "Game 2 — No-Dribble Flow", duration: 10,
          body: "Focus: same constraint game from Week 1, now layered with this week's teaching — receivers should show a triple-threat beat on catching before deciding to pass or move.\nSetup: 3v3 groups, half court, no dribbling allowed.\n\nHow: pass and move only. Defense plays normal. Dribble = turnover. Ball still for 3 seconds → count aloud, possession to defense.\n\nSay: \"Inga dribblingar! Trippelhot när du tar emot — sen bestäm!\"\n\nSay: \"Ett... två... tre... BOLL BYTE!\"\n\nSay it playfully, like a fun callout.\n\nEasier: allow 1 dribble per possession.\n\nNote: second week of this constraint — watch whether the freezing-after-pass problem from Week 1 has actually improved, without commentating during play."
        },
        {
          id: "t5", title: "Game 3 — 3v3 Half Court, Free Play", duration: 19,
          body: "This is the week's real test — no constraints, no rule twists forced on them, just play. Everything from this week (triple threat, reading the pass, peppa) either shows up here or it doesn't; that's the information you're actually after today. Rotate groups every ~5 min so everyone plays with different teammates.\n\nIf an assistant is here: split into two separate 3v3 games on two baskets — more touches, and you can watch one group closely while they self-manage the other.\n\nSay: \"Ha kul, testa saker — och peppa varandra!\"\n\nOptional light incentive, coach's discretion depending on how the group is playing: a basket after 2+ passes counts double. Skip it entirely if the group is already playing well and you'd rather just watch pure decision-making.\n\nPeppa moment: name specific good moments as they happen — this is the last, best chance this week to reinforce the habit before the circle."
        },
        {
          id: "t6", title: "Closing Circle — Utcheckning", duration: 5,
          body: "Say: \"Vem peppade bra idag? Berätta vad de gjorde!\"\n\nAsk one player to recall a team behavior.\n\nClose with hands in the middle: \"Ett — två — tre — Fryshuset!\""
        }
      ],
      tip: "Resist the urge to coach during Game 3 — that's the point of it being the open test; save your notes for next Wednesday instead of correcting live. Watch specifically for whether triple threat shows up on catches without you prompting it during Games 1 and 2 — that's the real signal Wednesday's teaching stuck, and it's worth clocking before the pure free play in Game 3 muddies the signal with everything else going on at once."
    }
    },
    sv: {
    wed: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 2 · ONS 17–18",
      title: "Fånga, Bestäm, Passa",
      focus: "Säsongens första riktiga inlärningspass, byggt kring en sammanhållen idé istället för flera separata: fånga bollen, gå in i trippelhot, läs av försvaret, bestäm. Passning lärs ut genom SBBF:s egna officiella 3mot1 Rondo istället för statisk parövning, med trippelhot-kollen invävd som ett tränarledord inne i leken — inte som ett separat block. Vi bygger också tillbaka en bit av BasketSmart-uppvärmningen, och släpper \"peppa-poäng\"-idén från det tidigare utkastet till förmån för specifik, namngiven uppmärksamhet i stunden — närmare hur SBBF:s ramverk och Bartzokas faktiskt rekommenderar att bygga den här typen av kultur. Avslutande lek är ett 3mot2 halvplansskal, inte en öppen matchning — det sparas till torsdagen, som är det egentliga testet av det som lärs ut här.",
      sections: [
        {
          id: "s1", title: "Öppningscirkel — Incheckning", duration: 5,
          body: "Snabb samling. Minns 1–2 av de tre lagbeteendena från vecka 1.\n\nSäg: \"Kommer ni ihåg vad vi bestämde förra veckan?\"\n\nPåminn gruppen om att \"peppa varandra\" är ett av de beteendena, och att du idag börjar faktiskt säga det högt när du ser det — ingen poängräkning, bara att kalla ut det i stunden, precis som du skulle peka ut en bra passning eller ett bra försvarssteg.\n\nSäg: \"Idag peppar vi varandra på riktigt — jag kommer säga era namn när jag ser det!\""
        },
        {
          id: "s2", title: "Uppvärmning — Bygga tillbaka ritualen", duration: 12,
          body: "Samma kontrollövningar som vecka 1 (den skadeförebyggande kärnan — släpp inte dessa). Nytt denna vecka: byt ut den vanliga joggingen mot de två första delarna av BasketSmarts riktiga \"temperaturstegring\" — de som lägger tillbaka bollen utan att behöva ett partiming-moment än. Spara partner-hopp-varianterna och enbensknäböj/enbenshopp-sprint till vecka 3, samma en-sak-i-taget-princip som vecka 1.\n\nLedord att upprepa hela tiden: \"Knä över tå\", \"Kontroll\", \"Upprätt position\", \"Tappa inte magen\"\n\n- Temperaturstegring, del 1 (3 min): två led bakom baslinjen. Spring baslinjen och tillbaka, två gånger. Första varvet — 4 dribblingar framåt, 2 dribblingar bakåt. Byt sida och dribblingshand varje varv.\n- Temperaturstegring, del 2 (2 min): samma två led. Spring axel mot axel i par, baslinjen och tillbaka, ingen boll den här gången — bara den parvisa löpningen.\n- Plankan (1 min): full plankposition, ingen svank.\n- Knäböj med boll mot tak (2–3 min): boll över huvudet, raka armar, långsam knäböj, knä över fot.\n- Utfallssteg med boll mot tak (2–3 min): samma bolluppsträckning, kliv in i utfall, pausa 2–3 sek i toppen.\n\nSpara till vecka 3: de två partner-hopp-varianterna av temperaturstegring, enbensknäböj och enbenshopp-och-sprint."
        },
        {
          id: "s3", title: "Fånga, Bestäm, Passa — Trippelhot in i 3mot1 Rondo", duration: 18,
          body: "Fokus: en sammanhållen lektion — trippelhot och passning lärs ut tillsammans, genom en lek, inte som två separata teknikblock. Det här är en medveten förändring från ett tidigare utkast av det här passet, som hade dem som separata 8+10-minutersblock; det var en ny idé för mycket sida vid sida.\n\nDel 1 — varför, snabbt (2 min): \"Varje gång du fångar bollen försöker någon ta den ifrån dig, och du har tre val — passa, skjuta, dribbla. Trippelhot är hur du står så att bollen är skyddad och alla tre alternativ fortfarande är öppna medan du tittar. Det är allt — det är en paus för att titta, inte en pose.\" Visa hela kedjan live en gång, sammankopplad: fånga → landa → trippelhot → scanna → bestäm.\n\nSäg: \"Knän böjda, boll vid höften, titta upp — vad kan du göra härifrån?\"\n\nDel 2 — passningsteknik, snabbt (3 min): säg det / visa det, inget mer. Bröstpassning: kliv in i passningen, tryck igenom med båda händerna, följ igenom med handflatorna utåt. Studspassning: samma kliv, sikta studsen ungefär två tredjedelar av vägen till din partner. En långsam repetition var i par — bara tillräckligt för att formen ska finnas innan den testas på riktigt.\n\nSäg: \"Stega in i passet! Händerna ut framåt när du passar!\"\n\nDel 3 — 3mot1 Rondo (13 min), det egentliga inlärningsverktyget. Grupper om 4. Tre anfallare utspridda i en triangel (koner markerar en ~4–5 m triangel), en försvarare i mitten. Anfallarna passar bollen runt; försvararen försöker bryta. 10 passningar i rad = anfallarna vinner omgången. Försvararen får bollen = försvararen vinner. Byt försvarare varje omgång. Inga lobbpassningar över försvararens huvud.\n\nStannar på 3mot1, inte 2mot1 — med bara ett annat alternativ finns det ingen riktig läsning; hela poängen med den här övningen är beslutet.\n\nNytt tränarlager denna vecka: varje fångst får en snabb trippelhot-paus (knäna böjda, bollen vid höften, titta upp) innan nästa passning — det är här del 1:s lektion faktiskt tillämpas, live, inne i leken.\n\nFokuspunkter:\n- Anfall: läs av vem som faktiskt är fri innan du passar — passa inte bara till samma person\n- Socialt: anfallarna räknar sina passningar högt tillsammans\n- Försvar: gör dig stor med armarna, stå i baskettställning\n- Anfall (när ni är bekväma): använd en passningsfint för att flytta försvararen ur position\n\nLaddningsalternativ (när grundversionen rullar på): bara studspassningar; variera triangelns storlek (större = lättare); \"heta potatisen\" — måste passa inom 2 sekunder; lägg till en andra försvarare eller kör 4mot1.\n\nSäg: \"Läs av vem som är fri! Trippelhot innan du passar!\"\n\nMedvetet ingen korg här — det här förblir en sluten passnings-/scanningslek, precis som den officiella versionen. Avslutningsreppet med skott kommer härnäst.\n\nLättare: större triangel, ingen tidspress, tränare eller assistent fyller i som fjärde anfallare om antalet är udda. Svårare: bara studspassningar, eller 2-sekundersregeln \"heta potatisen\". Parindelning: blanda nivåer inom varje grupp om 4 — det här formatet fungerar med vilken blandning som helst, eftersom försvararrollen roterar. Peppa-stund: kalla ut bra \"läsnings\"-passningar och högljudd passningsräkning vid namn — första tillfället idag för namngivnings-vanan från öppningscirkeln."
        },
        {
          id: "s4", title: "3mot2 halvplansskal", duration: 20,
          body: "Fokus: tillämpa dagens lektion (trippelhot, läsa av passningen) med ett litet numerärt övertag — en guidad övningsrepetition, inte det öppna testet. Det är torsdagens jobb.\nUppställning: halvplan, 3 anfallare mot 2 försvarare. Rotera spelarna genom båda sidorna regelbundet, inklusive en assistent om du har en, för att hålla båda korgarna igång.\n\nSå här: anfallarna kör normalt anfall — fånga, trippelhot, läs av, bestäm (passa eller anfalla korgen). Försvararna spelar ärligt 2mot3 — det är genuint svårare för dem, vilket är poängen med det numerära övertaget: anfallarna får riktiga repetitioner där de lyckas med beslutet innan de möter fullt 3mot3-tryck på torsdagen.\n\nEftersom det är ett skal, inte en matchning: känn dig fri att pausa kort och ställa en fråga när något är värt att peka på (\"Vad såg du där?\") — den typen av coachning i stunden passar här på ett sätt som det inte skulle göra under torsdagens riktiga test.\n\nSäg: \"Trippelhot, titta upp, vem är fri?\"\n\nLättare: anfallarna får max 2 dribblingar innan de bestämmer, för att sakta ner beslutet. Svårare: byt till 3mot3 kort i slutet om en grupp ser redo ut — men se det som en försmak, inte planen. Peppa-stund: namnge specifika bra beslut högt när de händer — ett trippelhot som ledde till en bra läsning, ett högljutt rop efter bollen."
        },
        {

        }
      ],
      tip: "Trippelhot och passning är nu en lektion, inte två — om en tjej fryser utan att scanna, eller passar till samma lagkompis varje gång i Rondon, fråga \"vad ser du?\" istället för att upprepa tekniken. Bli inte förvånad om 3mot2-skalet fortfarande ser risigt ut — det är precis vad det är till för; det riktiga testet är torsdagens matchning, inte idag. Håll de namngivna \"peppa\"-utropen korta och i stunden, inte ett avbrott i spelet."
    },
    thu: {
      tipLabel: "Tränartips",
      eyebrow: "VECKA 2 · TORS 18–19",
      title: "Spela & Tillämpa — Småspel",
      focus: "Torsdagen byggs nu nästan helt kring småspel, som växer i storlek och frihet, istället för isolerade repetitionsövningar — det är den faktiska mekanismen för att \"tillämpa det som lärts in\", inte bara en etikett för dagen. Allt från onsdagen (trippelhot vid fångst, läsa av vem som är fri, namngiven \"peppa\"-uppmärksamhet) testas mot riktigt motstånd, med start i det lilla (2mot2) och avslutning i veckans riktiga öppna test (3mot3, inga begränsningar). Två av övningarna från det tidigare utkastet av det här passet — Pass & Följ och Pass & Sprint — är borttagna; de är repetitionsövningar utan försvar, vilket är rätt verktyg för en inlärningsdag, inte en tillämpningsdag. Det nya uppvärmningsformatet fortsätter från det tidigare utkastet (SBBF:s sprint-/konditionsstruktur), eftersom det direkt svarar på vecka 1:s notering om att \"bli trötta lätt\", och tjejerna svarade bra på torsdagens okonventionella uppvärmning i vecka 1.",
      sections: [
        {
          id: "t1", title: "Öppningscirkel — Incheckning", duration: 5,
          body: "Snabb samling. Minns vad som var nytt igår.\n\nSäg: \"Vad var nytt igår — trippelhot, och...?\"\n\nPåminn gruppen: idag handlar det om att spela, inte mer inlärning — och \"peppa varandra\" kallas fortfarande ut högt i stunden när du ser det, ingen poängräkning."
        },
        {
          id: "t2", title: "Uppvärmning — Sprint- och konditionspass", duration: 12,
          body: "Samma format som det tidigare utkastet — SBBF:s officiella snabbhetsträningsstruktur, ett direkt svar på vecka 1:s observation \"blir trötta lätt\", paketerat som en lek istället för varv. Behåll plankan men korta ner den.\n\nLedord hela tiden: \"Knä över tå\", \"Kontroll\"\n\n- Promenad (2 min): baslinjen och tillbaka, 2–3 gånger, varierat — gå på tå, på hälarna, armarna ut som ett flygplan.\n- Lätt jogg (2 min): baslinjen och tillbaka, höga knän åt ena hållet, hälsparkar åt andra hållet.\n- Lätt styrkeuppvärmning (3 min): snabb runda med knäböj, utfall och höftlyft — 6–8 repetitioner var, fokus på knäkontroll, ingen boll.\n- Korta accelerationer (2 min): korta sprintar sidlinje till sidlinje, 3–4 gånger, gå tillbaka för återhämtning.\n- Tävlingssprint (3 min): sidlinje-till-sidlinje-lopp, varierade startpositioner varje omgång (stående, sittande, liggande) — lekfullt och tävlingsinriktat, inte ett konditionstest.\n- Plankan (1 min, invävd i passet): full plankposition, ingen svank.\n\nSäg: \"Nu tävlar vi — men med olika starter varje gång!\""
        },
        {
          id: "t3", title: "Lek 1 — 2mot2 halvplan, fånga & bestäm", duration: 9,
          body: "Fokus: minsta möjliga format med levande motstånd — max antal bollkontakter, direkt vidareförd från onsdagens Rondo-lektion (fånga → trippelhot → läs av → bestäm), nu mot en riktig försvarare istället för Rondons delade en.\nUppställning: halvplan uppdelat i zoner om ni kör flera grupper samtidigt, 2mot2 i varje.\n\nSå här: normalt spel, inga regeltillägg — begränsningen här är bara det låga antalet spelare, vilket naturligt tvingar fram fånga-bestäm-sekvensen öppet oftare än en större lek skulle göra.\n\nSäg: \"Trippelhot när du tar emot — vem är fri?\"\n\nLättare: tillåt 2 dribblingar innan försvararen får pressa tätt. Svårare: ingen dribbling alls — bara fånga/trippelhot/passa eller ta sig till korgen. Peppa-stund: namnge en bra läsning högt i stunden den händer."
        },
        {
          id: "t4", title: "Lek 2 — Ingen-dribbling-flöde", duration: 10,
          body: "Fokus: samma begränsningslek från vecka 1, nu lagd ovanpå den här veckans lektion — mottagare ska visa en trippelhot-paus vid fångst innan de bestämmer sig för att passa eller röra sig.\nUppställning: 3mot3-grupper, halvplan, ingen dribbling tillåten.\n\nSå här: bara passning och rörelse. Försvaret spelar normalt. Dribbling = bollen byter sida. Bollen stilla i 3 sekunder → räkna högt, bollen till försvaret.\n\nSäg: \"Inga dribblingar! Trippelhot när du tar emot — sen bestäm!\"\n\nSäg: \"Ett... två... tre... BOLL BYTE!\"\n\nSäg det lekfullt, som ett kul rop.\n\nLättare: tillåt 1 dribbling per boll-innehav.\n\nNot: andra veckan med den här begränsningen — se om frysproblemet efter passning från vecka 1 faktiskt har förbättrats, utan att kommentera under spelet."

          body: "Det här är veckans riktiga test — inga begränsningar, inga regeltillägg påtvingade dem, bara spel. Allt från den här veckan (trippelhot, läsa av passningen, peppa) visar sig antingen här eller inte; det är den informationen du faktiskt vill ha idag. Rotera grupperna var ~5:e minut så alla spelar med olika lagkompisar.\n\nOm en assistent är på plats: dela upp i två separata 3mot3-matcher på två korgar — fler bollkontakter, och du kan bevaka en grupp noga medan de sköter sig själva i den andra.\n\nSäg: \"Ha kul, testa saker — och peppa varandra!\"\n\nValfri lätt sporre, tränarens omdöme beroende på hur gruppen spelar: en korg efter 2+ passningar räknas dubbelt. Hoppa över det helt om gruppen redan spelar bra och du hellre bara vill titta på rent beslutsfattande.\n\nPeppa-stund: namnge specifika bra ögonblick när de händer — det här är veckans sista och bästa chans att förstärka vanan innan cirkeln."

        {
          id: "t6", title: "Avslutningscirkel — Utcheckning", duration: 5,
          body: "Säg: \"Vem peppade bra idag? Berätta vad de gjorde!\"\n\nBe en spelare minnas ett lagbeteende.\n\nAvsluta med händerna i mitten: \"Ett — två — tre — Fryshuset!\""
        }

      tip: "Stå emot lusten att coacha under lek 3 — det är hela poängen med att det är det öppna testet; spara dina anteckningar till nästa onsdag istället för att rätta live. Titta specifikt efter om trippelhot dyker upp vid fångst utan att du behöver påminna om det under lek 1 och 2 — det är den riktiga signalen på att onsdagens lektion fastnade, och det är värt att notera innan den fria leken i lek 3 gör signalen svårare att läsa av med allt annat som händer samtidigt."

  };

  function defaultDay(){
    // Thursday shows Thursday's plan; every other day defaults to
    // Wednesday's, since it's either today's or the next upcoming session.
    return new Date().getDay() === 4 ? 'thu' : 'wed';
  }

  let lang = 'en';
  let day = defaultDay();
  let practiceIndex = 0;
  let openSection = null;

  function data(){ return CONTENT[lang][day]; }

  function escapeHtml(s){
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }
  function renderBody(text){
    const blocks = text.split(/\n\s*\n/);
    let html = '';
    blocks.forEach(block => {
      const lines = block.split('\n').filter(l => l.length);
      if(!lines.length) return;
      if(lines.every(l => l.trim().startsWith('- '))){
        html += '<ul>' + lines.map(l => '<li>'+escapeHtml(l.trim().slice(2))+'</li>').join('') + '</ul>';
      } else {
        lines.forEach(line => {
          const sayMatch = line.match(/^(Say|Säg):\s*(.*)$/);
          if(sayMatch){
            html += '<em class="say">'+escapeHtml(sayMatch[2])+'</em>';
          } else {
            html += '<p>'+escapeHtml(line)+'</p>';
          }
        });
      }
    });
    return html;
  }

  function renderView(){
    const d = data();
    document.getElementById('v-eyebrow').textContent = d.eyebrow || '';
    document.getElementById('v-title').textContent = d.title || '';
    document.getElementById('v-focus').textContent = d.focus || '';

    const wrap = document.getElementById('v-sections');
    if(!d.sections.length){
      wrap.innerHTML = '';
      document.getElementById('practiceToggle').disabled = true;
      document.getElementById('v-tip-wrap').style.display = 'none';
      return;
    }
    document.getElementById('practiceToggle').disabled = false;
    wrap.innerHTML = d.sections.map(s => {
      const isOpen = openSection === s.id;
      return `
      <div class="card ${isOpen?'open':''}">
        <div class="node"></div>
        <div class="card-head" data-toggle="${s.id}">
          <p class="card-title">${escapeHtml(s.title)}</p>
          <div style="display:flex;align-items:center;">
            <span class="duration">${s.duration}:00</span>
            <span class="chevron">▾</span>
          </div>
        </div>
        <div class="card-body">${renderBody(s.body || '')}</div>
      </div>
    `;
    }).join('');

    wrap.querySelectorAll('[data-toggle]').forEach(el=>{
      el.addEventListener('click', ()=>{
        const id = el.getAttribute('data-toggle');
        openSection = (openSection === id) ? null : id;
        renderView();
      });
    });

    if(d.tip){
      document.getElementById('v-tip-wrap').style.display = 'block';
      document.getElementById('v-tip-label').textContent = d.tipLabel || "Coach's tip";
      document.getElementById('v-tip').textContent = d.tip;
    } else {
      document.getElementById('v-tip-wrap').style.display = 'none';
    }
  }

  // ---------- swipe view ----------
  const pTrack = document.getElementById('p-track');

  function openPractice(){
    practiceIndex = 0;
    renderPracticeSlides();
    document.getElementById('practice').classList.add('active');
  }
  function closePractice(){
    document.getElementById('practice').classList.remove('active');
  }

  function renderPracticeSlides(){
    const d = data();
    pTrack.innerHTML = d.sections.map(s => `
      <div class="p-slide">
        <div class="p-card">
          <span class="p-duration">${s.duration}:00</span>
          <h2 class="p-title">${escapeHtml(s.title)}</h2>
          <div class="p-body">${renderBody(s.body || '')}</div>
        </div>
      </div>
    `).join('');
    goToSlide(practiceIndex, false);
  }

  function renderDots(){
    const d = data();
    const dotsWrap = document.getElementById('p-dots');
    dotsWrap.innerHTML = d.sections.map((s,i)=>{
      const isCur = i === practiceIndex;
      return `<button class="p-dot ${isCur?'current':''}" data-goto="${i}" aria-label="Step ${i+1}"></button>`;
    }).join('');
    dotsWrap.querySelectorAll('[data-goto]').forEach(el=>{
      el.addEventListener('click', ()=> goToSlide(Number(el.getAttribute('data-goto'))));
    });
  }

  function goToSlide(i, animate){
    const d = data();
    if(animate === undefined) animate = true;
    practiceIndex = Math.max(0, Math.min(d.sections.length - 1, i));
    pTrack.style.transition = animate ? 'transform .3s ease' : 'none';
    pTrack.style.transform = 'translateX(-' + (practiceIndex * 100) + '%)';
    document.getElementById('p-counter').textContent = (practiceIndex + 1) + ' / ' + d.sections.length;
    document.getElementById('p-prev').disabled = practiceIndex === 0;
    document.getElementById('p-next').disabled = practiceIndex === d.sections.length - 1;
    renderDots();
  }

  document.getElementById('practiceToggle').addEventListener('click', openPractice);
  document.getElementById('practiceClose').addEventListener('click', closePractice);
  document.getElementById('p-prev').addEventListener('click', ()=> goToSlide(practiceIndex - 1));
  document.getElementById('p-next').addEventListener('click', ()=> goToSlide(practiceIndex + 1));

  let touchStartX = 0, touchStartY = 0, touchDeltaX = 0, touching = false, axis = null;
  const AXIS_THRESHOLD = 8;
  pTrack.addEventListener('touchstart', e=>{
    touching = true;
    axis = null;
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
    touchDeltaX = 0;
    pTrack.style.transition = 'none';
  }, {passive:true});
  pTrack.addEventListener('touchmove', e=>{
    if(!touching) return;
    const dx = e.touches[0].clientX - touchStartX;
    const dy = e.touches[0].clientY - touchStartY;

    if(axis === null){
      if(Math.abs(dx) < AXIS_THRESHOLD && Math.abs(dy) < AXIS_THRESHOLD) return;
      axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
    }
    if(axis === 'y') return; // let the card scroll vertically, untouched

    e.preventDefault();
    touchDeltaX = dx;
    const basePct = -practiceIndex * 100;
    const dragPct = (touchDeltaX / pTrack.clientWidth) * 100;
    pTrack.style.transform = 'translateX(' + (basePct + dragPct) + '%)';
  }, {passive:false});
  pTrack.addEventListener('touchend', ()=>{
    touching = false;
    if(axis === 'y'){ axis = null; return; }
    const d = data();
    if(touchDeltaX < -50 && practiceIndex < d.sections.length - 1){
      goToSlide(practiceIndex + 1);
    } else if(touchDeltaX > 50 && practiceIndex > 0){
      goToSlide(practiceIndex - 1);
    } else {
      goToSlide(practiceIndex);
    }
    touchDeltaX = 0;
    axis = null;
  });

  // ---------- language + day toggles ----------
  function setLang(newLang){
    lang = newLang;
    document.getElementById('langEn').classList.toggle('active', lang === 'en');
    document.getElementById('langSv').classList.toggle('active', lang === 'sv');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  function setDay(newDay){
    day = newDay;
    document.getElementById('dayWed').classList.toggle('active', day === 'wed');
    document.getElementById('dayThu').classList.toggle('active', day === 'thu');
    openSection = null;
    renderView();
    if(document.getElementById('practice').classList.contains('active')){
      renderPracticeSlides();
    }
  }
  document.getElementById('langEn').addEventListener('click', ()=> setLang('en'));
  document.getElementById('langSv').addEventListener('click', ()=> setLang('sv'));
  document.getElementById('dayWed').addEventListener('click', ()=> setDay('wed'));
  document.getElementById('dayThu').addEventListener('click', ()=> setDay('thu'));

  document.getElementById('dayWed').classList.toggle('active', day === 'wed');
  document.getElementById('dayThu').classList.toggle('active', day === 'thu');
  renderView();
})();
</script>
